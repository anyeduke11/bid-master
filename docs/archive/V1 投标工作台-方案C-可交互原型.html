<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投标工作台 bid-master · 方案C「仪表间」· 可交互原型</title>
<style>
/* ==========================================================================
   投标工作台 bid-master · 方案C「仪表间」· 精密工程仪表
   冷白/石墨 · 信号蓝 · 分段标尺 · 检验单 · 精工表格 · 严格模块网格
   ========================================================================== */
:root{
  /* 面 */
  --bg:#f2f3f4; --surface:#ffffff; --sunken:#e9eaec;
  --line:#d5d7db; --line-soft:#e4e6e9; --hover:#f7f8f9;
  /* 墨 */
  --ink:#15181e; --ink-2:#3b3d45; --ink-3:#656a76; --ink-4:#9ba1ab;
  /* 信号 */
  --accent:#1868F2; --accent-2:#0F56D9; --accent-tint:rgba(24,104,242,.06);
  --ok:#1E8E4E; --ok-tint:#E3F0E7;
  --warn:#C0761A; --warn-tint:#F7EEDF;
  --danger:#CC3327; --danger-tint:#F8E7E5;
  /* 结构 */
  --r2:2px; --r4:4px; --r6:6px;
  --shadow-btn:0 1px 1px rgba(21,24,30,.05),0 2px 2px rgba(21,24,30,.05);
  --font-ui:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --font-data:"SF Mono","Menlo","Consolas","Courier New",monospace;
  --font-label:"Helvetica Neue","Avenir Next","Segoe UI",sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:400 13.5px/1.55 var(--font-ui);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}
::selection{background:rgba(24,104,242,.16)}
svg.ic{width:16px;height:16px;flex:none;color:currentColor}
svg.ic-lg{width:18px;height:18px}

/* ===== 微标签体系 ===== */
.lbl{font-size:11px;letter-spacing:.04em;color:var(--ink-3)}
.lbl-en{font-family:var(--font-label);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.unit{font-size:11px;color:var(--ink-3);margin-left:3px}
.muted{color:var(--ink-3)}
.dim{color:var(--ink-4)}

/* ===== 应用壳层 ===== */
.app{display:grid;grid-template-columns:220px 1fr;height:100vh;min-width:0}
.nav-col{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.brand .brand-name{font-size:14px;font-weight:600;letter-spacing:.01em;color:var(--ink);display:flex;align-items:baseline;gap:6px}
.brand .brand-name .bm{font-family:var(--font-data);font-size:12px;color:var(--ink-3);font-weight:400}
.brand .brand-sub{margin-top:5px;display:flex;align-items:center;gap:6px}
.brand .brand-sub .lbl-en{color:var(--ink-4)}
.nav-list{flex:1;padding:10px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r4);color:var(--ink-2);text-align:left;width:100%;border:1px solid transparent;position:relative;min-height:36px}
.nav-item .n{font-family:var(--font-data);font-size:10.5px;color:var(--ink-4);width:18px;flex:none;letter-spacing:.02em}
.nav-item .t{font-size:13px;flex:1;letter-spacing:.01em}
.nav-item .ic{color:var(--ink-4)}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-item:hover .ic{color:var(--ink-3)}
.nav-item.active{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow-btn)}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:2px;background:var(--accent)}
.nav-item.active .n{color:var(--accent)}
.nav-item.active .ic{color:var(--ink)}
.nav-item .nbadge{margin-left:auto;font-family:var(--font-data);font-size:10.5px;min-width:18px;height:16px;padding:0 5px;border-radius:8px;background:var(--danger-tint);color:var(--danger);display:inline-flex;align-items:center;justify-content:center;border:1px solid #e8c4bf}
.nav-foot{padding:12px 18px 14px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.7;color:var(--ink-4);letter-spacing:.02em}
.main-col{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:52px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
.crumb{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:7px;white-space:nowrap;min-width:0;overflow:hidden}
.crumb .sep{color:var(--ink-4);font-family:var(--font-data)}
.crumb .cmain{font-weight:600}
.crumb .cid{font-family:var(--font-data);font-size:12px;color:var(--ink-3)}
.readouts{margin-left:auto;display:flex;align-items:center;gap:0}
.ro{display:flex;align-items:baseline;gap:6px;padding:0 14px;border-left:1px solid var(--line-soft)}
.ro .ro-k{font-size:10.5px;letter-spacing:.04em;color:var(--ink-4);white-space:nowrap}
.ro .ro-v{font-family:var(--font-data);font-size:14px;color:var(--ink);letter-spacing:0}
.ro .ro-u{font-size:10.5px;color:var(--ink-3)}
.clock{display:flex;align-items:center;gap:7px;padding-left:14px;border-left:1px solid var(--line-soft);white-space:nowrap}
.clock .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.clock .sync-dot.stale{background:var(--warn)}
.clock .clock-t{font-family:var(--font-data);font-size:12px;color:var(--ink-2)}
.clock .clock-k{font-size:10.5px;color:var(--ink-4);letter-spacing:.04em}
#viewRoot{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 22px 96px;min-height:0}
#viewRoot>*{max-width:1440px;margin-left:auto;margin-right:auto}

/* ===== 通用元件 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);color:var(--ink);font-size:12.5px;letter-spacing:.01em;white-space:nowrap;transition:background 120ms,border-color 120ms;box-shadow:var(--shadow-btn)}
.btn:hover{background:var(--hover);border-color:#c3c7cd}
.btn:active{transform:translateY(.5px)}
.btn .ic{width:14px;height:14px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-quiet{border-color:transparent;background:transparent;box-shadow:none;color:var(--ink-2)}
.btn-quiet:hover{background:var(--hover);border-color:transparent}
.btn-danger{color:var(--danger);border-color:#e2b7b2}
.btn-danger:hover{background:var(--danger-tint);border-color:#d9a49e}
.btn-sm{height:24px;padding:0 9px;font-size:11.5px;border-radius:var(--r2)}
.btn[disabled],.btn[aria-disabled="true"]{color:var(--ink-4);background:var(--sunken);border-color:var(--line-soft);cursor:not-allowed;box-shadow:none}
.btn[disabled]:hover,.btn[aria-disabled="true"]:hover{background:var(--sunken);border-color:var(--line-soft)}
.btn.loading{pointer-events:none;color:transparent !important;position:relative}
.btn.loading::after{content:"";position:absolute;width:12px;height:12px;border:1.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn-secondary.loading::after{border-color:rgba(21,24,30,.2);border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r2);color:var(--ink-3);border:1px solid transparent}
.icon-btn:hover{background:var(--hover);color:var(--ink);border-color:var(--line-soft)}
.link-btn{color:var(--accent);font-size:12.5px;padding:0;border-radius:2px;display:inline-flex;align-items:center;gap:4px}
.link-btn:hover{color:var(--accent-2);text-decoration:underline}
.link-btn .ic{width:13px;height:13px}

/* QC 标签（三态统一） */
.qc{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border:1px solid;border-radius:var(--r2);font-size:11px;letter-spacing:.04em;white-space:nowrap;background:var(--surface)}
.qc .qcd{width:5px;height:5px;flex:none}
.qc-ok{border-color:#9fc9ac;color:var(--ok);background:var(--ok-tint)}
.qc-ok .qcd{background:var(--ok)}
.qc-pending{border-color:#c9ccd2;color:var(--ink-3);background:var(--sunken)}
.qc-pending .qcd{background:var(--ink-4)}
.qc-block{border-color:#e0aca6;color:var(--danger);background:var(--danger-tint)}
.qc-block .qcd{background:var(--danger)}
.qc-warn{border-color:#dfc39b;color:var(--warn);background:var(--warn-tint)}
.qc-warn .qcd{background:var(--warn)}
.qc-info{border-color:#b9cdec;color:var(--accent);background:var(--accent-tint)}
.qc-info .qcd{background:var(--accent)}

/* 优先级 */
.prio{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid var(--ink);border-radius:var(--r2);font-family:var(--font-data);font-size:10.5px;letter-spacing:.03em}
.prio-p0{background:var(--ink);color:#fff;border-color:var(--ink)}
.prio-p1{color:var(--ink-2);border-color:#b9bdc5;background:var(--surface)}
.prio-p2{color:var(--ink-4);border-color:var(--line);background:var(--surface)}

/* 读数块 */
.readout{border-top:1px solid var(--ink);padding-top:7px;min-width:0}
.readout .ro-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);font-family:var(--font-label)}
.readout .ro-cn{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;margin-left:5px;font-family:var(--font-ui);text-transform:none;font-weight:400}
.readout .ro-val{margin-top:3px;font-family:var(--font-data);font-size:19px;line-height:1.15;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.readout .ro-val .ro-unit{font-size:11px;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.readout .ro-sub{margin-top:2px;font-size:11px;color:var(--ink-3)}
.readout.ro-accent{border-top-color:var(--accent)}
.readout.ro-warn{border-top-color:var(--warn)}
.readout.ro-danger{border-top-color:var(--danger)}
.readout.ro-ok{border-top-color:var(--ok)}

/* 章节头（1px 结构线） */
.shead{display:flex;align-items:baseline;gap:9px;border-top:1px solid var(--line);padding-top:11px;margin-top:24px}
.shead .snum{font-family:var(--font-data);font-size:11px;color:var(--ink-4);letter-spacing:.04em}
.shead .sname{font-size:13.5px;font-weight:600;letter-spacing:.01em}
.shead .sen{font-family:var(--font-label);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.shead .sright{margin-left:auto;display:flex;align-items:center;gap:8px}
.shead .sline{flex:1}

/* 精工表格 */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface)}
.pt{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.pt thead th{background:var(--sunken);border-bottom:1px solid var(--line);font-weight:500;font-size:10.5px;letter-spacing:.05em;color:var(--ink-3);text-align:left;padding:7px 12px;white-space:nowrap}
.pt thead th.num,.pt td.num{text-align:right}
.pt td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap}
.pt tbody tr:last-child td{border-bottom:none}
.pt tbody tr{transition:background 120ms}
.pt tbody tr:hover{background:var(--hover)}
.pt tbody tr.clickable{cursor:pointer}
.pt .num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.pt .td-main{font-weight:500;color:var(--ink)}
.pt .td-sub{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;font-weight:400}
.pt tfoot td{background:var(--sunken);border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
.table-note{font-size:11px;color:var(--ink-4);margin-top:6px;letter-spacing:.02em}

/* 状态方点 */
.st-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.st-dot::before{content:"";width:6px;height:6px;flex:none;border-radius:1px}
.st-ok::before{background:var(--ok)}
.st-warn::before{background:var(--warn)}
.st-danger::before{background:var(--danger)}
.st-idle::before{background:var(--ink-4)}
.st-info::before{background:var(--accent)}

/* 空态（检验完成/无记录） */
.empty-box{border:1px dashed var(--line);border-radius:var(--r4);padding:22px 18px;text-align:center;background:var(--surface)}
.empty-box .em-t{font-family:var(--font-data);font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.empty-box .em-s{font-size:11.5px;color:var(--ink-4);margin-top:4px}
.empty-cell{padding:14px 12px;font-family:var(--font-data);font-size:11px;color:var(--ink-4);letter-spacing:.03em}

/* ===== V1 管线 ===== */
.vhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:6px}
.vhead .vt{font-size:20px;font-weight:600;letter-spacing:.01em}
.vhead .vs{font-size:12px;color:var(--ink-3);margin-top:3px;max-width:620px}
.vhead .vright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fgroup{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);padding:2px}
.fbtn{height:24px;padding:0 10px;font-size:11.5px;color:var(--ink-2);border-radius:var(--r2);letter-spacing:.02em}
.fbtn:hover{background:var(--hover)}
.fbtn.on{background:var(--ink);color:#fff}
.fselect{height:30px;border:1px solid var(--line);border-radius:var(--r4);background-color:var(--surface);padding:0 8px;font-size:12px;color:var(--ink);box-shadow:var(--shadow-btn)}
.filter-note{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.pipe-grid{display:grid;grid-template-columns:1fr 296px;gap:18px;margin-top:16px;align-items:start}
.matrix{border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);overflow:hidden}
.prow{border-bottom:1px solid var(--line-soft)}
.prow:last-child{border-bottom:none}
.prow-head{display:grid;grid-template-columns:96px 84px 118px 120px 1fr 26px;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:background 120ms;min-height:44px}
.prow-head:hover{background:var(--hover)}
.prow-head:focus-visible{outline-offset:-2px}
.prow-head .ps{display:flex;align-items:baseline;gap:7px}
.prow-head .ps .ps-code{font-family:var(--font-data);font-size:13px;font-weight:600;letter-spacing:.02em}
.prow-head .ps .ps-name{font-size:11.5px;color:var(--ink-3)}
.prow-head .pm{font-family:var(--font-data);font-size:12px;color:var(--ink-2)}
.prow-head .pm.num{text-align:right}
.prow-head .pm .pm-u{font-size:10px;color:var(--ink-4);margin-left:2px;font-family:var(--font-ui)}
.prow-head .pgate{display:flex;gap:6px;align-items:center}
.prow-head .pkey{font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow-head .pkey .kmono{font-family:var(--font-data);font-size:11px;color:var(--ink-4);margin-left:6px}
.prow-head .pcaret{color:var(--ink-4);display:flex;justify-content:center;transition:transform 120ms}
.prow.open .pcaret{transform:rotate(90deg)}
.prow-exp{display:none;padding:4px 14px 16px;background:linear-gradient(180deg,var(--surface) 0%,#fcfcfd 100%)}
.prow.open .prow-exp{display:block}
.pipe-cards{display:flex;gap:12px;flex-wrap:wrap;padding-top:8px}
.bidcard{width:322px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);padding:11px 12px 10px;transition:border-color 120ms,box-shadow 120ms,transform 120ms;position:relative}
.bidcard:hover{border-color:#b7bbc3;box-shadow:0 2px 6px rgba(21,24,30,.07);transform:translateY(-1px)}
.bidcard .bc-top{display:flex;align-items:center;gap:7px}
.bidcard .bc-client{font-size:13.5px;font-weight:600;letter-spacing:.01em}
.bidcard .bc-span{margin-left:auto;display:flex;gap:5px}
.bidcard .bc-proj{font-size:12px;color:var(--ink-2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bidcard .bc-meta{display:flex;align-items:center;gap:8px;margin-top:7px;font-family:var(--font-data);font-size:11px;color:var(--ink-3)}
.bidcard .bc-meta .bc-id{color:var(--ink-2)}
.bidcard .bc-foot{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft)}
.bidcard .bc-due{font-size:11px;color:var(--ink-3)}
.bidcard .bc-due .m{font-family:var(--font-data)}
.bidcard .bc-due .due-warn{color:var(--warn)}
.bidcard .bc-due .due-danger{color:var(--danger)}
.bidcard .bc-open{margin-left:auto;font-size:11.5px;color:var(--accent);display:inline-flex;align-items:center;gap:3px}
.bidcard .bc-open .ic{width:12px;height:12px}
.bidcard .bc-title-btn{font:inherit;color:inherit;text-align:left;padding:0;display:block}
.bidcard .bc-title-btn:hover .bc-client{text-decoration:underline}
.badge-btn{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:var(--r2);border:1px solid;font-size:10.5px;letter-spacing:.03em}
.badge-block{border-color:#e0aca6;color:var(--danger);background:var(--danger-tint)}
.badge-warn{border-color:#dfc39b;color:var(--warn);background:var(--warn-tint)}
.s9-strip{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);margin-top:12px}
.s9-strip .s9-code{font-family:var(--font-data);font-size:12px;color:var(--ink-3)}
.s9-strip .s9-main{font-size:12.5px}
.s9-strip .s9-meta{font-family:var(--font-data);font-size:11.5px;color:var(--ink-3)}
.s9-strip .btn{margin-left:auto}
.pipe-side{position:sticky;top:0}
.side-panel{border:1px solid var(--line);border-radius:var(--r4);background:var(--surface)}
.side-panel .sp-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunken);border-radius:var(--r4) var(--r4) 0 0}
.side-panel .sp-head .sp-t{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-2)}
.side-panel .sp-head .sp-n{margin-left:auto;font-family:var(--font-data);font-size:11px;color:var(--ink-4)}
.urg-row{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background 120ms;width:100%;text-align:left}
.urg-row:last-child{border-bottom:none}
.urg-row:hover{background:var(--hover)}
.urg-row .urg-main{flex:1;min-width:0}
.urg-row .urg-t{font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urg-row .urg-s{font-size:11px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;align-items:center}
.urg-row .urg-d{font-family:var(--font-data);font-size:11.5px;color:var(--ink-2);flex:none;text-align:right;margin-top:2px}
.urg-row .urg-d .du{font-size:10px;color:var(--ink-4)}

/* ===== V2 深潜 ===== */
.dive-head{display:flex;gap:20px;align-items:flex-start;padding-top:6px;flex-wrap:wrap}
.dh-left{min-width:0}
.dh-idrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh-id{font-family:var(--font-data);font-size:20px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.dh-title{font-size:15px;font-weight:600;margin-top:6px}
.dh-meta{margin-top:5px;font-family:var(--font-data);font-size:11.5px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap}
.dh-meta .dm-k{color:var(--ink-4)}
.dh-right{margin-left:auto;min-width:280px}
.bid-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;justify-content:flex-end}
.chip{height:24px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);font-size:11.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;transition:all 120ms}
.chip:hover{border-color:#b7bbc3;background:var(--hover)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);font-weight:500}
.dive-ro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0 24px;margin-top:18px}
.dive-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;margin-top:2px}
.dive-main{min-width:0}
.dive-side{min-width:0}
.scale-wrap{position:relative;padding-top:34px;margin-top:10px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);position:relative}
.seg{position:relative;padding:0 0 0 0;text-align:left;cursor:pointer;border-left:1px solid var(--line-soft)}
.seg:first-child{border-left:none}
.seg[aria-disabled="true"]{cursor:default}
.seg .seg-ticks{display:block;height:8px;margin:0 6px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12.5%)}
.seg .seg-bar{display:block;height:20px;margin:0 6px;border:1px solid var(--line);background:var(--surface);margin-top:2px}
.seg.seg-passed .seg-bar{border-color:var(--ink);background:var(--ink)}
.seg.seg-current .seg-bar{border-color:var(--accent);background:var(--accent)}
.seg .seg-code{display:block;margin:6px 6px 0;font-family:var(--font-data);font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.seg.seg-current .seg-code{color:var(--accent)}
.seg.seg-future .seg-code{color:var(--ink-4)}
.seg .seg-note{display:block;margin:1px 6px 0;font-size:10px;color:var(--ink-4);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.seg:hover .seg-bar{box-shadow:0 0 0 1px rgba(21,24,30,.12)}
.seg.seg-current .needle{position:absolute;top:-14px;left:calc(50% - 6px);width:13px;pointer-events:none}
.seg.seg-current .needle::before{content:"";position:absolute;left:6px;top:4px;width:1.5px;height:12px;background:var(--accent)}
.seg.seg-current .needle::after{content:"";position:absolute;left:3px;top:0;width:7px;height:7px;background:var(--accent)}
.gm{position:absolute;top:-32px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:2}
.gm .gm-lab{font-family:var(--font-data);font-size:10px;letter-spacing:.03em;padding:2px 7px;border:1px solid;border-radius:var(--r2);white-space:nowrap;background:var(--surface)}
.gm .gm-tri{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid;}
.gm-blue .gm-lab{border-color:#b9cdec;color:var(--accent);background:var(--accent-tint)}
.gm-blue .gm-tri{border-top-color:var(--accent)}
.gm-red .gm-lab{border-color:#e0aca6;color:var(--danger);background:var(--danger-tint)}
.gm-red .gm-tri{border-top-color:var(--danger)}
.scale-legend{display:flex;gap:18px;align-items:center;margin-top:14px;padding-top:10px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.leg-sw{width:10px;height:10px;border:1px solid var(--line);background:var(--surface);flex:none}
.leg-sw.ls-passed{background:var(--ink);border-color:var(--ink)}
.leg-sw.ls-current{background:var(--accent);border-color:var(--accent)}
.leg-sw.ls-block{background:var(--danger);border-color:var(--danger)}
.gate-table td .ev{color:var(--ink-2)}
.gate-conclusion{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r4);background:var(--sunken);font-size:12px;flex-wrap:wrap}
.gate-conclusion .gc-t{font-weight:600}
.gate-conclusion.gc-ok{background:var(--ok-tint);border-color:#b7d5c0}
.gate-conclusion.gc-block{background:var(--danger-tint);border-color:#e3b9b3}
.gate-conclusion.gc-pending{background:var(--sunken)}
.def-summary{display:flex;gap:22px;flex-wrap:wrap;padding:10px 0 2px}
.def-stat{font-size:11.5px;color:var(--ink-3);display:flex;align-items:baseline;gap:6px}
.def-stat .dv{font-family:var(--font-data);font-size:15px;color:var(--ink)}
.def-stat .dv.danger{color:var(--danger)}
.def-stat .dv.warn{color:var(--warn)}
.def-stat .dv.ok{color:var(--ok)}
.round-tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;width:max-content;margin-top:8px;background:var(--surface)}
.round-tab{height:30px;padding:0 14px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--line);display:inline-flex;align-items:center;gap:7px}
.round-tab:last-child{border-right:none}
.round-tab:hover{background:var(--hover)}
.round-tab.on{background:var(--sunken);font-weight:600;color:var(--ink)}
.round-tab .rt-n{font-family:var(--font-data);font-size:10.5px;color:var(--ink-4)}
.trace-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.trace-item:last-child{border-bottom:none}
.trace-item .tr-n{font-family:var(--font-data);font-size:11px;color:var(--ink-4);width:56px;flex:none;padding-top:1px}
.trace-item .tr-m{flex:1;min-width:0}
.trace-item .tr-t{font-size:12px}
.trace-item .tr-s{font-size:11px;color:var(--ink-3);margin-top:2px}
.gap-card{border:1px solid #dfc39b;background:var(--warn-tint);border-radius:var(--r4);padding:10px 12px;margin-top:10px}
.gap-card .gc-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--warn)}
.gap-card .gc-b{font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.6}
.gap-card .btn{margin-top:8px}
.summary-card{border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);padding:12px 14px;margin-top:12px}
.summary-card .sc-h{display:flex;align-items:center;gap:7px}
.summary-card .sc-t{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-3)}
.summary-card .sc-quote{font-size:12.5px;line-height:1.75;color:var(--ink-2);margin-top:8px;padding-left:10px;border-left:2px solid var(--line)}
.summary-card .sc-meta{margin-top:8px;font-family:var(--font-data);font-size:10.5px;color:var(--ink-4)}
.ms-list{display:flex;flex-direction:column}
.ms-item{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.ms-item:last-child{border-bottom:none}
.ms-item .ms-k{color:var(--ink-3);flex:none;width:86px}
.ms-item .ms-v{font-family:var(--font-data);font-size:12px;color:var(--ink-2)}
.ms-item .ms-d{margin-left:auto;font-family:var(--font-data);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.ms-item .ms-d.due-warn{color:var(--warn);font-weight:600}
.ms-item .ms-d.due-danger{color:var(--danger);font-weight:600}
.ms-item .ms-d.past{color:var(--ink-4)}
.todo-mini{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12px;align-items:baseline}
.todo-mini:last-child{border-bottom:none}
.todo-mini .tm-t{flex:1}
.todo-mini .tm-x{color:var(--ink-4);font-family:var(--font-data);font-size:11px}
.actionbar{position:sticky;bottom:-1px;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 -6px 16px rgba(21,24,30,.05), var(--shadow-btn);z-index:20;flex-wrap:wrap}
.actionbar .ab-hint{margin-left:auto;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:7px;font-family:var(--font-data)}

/* ===== V3 今日必办 ===== */
.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 24px;margin-top:14px}
.alert-row-actions{display:flex;gap:6px;justify-content:flex-end}
tr.alert-done td{background:#fbfbfc;color:var(--ink-3)}
tr.alert-done .td-main{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line)}
.ledger-note{font-size:11px;color:var(--ink-3);font-family:var(--font-data)}
.clear-state{padding:44px 20px;text-align:center}
.clear-state .cs-mark{width:44px;height:44px;margin:0 auto 14px;border:1px solid var(--ok);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ok)}
.clear-state .cs-mark .ic{width:20px;height:20px}
.clear-state .cs-t{font-size:15px;font-weight:600}
.clear-state .cs-s{font-size:12px;color:var(--ink-3);margin-top:6px}

/* ===== V4 资产 ===== */
.subtabs{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);width:max-content;overflow:hidden;margin-top:14px}
.subtab{height:32px;padding:0 16px;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--line);display:inline-flex;align-items:center;gap:7px}
.subtab:last-child{border-right:none}
.subtab:hover{background:var(--hover)}
.subtab.on{background:var(--ink);color:#fff;font-weight:500}
.subtab .cnt{font-family:var(--font-data);font-size:10.5px;color:var(--ink-4)}
.subtab.on .cnt{color:rgba(255,255,255,.6)}
.subtab-mode{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);width:max-content;overflow:hidden;margin-top:14px}
.dom-bar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.dom-bar .dom-readouts{display:flex;gap:26px;flex-wrap:wrap}
tr.row-warn td{background:#fdf9f1}
tr.row-warn:hover td{background:#faf3e6}
.occ-list{display:flex;gap:5px;flex-wrap:wrap}
.occ-tag{height:19px;padding:0 6px;border:1px solid var(--line);border-radius:var(--r2);background:var(--sunken);font-size:10.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;font-family:var(--font-data)}
.occ-tag.hot{border-color:#b9cdec;background:var(--accent-tint);color:var(--accent)}

/* ===== V5 商机 ===== */
.leads-grid{display:grid;grid-template-columns:432px 1fr;gap:18px;margin-top:16px;align-items:start}
.lead-list{border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);overflow:hidden}
.lead-row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;width:100%;text-align:left;transition:background 120ms;align-items:center}
.lead-row:last-child{border-bottom:none}
.lead-row:hover{background:var(--hover)}
.lead-row.on{background:var(--accent-tint);box-shadow:inset 2px 0 0 var(--accent)}
.lead-row .lr-main{flex:1;min-width:0}
.lead-row .lr-t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.lead-row .lr-s{font-size:11.5px;color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead-row .lr-score{font-family:var(--font-data);font-size:16px;color:var(--ink);text-align:right;flex:none}
.lead-row .lr-score .sc-u{display:block;font-size:9.5px;color:var(--ink-4);text-align:right;letter-spacing:.06em}
.lead-detail{border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);min-height:420px;display:flex;flex-direction:column}
.ld-head{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.ld-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ld-sub{font-size:12px;color:var(--ink-3);margin-top:5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ld-facts{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.ld-fact{padding:12px 18px;border-right:1px solid var(--line-soft)}
.ld-fact:last-child{border-right:none}
.ld-body{padding:16px 18px;flex:1}
.quote{border:1px solid var(--line);background:var(--sunken);border-radius:var(--r4);padding:11px 13px;font-size:12.5px;line-height:1.75;color:var(--ink-2);margin-top:8px}
.quote .q-src{display:block;margin-top:6px;font-family:var(--font-data);font-size:10.5px;color:var(--ink-4)}
.ld-actions{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.evidence-fs{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.7}
.kv{display:flex;gap:10px;font-size:12px;padding:5px 0}
.kv .k{color:var(--ink-3);width:84px;flex:none}
.kv .v{color:var(--ink-2);font-family:var(--font-data);font-size:12px}

/* ===== V6 简报 ===== */
.report{max-width:860px;margin:0 auto;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);padding:26px 32px 22px;margin-top:16px}
.rpt-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rpt-head .rpt-id{font-family:var(--font-data);font-size:13px;font-weight:600;letter-spacing:.04em}
.rpt-head .rpt-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.rpt-title{font-size:19px;font-weight:600;margin-top:16px}
.rpt-meta{font-family:var(--font-data);font-size:11px;color:var(--ink-4);margin-top:5px;letter-spacing:.02em}
.rpt-sec{margin-top:18px}
.rpt-sec .rs-t{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px;display:flex;gap:8px;align-items:baseline}
.rpt-sec .rs-t .rs-en{font-family:var(--font-label);font-size:9.5px;letter-spacing:.08em;color:var(--ink-4);text-transform:uppercase}
.rpt-sec p{font-size:13px;line-height:1.85;color:var(--ink-2);margin-top:9px}
.kd-list{list-style:none;margin-top:10px;counter-reset:kd}
.kd-list li{position:relative;padding:9px 0 9px 34px;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--ink-2);line-height:1.7}
.kd-list li::before{counter-increment:kd;content:"0" counter(kd);position:absolute;left:0;top:10px;font-family:var(--font-data);font-size:11px;color:var(--ink-4)}
.kd-list li .kd-tag{margin-right:8px}
.rpt-foot{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink-4);font-family:var(--font-data)}

/* ===== V7 系统 ===== */
.trigger-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);padding:9px 12px;margin-top:14px}
.trigger-bar .tb-lbl{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-3);margin-right:4px}
.trig-btn{height:28px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:all 120ms}
.trig-btn:hover{border-color:#b7bbc3;background:var(--hover)}
.trig-btn .st{font-family:var(--font-data);font-size:10.5px;color:var(--ink-4)}
.trig-btn.running{border-color:#b9cdec;background:var(--accent-tint);color:var(--accent);pointer-events:none}
.log-table td{white-space:nowrap}
.log-table td.lg-msg{white-space:normal;min-width:320px;color:var(--ink-2)}
.log-lvl{font-family:var(--font-data);font-size:11px;padding:1px 6px;border-radius:var(--r2);border:1px solid}
.lvl-info{color:var(--ink-2);border-color:var(--line);background:var(--sunken)}
.lvl-warn{color:var(--warn);border-color:#dfc39b;background:var(--warn-tint)}
.lvl-error{color:var(--danger);border-color:#e0aca6;background:var(--danger-tint)}
.cfg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.field{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.field .f-label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:5px}
.field .f-hint{font-size:11px;color:var(--ink-4);margin-top:5px;line-height:1.6}
.field .f-req{color:var(--danger);margin-left:3px}
.finput{width:100%;height:32px;border:1px solid var(--line);border-radius:var(--r4);background:var(--sunken);padding:0 10px;font-size:12.5px;transition:border-color 120ms,background 120ms}
.finput:focus{background:var(--surface);border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-tint)}
.finput[disabled]{color:var(--ink-4);background:var(--bg);border-color:var(--line-soft);cursor:not-allowed}
.finput.err{border-color:var(--danger);background:var(--danger-tint)}
.frow{display:flex;gap:10px;align-items:center}
.frow .fsep{color:var(--ink-4);font-family:var(--font-data)}
textarea.finput{height:auto;min-height:74px;padding:8px 10px;resize:vertical;line-height:1.6}
.f-error{display:none;font-size:11.5px;color:var(--danger);margin-top:5px}
.f-error.show{display:block}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px}
.switch .sw-track{width:34px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background 120ms;border:1px solid var(--line)}
.switch .sw-knob{position:absolute;top:1.5px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(21,24,30,.25);transition:left 120ms}
.switch.on .sw-track{background:var(--accent);border-color:var(--accent)}
.switch.on .sw-knob{left:18px}
.switch[aria-disabled="true"]{cursor:not-allowed;opacity:.55}
.cfg-foot{margin-top:16px;display:flex;align-items:center;gap:10px}
.cfg-dirty{font-size:11.5px;color:var(--warn);font-family:var(--font-data)}
.proposal-card{border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);padding:14px 16px;margin-top:10px}
.proposal-card .pc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.proposal-card .pc-id{font-family:var(--font-data);font-size:12px;color:var(--ink-2);font-weight:600}
.proposal-card .pc-t{font-size:13.5px;font-weight:600}
.proposal-card .pc-meta{font-size:11.5px;color:var(--ink-3);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.proposal-card .pc-actions{margin-top:12px;display:flex;gap:8px}
.diff-line{font-family:var(--font-data);font-size:11.5px;line-height:1.8;padding:1px 6px;border-radius:2px}
.diff-add{background:var(--ok-tint);color:#17683b;display:block}
.diff-del{background:var(--danger-tint);color:#9c271d;display:block;text-decoration:line-through;text-decoration-color:rgba(156,39,29,.4)}
.diff-ctx{color:var(--ink-3);display:block}
.flow-steps{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-top:10px}
.fstep{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3)}
.fstep .fs-dot{width:9px;height:9px;border:1.5px solid var(--ink-4);background:var(--surface);flex:none}
.fstep.done{color:var(--ink-2)}
.fstep.done .fs-dot{background:var(--ink);border-color:var(--ink)}
.fstep.done-cur .fs-dot{background:var(--accent);border-color:var(--accent)}
.fstep .fs-conn{width:26px;height:1px;background:var(--line);margin:0 9px}
.ticket-detail{border-top:1px dashed var(--line-soft);margin-top:2px}
.ticket-detail td{background:#fbfbfc}

/* ===== 模态 / 弹层 ===== */
.overlay{position:fixed;inset:0;background:rgba(21,24,30,.32);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:56px 20px 30px;overflow-y:auto}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);box-shadow:0 18px 48px rgba(21,24,30,.18),0 4px 12px rgba(21,24,30,.10);width:520px;max-width:100%;animation:modalin 140ms ease-out}
@keyframes modalin{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
.modal.modal-lg{width:760px}
.modal.modal-xl{width:920px}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head .mh-id{font-family:var(--font-data);font-size:11px;color:var(--ink-4);letter-spacing:.04em}
.modal-head .mh-t{font-size:14.5px;font-weight:600}
.modal-head .mh-close{margin-left:auto}
.modal-body{padding:16px 18px;max-height:calc(100vh - 240px);overflow-y:auto}
.modal-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-foot .mf-note{margin-right:auto;font-size:11.5px;color:var(--ink-3);max-width:60%}
.modal-foot .mf-note.danger{color:var(--danger)}
.check-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r4);overflow:hidden}
.check-item{display:flex;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.check-item:last-child{border-bottom:none}
.check-item .ck-no{font-family:var(--font-data);font-size:11px;color:var(--ink-4);width:20px;flex:none;padding-top:2px}
.check-item .ck-main{flex:1;min-width:0}
.check-item .ck-t{font-size:12.5px;font-weight:500}
.check-item .ck-ev{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.65}
.check-item .ck-time{font-family:var(--font-data);font-size:10.5px;color:var(--ink-4);flex:none;padding-top:2px;white-space:nowrap}
.ticket-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.ticket-form .tf-row{padding:9px 0;border-bottom:1px solid var(--line-soft)}
.ticket-form .tf-row:last-child{border-bottom:none}
.ticket-form .tf-k{font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--ink-4);text-transform:uppercase;font-family:var(--font-label)}
.ticket-form .tf-v{font-family:var(--font-data);font-size:12px;color:var(--ink-2);margin-top:3px;word-break:break-all}
.ticket-preview{border:1px solid var(--line);border-radius:var(--r4);background:var(--sunken);padding:13px 15px}
.ticket-preview pre{font-family:var(--font-data);font-size:11.5px;line-height:1.75;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;margin:0}
.popover{position:fixed;z-index:300;background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);box-shadow:0 10px 30px rgba(21,24,30,.14);width:320px;max-width:calc(100vw - 24px)}
.popover .po-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunken);border-radius:var(--r4) var(--r4) 0 0}
.popover .po-t{font-size:12px;font-weight:600}
.popover .po-body{padding:10px 12px;font-size:12px;line-height:1.7;color:var(--ink-2)}
.popover .po-actions{padding:0 12px 12px;display:flex;gap:8px}
.drawer-overlay{position:fixed;inset:0;background:rgba(21,24,30,.24);z-index:180}
.drawer-overlay[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--surface);border-left:1px solid var(--line);z-index:181;display:flex;flex-direction:column;box-shadow:-14px 0 36px rgba(21,24,30,.12);animation:drawerin 160ms ease-out}
@keyframes drawerin{from{transform:translateX(14px);opacity:.5}to{transform:none;opacity:1}}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-head .dr-id{font-family:var(--font-data);font-size:11px;color:var(--ink-4)}
.drawer-body{padding:14px 16px;overflow-y:auto;flex:1}
.drawer-body .dv-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.drawer-body .dv-row .dv-k{width:92px;flex:none;color:var(--ink-3)}
.drawer-body .dv-row .dv-v{color:var(--ink-2);font-family:var(--font-data);font-size:11.5px;word-break:break-all}
.drawer-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}

/* Toast */
#toastRoot{position:fixed;right:18px;bottom:18px;z-index:400;display:flex;flex-direction:column;gap:8px;width:340px;max-width:calc(100vw - 24px)}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink-3);border-radius:var(--r4);padding:10px 12px 10px 14px;box-shadow:0 8px 26px rgba(21,24,30,.14);display:flex;gap:10px;align-items:flex-start;animation:toastin 140ms ease-out}
@keyframes toastin{from{transform:translateY(6px);opacity:.5}to{transform:none;opacity:1}}
.toast .ts-main{flex:1;min-width:0}
.toast .ts-t{font-size:12.5px;color:var(--ink);line-height:1.6}
.toast .ts-s{font-size:11px;color:var(--ink-3);margin-top:2px;font-family:var(--font-data)}
.toast.ok{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--warn)}
.toast.danger{border-left-color:var(--danger)}
.toast.info{border-left-color:var(--accent)}
.toast .ts-x{color:var(--ink-4);flex:none}
.toast .ts-x:hover{color:var(--ink)}

/* 骨架屏 */
#skeleton{position:fixed;inset:0;z-index:500;background:var(--bg);display:grid;grid-template-columns:220px 1fr}
#skeleton[hidden]{display:none}
.sk-nav{background:var(--surface);border-right:1px solid var(--line);padding:18px}
.sk-body{padding:20px 24px}
.sk-block{background:var(--sunken);border-radius:var(--r2);animation:skpulse 1.1s ease-in-out infinite}
@keyframes skpulse{0%,100%{opacity:1}50%{opacity:.55}}

/* 响应式 */
@media (max-width:1279px){
  .app{grid-template-columns:190px 1fr}
  .readouts .ro{padding:0 10px}
  .dive-grid{grid-template-columns:1fr 280px}
}
@media (max-width:1080px){
  .dive-grid{grid-template-columns:1fr}

  .pipe-side{position:static}
  .leads-grid{grid-template-columns:1fr}
  .dive-ro-row{grid-template-columns:repeat(2,1fr);gap:14px 24px}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:14px 24px}
  .cfg-grid{grid-template-columns:1fr}
  .ticket-grid{grid-template-columns:1fr}
}
@media (max-width:1023px){

  .nav-item .n,.nav-item .t,.nav-item .nbadge{display:none}
  .nav-foot{display:none}
  .nav-item.active::before{left:-10px}
}
@media (max-width:767px){

  .nav-col{flex-direction:row;align-items:center;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{border-bottom:none;padding:10px 12px;flex:none}
  .nav-list{flex-direction:row;padding:6px 8px;gap:4px;overflow-x:auto}
  .nav-item{width:auto;min-width:40px;justify-content:center}
  .nav-item .t{display:block;font-size:11px}
  .nav-item .n{display:none}
  .nav-item.active::before{left:6px;right:6px;top:auto;bottom:2px;width:auto;height:2px}
  .topbar{height:auto;padding:8px 12px;flex-wrap:wrap;gap:8px}
  .readouts{margin-left:0;flex-wrap:wrap;row-gap:4px}
  .ro{padding:0 8px}
  .clock{padding-left:8px}
  #viewRoot{padding:14px 12px 90px}
  .vhead .vright{margin-left:0}
  .scale-wrap{overflow-x:auto;padding-bottom:6px}
  .scale{min-width:660px}
  .dive-head{gap:10px}
  .dh-right{margin-left:0;width:100%}
  .bid-chips{justify-content:flex-start}
  .actionbar .ab-hint{margin-left:0;width:100%}
  .report{padding:18px 16px}
  .modal-body{max-height:calc(100vh - 200px)}
}

function copyText(text, okMsg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function done(ok){
    if(ok){ toast(okMsg || '已复制到剪贴板', 'ok', '演示环境 · 复制成功'); }
    else { openModal({title:'复制失败 · 手动复制', body:'<p class="muted" style="font-size:12.5px;margin-bottom:8px">当前环境不允许自动写入剪贴板，请手动全选并复制以下文本：</p><textarea class="finput" style="height:220px;font-family:var(--font-data);font-size:11.5px" readonly>'+esc(text)+'</textarea>', foot:'<button class="btn" data-act="modal-close">关闭</button>'}); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(fallback()); });
  } else { done(fallback()); }
}

function onKeydown(e){

    return;

  if(S.modal) return;
  var tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  var idx = ['1','2','3','4','5','6','7'].indexOf(e.key);

  var h = '<div class="vhead">'
    + '<div><div class="lbl-en">Pipeline · 工序总览</div><div class="vt">管线漏斗</div>'
    + '<div class="vs">S0–S9 十态状态机在同一张台账上读数：每行的标的数、金额合计与门禁判定均来自数据面投影。</div></div>'
    + '<div class="vright">'
    + '<div class="fgroup" role="group" aria-label="优先级筛选">'
    + ['all','P0','P1','P2'].map(function(p){
        return '<button class="fbtn' + (f.prio===p?' on':'') + '" data-act="pipe-filter" data-key="prio" data-val="' + p + '">' + (p==='all'?'全部':p) + '</button>';
      }).join('')
    + '</div>'
    + '<select class="fselect" aria-label="客户筛选" data-act="pipe-client">'
    + '<option value="all">客户：全部</option>'
    + clients.map(function(c){ return '<option value="' + esc(c) + '"' + (f.client===c?' selected':'') + '>客户：' + esc(c) + '</option>'; }).join('')
    + '</select>'
    + '<select class="fselect" aria-label="排序方式" data-act="pipe-sort">'
    + '<option value="due"' + (f.sort==='due'?' selected':'') + '>排序：按截止</option>'
    + '<option value="prio"' + (f.sort==='prio'?' selected':'') + '>排序：按优先级</option>'
    + '</select>'
    + '</div></div>';

  if(filterActive){
    h += '<div style="margin-top:10px" class="filter-note"><span class="qc qc-info"><span class="qcd"></span>筛选生效</span><span>显示 ' + list.length + ' / ' + BIDS.length + ' 标的 · 阶段读数已按筛选重算</span>'
      + '<button class="link-btn" data-act="pipe-filter" data-key="clear" data-val="1">清除筛选</button></div>';
  }

  h += '<div class="pipe-grid"><div>';

  /* ---- 台账矩阵 ---- */
  h += '<div class="matrix" role="table" aria-label="阶段台账矩阵">';
  for(var st=0; st<=9; st++){
    var inStage = list.filter(function(b){ return b.stage === st; });
    var sum = 0; inStage.forEach(function(b){ sum += b.amount; });
    var open = !!S.pipeOpen[st];
    var isEmpty = inStage.length === 0;
    var allEmpty = BIDS.filter(function(b){ return b.stage === st; }).length === 0;
    h += '<div class="prow' + (open?' open':'') + '">';
    h += '<div class="prow-head"' + (isEmpty && allEmpty ? '' : ' data-act="pipe-toggle" data-stage="' + st + '" tabindex="0" role="button" aria-expanded="' + (open?'true':'false') + '"') + '>'
      + '<span class="ps"><span class="ps-code">' + STAGE_CODES[st] + '</span><span class="ps-name">' + STAGE_NAMES[st] + '</span></span>'
      + '<span class="pm num">' + (isEmpty ? '—' : inStage.length + '<span class="pm-u">标的</span>') + '</span>'
      + '<span class="pm num">' + (isEmpty ? '—' : '¥' + fmtW(sum) + '<span class="pm-u">万</span>') + '</span>'
      + '<span class="pgate">' + rowGateTag(inStage) + '</span>'
      + '<span class="pkey">' + rowKeyBid(inStage) + '</span>'
      + '<span class="pcaret">' + (isEmpty && allEmpty ? '' : ic('chev')) + '</span>'
      + '</div>';
    if(open && !(isEmpty && allEmpty)){
      h += '<div class="prow-exp">';
      if(inStage.length){
        h += '<div class="pipe-cards">' + sortBids(inStage).map(bidCard).join('') + '</div>';
      } else {
        h += '<div class="empty-box" style="margin-top:8px"><div class="em-t">— 无符合筛选的标的 —</div><div class="em-s">调整优先级或客户筛选后重试</div></div>';
      }
      h += '</div>';
    }
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="table-note">读数口径：标的数 / 金额合计按当前筛选集重算 · 金额单位万元 · 点击行展开标的卡，点击卡进入深潜</div>';

  /* ---- S9 归档条 ---- */
  var bay = bidById('2026-baybank-bcp');
  h += '<div style="margin-top:14px;display:flex;align-items:center;gap:8px">'
    + '<span class="lbl-en">Archive</span><span class="sline" style="flex:1;height:1px;background:var(--line)"></span></div>'
    + '<div class="s9-strip"><span class="s9-code">S9</span><span class="s9-main">' + bay.client + ' · ' + esc(bay.project) + '</span>'
    + '<span class="s9-meta">' + bay.id + ' · ¥' + fmtW(bay.amount) + '万 · 归档 08-28</span>'
    + qc('ok','已赢单归档')
    + '<button class="btn btn-sm" data-act="open-bid" data-bid="' + bay.id + '">查看归档 ' + ic('right') + '</button></div>';

  h += '</div><aside class="pipe-side">';
  h += renderUrgent();
  h += '</aside></div>';
  return h;
}

function renderUrgent(){
  var items = [];
  BIDS.forEach(function(b){
    if(b.stage >= 9) return;
    var g = gateFor(b);
    if(g.kind === 'block'){ items.push({w:1, kind:'gate', t:b.client + ' · ' + g.code + ' 被拦', s: (g.items.filter(function(i){return i.v==='block';})[0]||{}).ev || '', bid:b.id, d:null}); }
  });
  BIDS.forEach(function(b){
    (b.ms||[]).forEach(function(m){
      var d = dLeft(m.date);
      if(d >= 0 && d <= 7){
        items.push({w: d <= 2 ? 0 : d, kind:'due', t: b.client + ' · ' + m.k, s: m.date.slice(5) + (m.time?(' ' + m.time):'') + ' · ' + daysLabel(d), bid: b.id, d:d});
      }
    });
  });
  items.sort(function(a,b){ return a.w - b.w; });
  items = items.slice(0, 5);
  var h = '<div class="side-panel"><div class="sp-head"><span class="sp-t">当前紧要</span><span class="sp-n">' + items.length + ' 项</span></div>';
  items.forEach(function(it){
    var tag;
    if(it.kind === 'gate'){ tag = '<span class="qc qc-block"><span class="qcd"></span>门禁</span>'; }
    else if(it.d <= 2){ tag = '<span class="qc qc-block"><span class="qcd"></span>临期</span>'; }
    else { tag = '<span class="qc qc-warn"><span class="qcd"></span>临期</span>'; }
    h += '<button class="urg-row" data-act="open-bid" data-bid="' + it.bid + '">'
      + '<div class="urg-main"><div class="urg-t">' + esc(it.t) + '</div>'
      + '<div class="urg-s">' + tag + '<span>' + esc(it.s) + '</span></div></div>'
      + '<div class="urg-d">' + (it.d!=null ? (it.d + '<span class="du">天</span>') : '') + '</div></button>';
  });
  h += '</div>';
  h += '<div class="table-note" style="margin-top:8px;text-align:right">按严重度排序 · 点击进入深潜</div>';
  return h;
}

/* ---------- 交互 ---------- */
ACTIONS['pipe-toggle'] = function(el){
  var st = Number(el.getAttribute('data-stage'));
  if(S.pipeOpen[st]){ delete S.pipeOpen[st]; } else { S.pipeOpen[st] = true; }
  render();
};
ACTIONS['pipe-filter'] = function(el){
  var key = el.getAttribute('data-key'), val = el.getAttribute('data-val');
  if(key === 'clear'){ S.pipeFilter.prio = 'all'; S.pipeFilter.client = 'all'; }
  else { S.pipeFilter[key] = val; }
  render();
};
ACTIONS['pipe-client'] = function(){};
ACTIONS['open-bid'] = function(el){
  var id = el.getAttribute('data-bid');
  if(!bidById(id)) return;
  S.dive = id;
  closePopover();
  S.view = 'dive';
  render();
};
ACTIONS['pop'] = function(el, e){
  var type = el.getAttribute('data-pop');
  var b = bidById(el.getAttribute('data-bid'));
  if(!b) return;
  var html = '';
  if(type === 'gate'){
    var g = gateFor(b);
    var blocks = g.items.filter(function(i){ return i.v==='block' || i.v==='pending'; });
    html = '<div class="po-head"><span class="po-t">门禁卡点 · ' + esc(g.code) + '</span></div>'
      + '<div class="po-body"><div style="margin-bottom:6px" class="lbl-en">Blocked checks</div>'
      + blocks.map(function(i){
          return '<div style="display:flex;gap:8px;padding:4px 0;align-items:flex-start">' + gateQC(i.v) + '<span>' + esc(i.t) + '<span class="dim"> · ' + esc(i.ev) + '</span></span></div>';
        }).join('')
      + '</div><div class="po-actions"><button class="btn btn-sm btn-primary" data-act="open-bid" data-bid="' + b.id + '">去深潜处理</button></div>';
  } else if(type === 'gap'){
    html = '<div class="po-head"><span class="po-t">素材缺口</span></div>'
      + '<div class="po-body">评分点 3.2 应急响应能力：无素材指针。<br><span class="dim">处置：在资产台账登记缺口，或补充方案切片后重跑引用反查。</span></div>'
      + '<div class="po-actions"><button class="btn btn-sm" data-act="open-bid" data-bid="' + b.id + '">去深潜 · 素材反查</button></div>';
  } else if(type === 'sign'){
    html = '<div class="po-head"><span class="po-t">待签核 · L3</span></div>'
      + '<div class="po-body">门禁 S5→S6 需人工签核。当前前置未满足：阻断级缺陷 1 条未关闭（第 7 条服务响应偏离）。</div>'
      + '<div class="po-actions"><button class="btn btn-sm" data-act="open-bid" data-bid="' + b.id + '">去深潜 · 检验单</button></div>';
  } else if(type === 'src'){
    html = '<div class="po-head"><span class="po-t">来源标记 · secondary</span></div>'
      + '<div class="po-body">二手源：决策前需人工确认来源可靠性，门禁自检暂不执行。</div>'
      + '<div class="po-actions"><button class="btn btn-sm" data-act="open-bid" data-bid="' + b.id + '">去深潜</button></div>';
  } else if(type === 'due'){
    html = '<div class="po-head"><span class="po-t">临期节点</span></div>'
      + '<div class="po-body">保证金截止 09-12（剩 1 天）：凭证待归档。</div>'
      + '<div class="po-actions"><button class="btn btn-sm" data-act="open-bid" data-bid="' + b.id + '">去深潜</button></div>';
  }
  togglePopover(el, html);
};

var SEG_NOTE = {
  '2026-GOLD-jishu':{6:'封标 10-09', 7:'开标 10-09'},
  '2026-nfh-v14':{6:'封标 09-25', 7:'开标 09-26'},
  '2026-szse-zhongbao':{2:'决策 09-18'},
  '2026-dgbank-attack':{2:'决策 09-22'},
  '2026-pengcheng-bank':{6:'封标 10-20'},
  '2026-pengcheng-sec':{7:'开标 09-15'},
  '2026-nanshan-sec':{1:'报名 09-19'},
  '2026-baybank-bcp':{9:'归档 08-28'}
};
var SOURCE_LABEL = {primary:'primary（一手源）', secondary:'secondary（二手源）', lead:'lead（线索转入）'};

function segScale(b){
  var g = gateFor(b);
  var i, segs = '';
  for(i=0;i<10;i++){
    var cls = i < b.stage ? 'seg-passed' : (i === b.stage ? 'seg-current' : 'seg-future');
    var clickable = i <= b.stage;
    var note = '';
    if(i === b.stage && b.stay != null) note = '停留 ' + b.stay + ' 天';
    else if(SEG_NOTE[b.id] && SEG_NOTE[b.id][i]) note = SEG_NOTE[b.id][i];
    segs += '<button class="seg ' + cls + '" data-act="seg-pop" data-bid="' + b.id + '" data-seg="' + i + '"'
      + (clickable ? '' : ' aria-disabled="true"')
      + ' aria-label="阶段 ' + STAGE_CODES[i] + ' ' + STAGE_NAMES[i] + '，' + (i<b.stage?'已过':i===b.stage?'当前':'未至') + '">'
      + (i === b.stage ? '<span class="needle"></span>' : '')
      + '<span class="seg-ticks"></span><span class="seg-bar"></span>'
      + '<span class="seg-code">' + STAGE_CODES[i] + '</span>'
      + '<span class="seg-note">' + esc(note) + '</span></button>';
  }
  var marks = '';
  if(g.kind === 'block' || g.kind === 'pass' || g.kind === 'check'){
    var pos = (b.stage + 1) * 10;
    var isBlock = g.kind === 'block';
    marks += '<span class="gm ' + (isBlock ? 'gm-red' : 'gm-blue') + '" style="left:' + pos + '%">'
      + '<span class="gm-lab">' + (isBlock ? '拦截 ' : '门禁 ') + esc(g.code) + '</span><span class="gm-tri"></span></span>';
  }
  return '<div class="scale-wrap"><div class="scale">' + segs + '</div>' + marks + '</div>'
    + '<div class="scale-legend">'
    + '<span class="leg-item"><span class="leg-sw ls-passed"></span>已过</span>'
    + '<span class="leg-item"><span class="leg-sw ls-current"></span>当前指针</span>'
    + '<span class="leg-item"><span class="leg-sw"></span>未至</span>'
    + '<span class="leg-item"><span class="leg-sw ls-block"></span>门禁拦截</span>'
    + '<span class="leg-item dim">刻度：每段 5 小格 · 点击已过/当前段查看门禁记录</span>'
    + '</div>';
}

function gateTable(b){
  var g = gateFor(b);
  var rows = g.items.map(function(it, idx){
    return '<tr><td class="num" style="width:44px">' + ('0' + (idx+1)).slice(-2) + '</td>'
      + '<td class="td-main">' + esc(it.t) + '</td>'
      + '<td>' + gateQC(it.v, it.lv) + '</td>'
      + '<td class="ev">' + esc(it.ev) + '</td>'
      + '<td class="num dim">' + esc(it.time) + '</td></tr>';
  }).join('');
  var allOk = g.items.length > 0 && g.items.every(function(i){ return i.v === 'ok'; });
  var concl = '';
  if(g.kind === 'event'){
    concl = '<div class="gate-conclusion gc-pending">' + qc('pending','节点') + '<span class="gc-t">' + esc(g.event || '节点驱动') + '</span><span class="muted">' + esc(g.note || '') + '</span></div>';
  } else if(g.kind === 'done'){
    concl = '<div class="gate-conclusion gc-ok">' + qc('ok','合格') + '<span class="gc-t">门禁已通过 · 已归档</span><span class="muted">无后续操作</span></div>';
  } else if(allOk){
    concl = '<div class="gate-conclusion gc-ok">' + qc('ok','合格') + '<span class="gc-t">门禁校验通过 · 可推进至 ' + nextStageLabel(b) + '</span>'
      + '<span style="margin-left:auto"><button class="btn btn-sm btn-primary" data-act="dive-advance" data-bid="' + b.id + '">推进阶段</button></span></div>';
  } else if(g.items.some(function(i){ return i.v === 'block'; })){
    concl = '<div class="gate-conclusion gc-block">' + qc('block','拦截') + '<span class="gc-t">存在拦截项 · 无法推进</span>'
      + '<span style="margin-left:auto;display:flex;gap:8px"><button class="btn btn-sm" data-act="gate-repair" data-bid="' + b.id + '">生成修复工单</button>'
      + '<button class="btn btn-sm btn-primary" data-act="dive-advance" data-bid="' + b.id + '">查看校验</button></span></div>';
  } else {
    concl = '<div class="gate-conclusion gc-pending">' + qc('pending','待检') + '<span class="gc-t">门禁待校验</span>'
      + '<span style="margin-left:auto;display:flex;gap:8px"><button class="btn btn-sm" data-act="gate-selfcheck" data-bid="' + b.id + '">运行门禁自检</button></span></div>';
  }
  return '<div class="tscroll"><table class="pt gate-table"><thead><tr><th>序号</th><th>检查项</th><th>判定</th><th>证据</th><th style="text-align:right">时间</th></tr></thead><tbody>'
    + rows + '</tbody></table></div>' + concl
    + '<div class="table-note">门禁 ' + esc(g.code) + ' · 完成条件以 GATE 矩阵原文为准 · 拒绝推进时返回卡点清单</div>';
}
function nextStageLabel(b){
  var n = Math.min(9, b.stage + 1);
  return STAGE_CODES[n] + ' ' + STAGE_NAMES[n];
}

function defectsSection(b){
  if(b.defects && b.defects.converged){
    return '<div class="empty-box"><div class="em-t">' + esc(b.defects.converged) + '</div><div class="em-s">无遗留缺陷 · 归档已确认</div></div>';
  }
  if(!b.defects || !b.defects.rounds.length){
    return '<div class="empty-box"><div class="em-t">— auditor 尚未运行 —</div><div class="em-s">进入 S5 审查阶段后生成缺陷台账（auditor 轮次 + 定位 + 状态）</div></div>';
  }
  var rounds = b.defects.rounds;
  var ri = Math.min(S.defRound, rounds.length - 1);
  var round = rounds[ri];
  var counts = {block:0, major:0, minor:0, open:0};
  round.rows.forEach(function(r){
    if(r.seve === '阻断') counts.block++;
    if(r.seve === '一般') counts.major++;
    if(r.seve === '提示') counts.minor++;
    if(r.st === '待处理' || r.st === '未关闭' || r.st === '修复中') counts.open++;
  });
  var stats = '<div class="def-summary">'
    + '<span class="def-stat">阻断级 <span class="dv ' + (counts.block?'danger':'ok') + '">' + counts.block + '</span></span>'
    + '<span class="def-stat">一般 <span class="dv warn">' + counts.major + '</span></span>'
    + '<span class="def-stat">提示 <span class="dv">' + counts.minor + '</span></span>'
    + '<span class="def-stat">未关闭 <span class="dv ' + (counts.open?'warn':'ok') + '">' + counts.open + '</span></span>'
    + (b.defects.loca ? '<span class="def-stat">locator 抽查 <span class="dv">' + b.defects.loca.n + '</span> 条 · 命中 <span class="dv ok">' + b.defects.loca.hit + '</span></span>' : '')
    + (b.defects.verify ? '<span class="def-stat">cite 违规 <span class="dv ok">' + b.defects.verify.cite + '</span> · 覆盖 <span class="dv">' + b.defects.verify.cover + '</span> · 字数达标 <span class="dv">' + b.defects.verify.words + '</span></span>' : '')
    + '</div>';
  var tabs = '<div class="round-tabs" role="tablist">' + rounds.map(function(r, idx){
    return '<button class="round-tab' + (idx===ri?' on':'') + '" role="tab" aria-selected="' + (idx===ri) + '" data-act="def-round" data-round="' + idx + '">' + esc(r.name) + '</button>';
  }).join('') + '</div>';
  var rows = round.rows.map(function(r){
    var stCls = (r.st.indexOf('待') === 0 || r.st.indexOf('未') === 0 || r.st.indexOf('修复') === 0) ? 'st-warn' : 'st-ok';
    return '<tr><td class="num">' + esc(r.id) + '</td><td>' + sevQC(r.seve) + '</td>'
      + '<td><span class="st-dot ' + stCls + '">' + esc(r.st) + '</span></td>'
      + '<td style="white-space:normal">' + esc(r.t) + '</td>'
      + '<td class="dim">' + esc(r.loc) + '</td></tr>';
  }).join('');
  return stats + tabs + '<div class="tscroll" style="margin-top:10px"><table class="pt"><thead><tr><th>编号</th><th>等级</th><th>状态</th><th>条目</th><th>定位</th></tr></thead><tbody>'
    + rows + '</tbody></table></div>'
    + '<div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button class="btn btn-sm" data-act="gate-repair" data-bid="' + b.id + '">' + ic('play') + ' 生成修复工单</button>'
    + '<span class="dim" style="font-size:11px">缺陷条目文本为演示样例 · 以 audit 产物为准</span></div>';
}

function artifactsSection(b){
  if(!b.artifacts.length){
    return '<div class="empty-box"><div class="em-t">— 尚无已登记产物 —</div><div class="em-s">watcher 5s 轮询数据面，只认 status=final 的产物</div></div>';
  }
  var rows = b.artifacts.map(function(a){
    return '<tr><td class="num">' + esc(a.no) + '</td><td class="td-main mono" style="font-size:12px">' + esc(a.name) + '</td>'
      + '<td>' + esc(a.producer) + '</td><td>' + qc(a.st==='final'?'ok':'pending', a.st) + '</td><td class="num dim">' + esc(a.time) + '</td></tr>';
  }).join('');
  return '<div class="tscroll"><table class="pt"><thead><tr><th>编号</th><th>名称</th><th>生产者</th><th>状态</th><th style="text-align:right">登记时间</th></tr></thead><tbody>'
    + rows + '</tbody></table></div>'
    + '<div class="table-note">manifest 含 producer / model / duration / ticket_id（对账依据）· 「—」为未登记时间，以 manifest 原件为准</div>';

function msSection(b){

  var rows = b.ms.map(function(m){
    var d = dLeft(m.date);
    var cls = d < 0 ? 'past' : dueCls(d);
    return '<div class="ms-item"><span class="ms-k">' + esc(m.k) + '</span><span class="ms-v">' + m.date.slice(5) + (m.time ? ' ' + m.time : '') + '</span>'
      + '<span class="ms-d ' + cls + '">' + daysLabel(d) + '</span></div>';
  }).join('');
  return '<div class="ms-list">' + rows + '</div>';
}

function traceSection(b){
  var h = '';
  if(b.trace && b.trace.length){
    h += '<div>' + b.trace.map(function(t){
      return '<div class="trace-item"><span class="tr-n">' + esc(t.pool) + '</span><div class="tr-m"><div class="tr-t">' + esc(t.n) + '</div><div class="tr-s">' + esc(t.used) + '</div></div></div>';
    }).join('') + '</div>';
    if(b.id === '2026-GOLD-jishu'){

function diveReadouts(b){
  var out = [];
  out.push({k:'STAGE', cn:'当前阶段', v: STAGE_CODES[b.stage], u: ' ' + STAGE_NAMES[b.stage]});
  var nd = nextDue(b);
  out.push({k:'NODE', cn:'下一节点', v: nd ? nd.m.date.slice(5) : '—', u: nd ? ' · ' + daysLabel(nd.d) : ''});
  if(b.draft) out.push({k:'DRAFT', cn:'已扩写', v: b.draft.done + ' / ' + b.draft.total, u: ' 章'});
  else if(b.id === '2026-nfh-v14') out.push({k:'SIGN', cn:'签核', v:'待签核', u:''});
  else out.push({k:'GATE', cn:'下一门禁', v: gateFor(b).code, u:''});
  if(b.locator != null) out.push({k:'LOCATOR', cn:'抽查命中率', v: b.locator + '%', u:''});
  else if(b.stage >= 9) out.push({k:'RESULT', cn:'结果', v:'win', u:' 已归档'});
  else out.push({k:'STAY', cn:'阶段停留', v: (b.stay != null ? b.stay : '—'), u: (b.stay != null ? ' 天' : '')});
  return out.slice(0, 4);
}

function openGateModal(b){
  var g = gateFor(b);

    return '<div class="check-item"><span class="ck-no">' + ('0' + (idx+1)).slice(-2) + '</span>'
      + '<div class="ck-main"><div class="ck-t">' + esc(it.t) + '</div><div class="ck-ev">' + esc(it.ev) + '</div></div>'

      + '<span class="ck-time">' + esc(it.time) + '</span></div></div>';
  }).join('');
  var allOk = g.items.length > 0 && g.items.every(function(i){ return i.v === 'ok'; });
  var anyBlock = g.items.some(function(i){ return i.v === 'block'; });
  var anyPending = g.items.some(function(i){ return i.v === 'pending'; });
  var foot = '<button class="btn" data-act="modal-close">取消</button>';
  var note = '';
  if(allOk){
    note = '<span class="mf-note">全部通过 · 确认后写入 set_stage.log 并重置阶段停留</span>';
    foot += '<button class="btn btn-primary" data-act="gate-confirm" data-bid="' + b.id + '">确认推进</button>';
  } else if(anyBlock){
    note = '<span class="mf-note danger">存在拦截项 · 无法推进：先关闭阻断级缺陷，或生成修复工单</span>';
    foot += '<button class="btn" data-act="gate-repair" data-bid="' + b.id + '">生成修复工单</button>';
    foot += '<button class="btn" data-act="gate-simclose" data-bid="' + b.id + '">模拟阻断关闭（演示）</button>';
    foot += '<button class="btn btn-primary" disabled aria-disabled="true">确认推进</button>';
  } else if(g.kind === 'event'){
    note = '<span class="mf-note">' + esc(g.event + ' · ' + (g.note || '')) + ' · 节点驱动，无需门禁校验</span>';
    foot += '<button class="btn" data-act="dive-ticket" data-bid="' + b.id + '">生成相关工单</button>';

    note = '<span class="mf-note">已归档 · 无后续操作</span>';

    note = '<span class="mf-note">存在待检项 · 先运行门禁自检</span>';
    foot += '<button class="btn" data-act="gate-selfcheck" data-bid="' + b.id + '">运行门禁自检</button>';
    foot += '<button class="btn btn-primary" disabled aria-disabled="true">确认推进</button>';

    hid: 'GATE ' + g.code, title: '门禁校验 · ' + b.id,
    body: '<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">' + stageFull(b) + prioChip(b.prio) + qc('info', esc(b.client)) + '</div>'
      + '<div class="check-list">' + items + '</div>',
    foot: note + foot,
    rebuild: function(){ openGateModal(b); }

}

var TPL_LIST = ['新标分析','审计 round-N','归档收割','kb 初始化','queue 批处理'];
var TPL_UNLOCK = {'新标分析':0,'审计 round-N':0,'归档收割':0,'kb 初始化':0,'queue 批处理':0};
S.ticket = null;
function ticketSeqToday(){ return QUEUE.filter(function(q){ return q.id.indexOf('T-20260911') === 0; }).length + 1; }
function ticketVars(b, tpl){
  var defCount = '';
  if(b.defects && b.defects.rounds.length){
    var last = b.defects.rounds[b.defects.rounds.length - 1];
    var c = {block:0, major:0, minor:0};
    last.rows.forEach(function(r){ if(r.seve==='阻断')c.block++; else if(r.seve==='一般')c.major++; else c.minor++; });
    defCount = '阻断 ' + c.block + ' / 一般 ' + c.major + ' / 提示 ' + c.minor;
  } else { defCount = '—（未运行 auditor）'; }
  return {
    bid_id: b.id,
    stage: STAGE_CODES[b.stage] + ' ' + STAGE_NAMES[b.stage],
    path: '~/.bidmaster/bids/' + b.id + '/data/',
    defects: defCount,
    tid: 'T-20260911-' + ('0' + ticketSeqToday()).slice(-2),
    round: (b.defects && b.defects.rounds.length ? b.defects.rounds.length + 1 : 1)
  };
}
function buildTicket(b, tpl){
  var v = ticketVars(b, tpl);
  var g = gateFor(b);
  var checkLines = g.items.map(function(i, idx){ return '  ' + (idx+1) + '. ' + i.t; }).join('\n');
  var t = '';
  if(tpl === '新标分析'){
    t = '【工单 ' + v.tid + ' · 新标分析】\n'
      + '· 目标：对标的 ' + v.bid_id + '（' + b.client + ' · ' + b.project + '）执行阶段 0 分析与条件收敛\n'
      + '· 当前阶段：' + v.stage + '\n'
      + '· 输入路径：' + v.path + ' · kb/index/\n'
      + '· 开工必读：skills/bid-master/SKILL.md（五阶段流程书）\n'
      + '· 工艺路径：stage0 条件收敛 → 硬门槛清单 → 门禁自检\n'
      + '· 完成条件（门禁 ' + g.code + ' 原文）：\n' + (checkLines || '  （按 GATE 矩阵执行）') + '\n'
      + '· 回填要求：产物 manifest 写入 ticket_id=' + v.tid + '（status=final）';

function certStatus(until){
  var d = dLeft(until);
  if(d < 0) return {key:'expired', label:'过期', cls:'st-danger', d:d};
  if(d <= 60) return {key:'near', label:'临期', cls:'st-warn', d:d};
  return {key:'valid', label:'有效', cls:'st-ok', d:d};
}
function domainReadouts(dom){
  if(dom === 'certs'){
    var near = CERTS.filter(function(c){ return certStatus(c.until).key === 'near'; }).length;
    var occ = CERTS.filter(function(c){ return c.occ.length; }).length;
    var nearest = null;
    CERTS.forEach(function(c){ var d = dLeft(c.until); if(nearest === null || d < nearest.d) nearest = {d:d, c:c}; });
    return [
      {k:'TOTAL', cn:'证照总数', v:CERTS.length, u:'件'},
      {k:'NEAR', cn:'临期（60 天）', v:near, u:'件', mod:'ro-warn'},
      {k:'OCC', cn:'在投占用', v:occ, u:'件'},
      {k:'NEXT', cn:'最近到期', v:nearest.c.until.slice(5), u:'', mod:'ro-warn'}
    ];
  }
  if(dom === 'people'){
    var busy = PEOPLE.filter(function(p){ return p.occ.length; }).length;
    var conflict = PEOPLE.filter(function(p){ return p.conflict; }).length;
    return [
      {k:'TOTAL', cn:'人员总数', v:PEOPLE.length, u:'人'},
      {k:'OCC', cn:'占用中', v:busy, u:'人'},
      {k:'CONFLICT', cn:'跨标冲突', v:conflict, u:'人', mod: conflict ? 'ro-danger' : ''},
      {k:'FREE', cn:'空闲', v:PEOPLE.length - busy, u:'人'}
    ];
  }
  if(dom === 'cases'){
    var slices = 0; CASES.forEach(function(c){ slices += c.slices; });
    return [
      {k:'TOTAL', cn:'案例总数', v:CASES.length, u:'条'},
      {k:'SLICES', cn:'切片合计', v:slices, u:'片'},
      {k:'YEARS', cn:'覆盖年度', v:'2024–2026', u:''}
    ];
  }
  var sl = 0; SOLUTIONS.forEach(function(s){ sl += s.slices; });
  var unused = SOLUTIONS.filter(function(s){ return s.last.indexOf('未引用') >= 0; }).length;
  return [
    {k:'TOTAL', cn:'方案总数', v:SOLUTIONS.length, u:'组'},
    {k:'SLICES', cn:'切片合计', v:sl, u:'片'},
    {k:'UNUSED', cn:'近期未引用', v:unused, u:'组'}
  ];
}

      + rows.map(function(p){
          var occ = p.occ.length ? '<span class="occ-list">' + p.occ.map(function(o, i){ return '<span class="occ-tag' + (i===0?' hot':'') + '">' + esc(o) + '</span>'; }).join('') + '</span>' : '<span class="dim">—</span>';
          var statusCell = p.conflict

          return '<tr class="clickable' + (p.conflict ? ' row-warn' : '') + '" data-act="asset-row" data-dom="people" data-id="' + p.id + '">'

        }).join('') + '</tbody></table></div>';

  if(dom === 'cases'){

function leadById(id){ var r = null; LEADS.forEach(function(l){ if(l.id === id) r = l; }); return r; }
function leadsInTab(tab){
  return LEADS.filter(function(l){
    if(tab === 'pending') return l.status === '待确认';
    if(tab === 'processed') return l.status === '已升级' || l.status === '已驳回';
    return l.status === '排除';
  });
}
function renderLeads(){
  var tab = S.leads.tab;
  var list = leadsInTab(tab);
  if(!list.some(function(l){ return l.id === S.leads.sel; })){ S.leads.sel = list.length ? list[0].id : null; }
  var sel = S.leads.sel ? leadById(S.leads.sel) : null;

  var h = '<div class="vhead"><div><div class="lbl-en">Leads · 质检台</div><div class="vt">商机</div>'
    + '<div class="vs">scout 打分 + recommend + 逐字引文；升级为 bid 走人工确认（L3），丢弃须选择原因。</div></div></div>';

  var counts = {pending:0, processed:0, rejected:0};
  LEADS.forEach(function(l){
    if(l.status === '待确认') counts.pending++;
    else if(l.status === '排除') counts.rejected++;
    else counts.processed++;
  });
  h += '<div class="subtabs" role="tablist">'
    + '<button class="subtab' + (tab==='pending'?' on':'') + '" role="tab" aria-selected="' + (tab==='pending') + '" data-act="leads-tab" data-tab="pending">待确认<span class="cnt">' + counts.pending + '</span></button>'
    + '<button class="subtab' + (tab==='processed'?' on':'') + '" role="tab" aria-selected="' + (tab==='processed') + '" data-act="leads-tab" data-tab="processed">已处理<span class="cnt">' + counts.processed + '</span></button>'
    + '<button class="subtab' + (tab==='rejected'?' on':'') + '" role="tab" aria-selected="' + (tab==='rejected') + '" data-act="leads-tab" data-tab="rejected">拒绝区<span class="cnt">' + counts.rejected + '</span></button>'
    + '</div>';

  h += '<div class="leads-grid"><div class="lead-list">';
  if(!list.length){
    h += '<div class="empty-box" style="margin:12px"><div class="em-t">— 该分类暂无线索 —</div><div class="em-s">' + (tab==='processed' ? '升级或驳回后线索会进入此分类' : '新的抓取批次会带来新线索') + '</div></div>';
  }
  list.forEach(function(l){
    var catTag = l.cat === '纳入' ? qc('ok','纳入') : l.cat === '观察' ? qc('pending','观察') : qc('block','排除');
    h += '<button class="lead-row' + (S.leads.sel===l.id?' on':'') + '" data-act="lead-row" data-id="' + l.id + '">'
      + '<div class="lr-main"><div class="lr-t">' + esc(l.name) + catTag
      + (l.m3 ? qc('info','M3 待确认') : '')
      + '</div><div class="lr-s">' + esc(l.proj) + (l.note ? ' · ' + esc(l.note) : '') + '</div></div>'
      + '<div class="lr-score">' + l.score + '<span class="sc-u">SCORE</span></div></button>';
  });
  h += '</div><div class="lead-detail" id="leadDetail">';
  if(!sel){
    h += '<div class="empty-box" style="margin:20px"><div class="em-t">— 选择左侧线索查看详情 —</div></div>';
  } else {
    h += leadDetailHtml(sel);
  }
  h += '</div></div>';
  return h;
}
function leadDetailHtml(l){
  var h = '';
  h += '<div class="ld-head"><div class="ld-title">' + esc(l.name)
    + (l.cat === '纳入' ? qc('ok','纳入') : l.cat === '观察' ? qc('pending','观察') : qc('block','排除'))
    + (l.m3 ? qc('info','M3 自动升级待确认') : '')
    + (l.status !== '待确认' ? qc('pending', l.status) : '')
    + '</div>'

    + '<span class="dim">来源：' + esc(l.source || '—') + '</span></div></div>';

  h += '<div class="ld-facts">'
    + '<div class="ld-fact"><span class="ro-lbl">Score</span><div class="ro-val" style="font-family:var(--font-data);font-size:22px;margin-top:2px">' + l.score + '<span class="ro-unit">/ 100</span></div><div class="ro-sub">阈值 ≥ 80 自动纳入</div></div>'
    + '<div class="ld-fact"><span class="ro-lbl">Recommend</span><div class="ro-val" style="font-size:16px;margin-top:4px">' + esc(l.cat) + '</div><div class="ro-sub">' + esc(l.note || '—') + '</div></div>'
    + '<div class="ld-fact"><span class="ro-lbl">State</span><div class="ro-val" style="font-size:16px;margin-top:4px">' + esc(l.status) + '</div><div class="ro-sub">' + (l.status==='排除' ? esc(l.reject||'') : 'lead 池') + '</div></div>'
    + '</div>';

  h += '<div class="ld-body">';
  h += '<div class="lbl-en">Evidence · 逐字引文</div>';
  if(l.quote){
    h += '<div class="quote">' + esc(l.quote) + '<span class="q-src">来源：' + esc(l.source) + ' · 逐字引文，未改写</span></div>';
  } else {
    h += '<div class="quote dim" style="font-style:normal">—（本轮未附引文 · 评分依据：关键词命中与画像匹配）</div>';
  }
  if(l.status === '排除'){
    h += '<div class="evidence-fs">拒绝原因：' + esc(l.reject || '—') + ' · 记录于 ' + esc(l.rejectAt || '—') + '</div>';
  }
  if(l.status === '已升级'){
    h += '<div class="evidence-fs">已升级为 bid · 阶段 S1 预审 · 优先级 P1 · 已入管线</div>';
  }
  if(l.status === '已驳回'){
    h += '<div class="evidence-fs">已驳回 M3 自动升级 · 置为观察，等待下轮人工复核</div>';
  }
  h += '</div>';

  /* 操作区 */
  h += '<div class="ld-actions">';
  if(l.status === '待确认'){
    if(l.m3){
      h += '<button class="btn btn-primary" data-act="lead-upgrade" data-id="' + l.id + '">确认升级为 bid</button>'
        + '<button class="btn" data-act="lead-m3reject" data-id="' + l.id + '">驳回自动升级</button>';
    } else {
      h += '<button class="btn" data-act="lead-upgrade" data-id="' + l.id + '">升级为 bid</button>';
    }
    h += '<button class="btn btn-danger" data-act="lead-discard" data-id="' + l.id + '">丢弃</button>';
  }
  h += '<button class="btn btn-quiet" style="margin-left:auto" data-act="lead-src">' + ic('link') + ' 打开来源</button>';
  h += '</div>';
  return h;
}

    + d.stats.map(function(s){ return '<tr><td>' + esc(s[0]) + '</td><td class="num">' + esc(s[1]) + '</td></tr>'; }).join('')
    + '</tbody></table></div></div>'

ACTIONS['digest-regen'] = function(el){
  el.classList.add('loading'); el.setAttribute('aria-busy','true');
  var d = DIGESTS[S.digest.day];
  setTimeout(function(){
    d.time = nowHMShort();
    toast('简报已重新生成 · 生成时间刷新', 'ok', d.id + ' · ' + d.time);
    logAppend('info','digest','手动重新生成 ' + d.id + ' · ' + d.time);
    render();
  }, 1500);
};
function digestMarkdown(d){
  var md = '# 每日简报 ' + d.id + '\n\n';
  md += '> 日期：' + d.date + ' · 生成时间：' + d.time + ' · ' + d.chain + '\n\n';
  md += '## 结论摘要\n\n' + d.summary + '\n\n';
  md += '## 快读\n\n';
  d.kd.forEach(function(k, i){ md += (i+1) + '. [' + k.tag + '] ' + k.text + '\n'; });
  md += '\n## 详读\n\n';
  d.sections.forEach(function(s){ md += '### ' + s.t + '\n\n' + s.p + '\n\n'; });
  md += '## 数据\n\n| 指标 | 数值 |\n|---|---|\n';
  d.stats.forEach(function(s){ md += '| ' + s[0] + ' | ' + s[1] + ' |\n'; });
  md += '\n---\n数据基准：' + d.date + ' 09:12 · 脚本保底 digest_stats' + (CONFIG.llm ? ' · 语义增强已开启' : '') + '\n';
  return md;
}
ACTIONS['digest-copy'] = function(){
  var d = DIGESTS[S.digest.day];
  copyText(digestMarkdown(d), 'Markdown 已复制');
};

var SYS_TABS = [
  {key:'agents', label:'智能体名册'},
