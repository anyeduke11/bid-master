function cloneConfig(){ return {fetch1:CONFIG.fetch1, fetch2:CONFIG.fetch2, threshold:CONFIG.threshold, warn:CONFIG.warn, llm:CONFIG.llm}; }
function cfgDirty(){
  var d = S.cfgDraft || cloneConfig();
  return String(d.fetch1)!==String(CONFIG.fetch1) || String(d.fetch2)!==String(CONFIG.fetch2)
    || parseInt(d.threshold,10) !== CONFIG.threshold || String(d.warn)!==String(CONFIG.warn) || !!d.llm !== !!CONFIG.llm;
}
function updateCfgDirty(){
  var dirty = cfgDirty();
  var btn = document.getElementById('cfgSave');
  if(btn){ btn.disabled = !dirty; btn.setAttribute('aria-disabled', (!dirty) + ''); }
  var lab = document.getElementById('cfgDirtyState');
  if(lab){ lab.textContent = dirty ? '有未保存修改' : ''; }
}

function renderSystem(){
  var t = S.sys.tab;
  var h = '<div class="vhead"><div><div class="lbl-en">Control Panel · 控制台</div><div class="vt">系统</div>'
    + '<div class="vs">名册 / 基线 / 工单 / 日志 / 参数 / 提案六区；手动触发只跑确定性脚本，语义生产在会话侧。</div></div></div>';

  /* 手动触发组 */
  h += '<div class="trigger-bar"><span class="tb-lbl">手动触发</span>'
    + '<button class="trig-btn" data-act="trig" data-trig="capture">' + ic('play') + ' 立即抓取<span class="st">就绪</span></button>'
    + '<button class="trig-btn" data-act="trig" data-trig="digest">' + ic('refresh') + ' 生成 digest<span class="st">就绪</span></button>'
    + '<button class="trig-btn" data-act="trig" data-trig="consistency">' + ic('search') + ' 跑一致性<span class="st">就绪</span></button>'
    + '<button class="trig-btn" data-act="trig" data-trig="inbox">' + ic('leads') + ' 收割 inbox<span class="st">就绪</span></button>'
    + '</div>';

  /* 子标签 */
  h += '<div class="subtabs" role="tablist">' + SYS_TABS.map(function(x){
    return '<button class="subtab' + (t===x.key?' on':'') + '" role="tab" aria-selected="' + (t===x.key) + '" data-act="sys-tab" data-tab="' + x.key + '">' + x.label + '</button>';
  }).join('') + '</div>';

  h += '<div style="margin-top:14px">';
  if(t === 'agents') h += sysAgents();
  else if(t === 'skills') h += sysSkills();
  else if(t === 'queue') h += sysQueue();
  else if(t === 'logs') h += sysLogs();
  else if(t === 'config') h += sysConfig();
  else h += sysProposal();
  h += '</div>';
  return h;
}

  var def = TRIG_DEFS[key];
  if(!def || el.classList.contains('running')) return;
  var st = el.querySelector('.st');
  el.classList.add('running');
  st.textContent = '步骤 1/2 …';
  setTimeout(function(){ st.textContent = '步骤 2/2 …'; }, 680);
  setTimeout(function(){
    el.classList.remove('running');
    st.textContent = '完成 ' + nowHMShort();
    toast(def.done, 'ok', def.sub);
    logAppend('info','manual', def.log);
    if(key === 'digest'){ DIGESTS.today.time = nowHMShort(); }
    render();
  }, 1420);
};

/* ---------- 参数配置 ---------- */
ACTIONS['cfg-toggle'] = function(el){
  if(!S.cfgDraft) S.cfgDraft = cloneConfig();
  S.cfgDraft.llm = !S.cfgDraft.llm;
  el.classList.toggle('on', S.cfgDraft.llm);
  el.setAttribute('aria-checked', S.cfgDraft.llm + '');
  el.querySelector('span:last-child').textContent = S.cfgDraft.llm ? '已开启（脚本保底始终运行）' : '已关闭（脚本保底始终运行）';
  updateCfgDirty();
};
ACTIONS['cfg-save'] = function(el){
  var d = S.cfgDraft || cloneConfig();
  var th = parseInt(d.threshold, 10);
  var wn = parseInt(d.warn, 10);
  if(isNaN(th) || th < 0 || th > 100){
    S.cfgErr = '评分阈值需为 0–100 的整数';
    render();
    return;
  }
  if(isNaN(wn) || wn < 1 || wn > 365){
    S.cfgErr = '预警提前期需为 1–365 的整数';
    render();
    return;
  }
  S.cfgErr = '';
  var changes = [];
  if(String(d.fetch1) !== String(CONFIG.fetch1)) changes.push('抓取时间 ' + CONFIG.fetch1 + ' → ' + d.fetch1);
  if(String(d.fetch2) !== String(CONFIG.fetch2)) changes.push('抓取时间 ' + CONFIG.fetch2 + ' → ' + d.fetch2);
  if(th !== CONFIG.threshold) changes.push('评分阈值 ' + CONFIG.threshold + ' → ' + th);
  if(String(d.warn) !== String(CONFIG.warn)) changes.push('预警提前期 ' + CONFIG.warn + ' → ' + d.warn);
  if(!!d.llm !== !!CONFIG.llm) changes.push('语义增强 ' + (CONFIG.llm?'开→关':'关→开'));
  var btn = el; btn.classList.add('loading'); btn.setAttribute('aria-busy','true');
  setTimeout(function(){
    CONFIG.fetch1 = d.fetch1; CONFIG.fetch2 = d.fetch2;
    CONFIG.threshold = th; CONFIG.warn = String(wn); CONFIG.llm = !!d.llm;
    S.cfgDraft = cloneConfig();
    toast('参数已保存 · config.json 已更新', 'ok', changes.length ? changes.join(' · ') : '无实际变更（演示）');
    logAppend('info','config','参数更新 · ' + (changes.join(' · ') || '无变更'));
    render();
  }, 620);
};
ACTIONS['cfg-reset'] = function(){
  S.cfgDraft = cloneConfig();
  S.cfgErr = '';
  toast('已重置为已保存值', 'info');
  render();
};

/* ---------- 输入 / 变更事件 ---------- */
document.addEventListener('change', function(e){
  var el = null;
  try{ el = e.target.closest('[data-act]'); }catch(err){ el = null; }
  if(!el) return;
  var act = el.getAttribute('data-act');
  if(act === 'pipe-client'){ S.pipeFilter.client = el.value; render(); }
  else if(act === 'pipe-sort'){ S.pipeFilter.sort = el.value; render(); }
  else if(act === 'assets-filter'){ S.assets.filter = el.value; render(); }
  else if(act === 'ticket-tpl'){ if(S.ticket){ openTicketModal(bidById(S.ticket.bid), el.value); } }
  else if(act === 'cfg-input'){ /* 由 input 事件处理 */ }
});
document.addEventListener('input', function(e){
  var el = e.target;
  if(el && el.getAttribute && el.getAttribute('data-act') === 'cfg-input'){
    if(!S.cfgDraft) S.cfgDraft = cloneConfig();
    var k = el.getAttribute('data-k');
    S.cfgDraft[k] = el.value;
    updateCfgDirty();
  }
});

/* ---------- 启动 ---------- */
S.cfgDraft = cloneConfig();
boot();
})();
</script>
</body>
</html>
