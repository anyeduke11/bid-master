<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #111110;
    --bg-subtle: #191918;
    --surface: #1e1e1d;
    --surface-raised: #252524;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --accent: #8FA9C9;
    --accent-dim: rgba(143,169,201,0.15);
    --text: #e8e6e3;
    --text-secondary: rgba(232,230,227,0.6);
    --text-tertiary: rgba(232,230,227,0.32);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1.5px var(--accent);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --font-sans: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "JetBrains Mono", "Cascadia Code", Menlo, monospace;
    --font-serif: "Songti SC", "STSong", "Source Han Serif SC", "SimSun", Georgia, serif;
    --note-bg: #2a2520;
    --note-border: rgba(143,169,201,0.2);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    mix-blend-mode: overlay;
  }

  /* ===== canvas viewport ===== */
  .canvas-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
  }
  .canvas-viewport.panning { cursor: grabbing; }

  .canvas-world {
    position: absolute;
    left: 0; top: 0;
    width: 20000px; height: 20000px;
    transform-origin: 0 0;
    will-change: transform;
  }

  .canvas-viewport { --grid-color: rgba(255,255,255,0.04); }

  /* ===== draggable elements ===== */
  .canvas-el {
    position: absolute;
    cursor: grab;
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging {
    cursor: grabbing;
    z-index: 999;
    box-shadow: var(--shadow-drag) !important;
    transform: scale(1.01);
    transition: none;
  }

  /* ===== section header ===== */
  .section-header {
    position: absolute;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 16px;
    white-space: nowrap;
  }
  .section-header .section-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--accent);
    opacity: 0.8;
  }
  .section-header .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .section-header .section-line {
    flex: none;
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
    opacity: 0.3;
  }

  /* ===== title ===== */
  .canvas-title {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.025em;
    color: var(--text);
  }

  /* ===== text block ===== */
  .canvas-text {
    position: absolute;
    line-height: 1.7;
    letter-spacing: 0.005em;
    color: var(--text-secondary);
    min-width: 200px;
    max-width: 560px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ===== tag ===== */
  .canvas-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: border-color var(--transition-fast), background var(--transition-fast);
    white-space: nowrap;
  }
  .canvas-tag:hover {
    border-color: var(--border-hover);
    background: var(--surface-raised);
  }
  .canvas-tag .tag-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* ===== context card ===== */
  .context-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    min-width: 220px;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .context-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .context-card .card-head {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .context-card .card-head .head-indicator {
    width: 3px;
    height: 16px;
    border-radius: 2px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .context-card .card-head h3 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .context-card .card-content {
    padding: 0 20px 20px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
  }
  .context-card .card-content ul {
    list-style: none;
    padding: 0;
  }
  .context-card .card-content li {
    padding: 4px 0;
    padding-left: 12px;
    position: relative;
  }
  .context-card .card-content li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 11px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-tertiary);
  }
  .context-card .card-content .knum {
    font-family: var(--font-serif);
    color: var(--accent);
    font-size: 16px;
    font-weight: 600;
  }
  .context-card .flow-line {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    line-height: 2;
  }
  .context-card .flow-chip {
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    border-radius: 4px;
    padding: 1px 7px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .context-card .flow-arr { color: var(--accent); opacity: 0.7; }

  /* ===== design system card ===== */
  .ds-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .ds-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .ds-card .ds-head {
    padding: 16px 20px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .ds-card .ds-body { padding: 0 20px 20px; }

  /* frame — color chips */
  .ed-swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px 8px; }
  .ed-swatch { display: flex; flex-direction: column; gap: 5px; }
  .ed-swatch .sw { width: 100%; aspect-ratio: 1.35; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); }
  .ed-swatch .sw-name { font-size: 10px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ed-swatch .sw-hex { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); }

  /* frame — type samples */
  .ed-type-stack { display: flex; flex-direction: column; gap: 13px; }
  .ed-type-row { display: flex; align-items: baseline; gap: 14px; }
  .ed-type-meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); min-width: 64px; flex-shrink: 0; letter-spacing: 0.04em; }
  .ed-type-sample { color: var(--text); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* frame — component demos */
  .ed-comp-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .ed-comp-btn { font-size: 12px; padding: 7px 14px; border-radius: 8px; white-space: nowrap; }
  .ed-comp-btn.primary { background: #1B365D; color: #f5f4ed; }
  .ed-comp-btn.secondary { background: #e8e6dc; color: #3d3d3a; border: 1px solid #dcd9cb; }
  .ed-comp-btn.disabled { background: #1B365D; color: #f5f4ed; opacity: 0.42; }
  .ed-comp-label { font-size: 10px; color: var(--text-tertiary); margin: 2px 0 8px; letter-spacing: 0.06em; }
  .ed-stamp-demo { display: inline-flex; align-items: center; font-size: 11px; line-height: 1; padding: 4px 8px; border: 1px solid #d8d5c6; border-radius: 3px; color: #6b6a64; letter-spacing: 1px; }
  .ed-seal-mini { color: #9F2D2D; transform: rotate(-4deg); display: inline-flex; }
  .ed-input-demo { width: 100%; max-width: 300px; background: #faf9f5; border: 1px solid #d8d5c6; border-radius: 8px; padding: 7px 11px; font-size: 12px; color: #504e49; }
  .ed-num-demo { font-family: var(--font-serif); font-size: 26px; font-weight: 600; color: #1B365D; font-variant-numeric: tabular-nums; }

  /* ===== color swatch (standalone) ===== */
  .color-swatch-group { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 20px; }
  .swatch-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .swatch-circle { width: 56px; height: 56px; border-radius: 50%; box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.08); transition: transform var(--transition-fast), box-shadow var(--transition-fast); }
  .swatch-circle:hover { transform: scale(1.1); box-shadow: var(--shadow-md); }
  .swatch-name { font-size: 10px; font-weight: 500; color: var(--text-secondary); text-align: center; }
  .swatch-hex { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); text-align: center; }

  /* ===== type sample (standalone) ===== */
  .type-sample-group { display: flex; flex-direction: column; gap: 20px; min-width: 400px; }
  .type-sample-row { display: flex; align-items: baseline; gap: 20px; }
  .type-sample-meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); min-width: 48px; flex-shrink: 0; letter-spacing: 0.04em; }
  .type-sample-text { color: var(--text); line-height: 1.25; }

  /* ===== note (sticky) ===== */
  .canvas-note { background: var(--note-bg); border: 1px solid var(--note-border); border-radius: var(--radius-md); padding: 16px 18px; min-width: 200px; max-width: 300px; box-shadow: var(--shadow-sm); transition: box-shadow var(--transition-normal), transform var(--transition-fast); }
  .canvas-note:hover { box-shadow: var(--shadow-md); }
  .canvas-note .note-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); opacity: 0.7; margin-bottom: 8px; }
  .canvas-note .note-body { font-size: 13px; line-height: 1.65; color: var(--text-secondary); }

  /* ===== design page ===== */
  .design-page { background: #fff; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-lg); transition: box-shadow var(--transition-normal); }
  .design-page:hover { box-shadow: 0 16px 56px rgba(0,0,0,0.5), 0 6px 16px rgba(0,0,0,0.35); }
  .design-page .page-content { width: 100%; height: 100%; overflow: hidden; }
  .page-label { position: absolute; bottom: -32px; left: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: var(--text-tertiary); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .page-label .label-num { font-family: var(--font-mono); font-size: 10px; color: var(--accent); opacity: 0.6; }

  /* ===== diagram ===== */
  .canvas-diagram { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .canvas-diagram .diagram-content { width: 100%; height: 100%; padding: 20px; }

  /* ===== zoom controls ===== */
  .zoom-controls { position: fixed; bottom: 24px; right: 24px; display: flex; align-items: center; gap: 1px; z-index: 100; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-md); }
  .zoom-btn { width: 36px; height: 36px; background: transparent; border: none; color: var(--text-secondary); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background var(--transition-fast), color var(--transition-fast); }
  .zoom-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .zoom-btn:active { background: rgba(255,255,255,0.03); }
  .zoom-label { min-width: 50px; height: 36px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

  /* ===== coord indicator ===== */
  .coord-indicator { position: fixed; bottom: 28px; left: 24px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-tertiary); z-index: 100; padding: 4px 10px; background: rgba(17,17,16,0.85); border: 1px solid var(--border); border-radius: var(--radius-sm); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

  /* ===== keyboard hint ===== */
  .kbd-hint { position: fixed; top: 20px; right: 24px; z-index: 100; font-size: 10px; color: var(--text-tertiary); display: flex; gap: 12px; opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
  .canvas-viewport:hover ~ .kbd-hint { opacity: 1; }
  .kbd-hint kbd { font-family: var(--font-mono); padding: 2px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; }

  /* ═══════════════════════════════════════════════
     Row 3 frame styles — prefix "ed-", fully isolated
     Tokens mirror the prototype CSS exactly.
     ═══════════════════════════════════════════════ */
  .ed-page {
    --ed-bg:#f5f4ed; --ed-surface:#faf9f5; --ed-sand:#e8e6dc; --ed-deep:#30302e;
    --ed-ink:#141413; --ed-ink2:#3d3d3a; --ed-ink3:#504e49; --ed-ink4:#6b6a64;
    --ed-accent:#1B365D; --ed-accent2:#2D5A8A; --ed-seal:#9F2D2D;
    --ed-tint1:#EEF2F7; --ed-tint2:#E4ECF5; --ed-tint3:#D0DCE9;
    --ed-ok:#2D6A4F; --ed-okT:#E9F0EA; --ed-warn:#A16207; --ed-warnT:#F3EBD9; --ed-dgrT:#F4E4E0;
    --ed-line:#e8e6dc; --ed-line2:#e5e3d8; --ed-line3:#d8d5c6; --ed-hover:#f1efe5;
    --ed-serif:"Songti SC","STSong","Source Han Serif SC","SimSun",Georgia,serif;
    --ed-ui:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    --ed-mono:"SF Mono","Menlo","Consolas",monospace;
    width:100%; height:100%; background:var(--ed-bg); color:var(--ed-ink);
    font-family:var(--ed-ui); font-size:13px; line-height:1.6;
    display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  .ed-page .tnum { font-variant-numeric: tabular-nums; }
  .ed-serif { font-family: var(--ed-serif); }
  .ed-mono { font-family: var(--ed-mono); font-size: 11px; letter-spacing: .02em; }
  .ed-mast { display:flex; align-items:baseline; justify-content:space-between; padding:13px 26px 0; flex:none; }
  .ed-brand { font-family:var(--ed-serif); font-size:22px; font-weight:600; letter-spacing:3px; }
  .ed-bsub { font-family:var(--ed-mono); font-size:10px; color:var(--ed-ink4); margin-left:9px; }
  .ed-mstat { font-size:10px; color:var(--ed-ink3); font-variant-numeric: tabular-nums; }
  .ed-nav { display:flex; gap:19px; padding:11px 26px 0; font-size:12.5px; color:var(--ed-ink2); border-bottom:1px solid var(--ed-line3); padding-bottom:10px; flex:none; }
  .ed-nav span { padding-bottom:8px; }
  .ed-nav .on { color:var(--ed-accent); font-weight:600; border-bottom:2px solid var(--ed-accent); }
  .ed-body { flex:1; padding:16px 26px 18px; overflow:hidden; }
  .ed-vh { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:12px; }
  .ed-vh h1 { font-family:var(--ed-serif); font-size:23px; font-weight:600; letter-spacing:2px; line-height:1.3; }
  .ed-vh .lede { color:var(--ed-ink3); font-size:11.5px; margin-top:3px; max-width:760px; }
  .ed-vh .meta { font-size:10.5px; color:var(--ed-ink4); text-align:right; line-height:1.8; font-variant-numeric: tabular-nums; }
  .ed-stamp { display:inline-flex; align-items:center; font-size:11px; line-height:1; padding:4px 8px; border:1px solid var(--ed-line3); border-radius:3px; color:var(--ed-ink2); letter-spacing:1px; white-space:nowrap; }
  .ed-stamp.accent { color:var(--ed-accent); border-color:#b9c6d8; }
  .ed-stamp.warn { color:var(--ed-warn); border-color:#d8c9a3; background:var(--ed-warnT); }
  .ed-stamp.danger { color:var(--ed-seal); border-color:#d9b8b1; background:var(--ed-dgrT); }
  .ed-stamp.ok { color:var(--ed-ok); border-color:#b9cdbf; background:var(--ed-okT); }
  .ed-stamp.muted { color:var(--ed-ink4); border-color:var(--ed-line3); }
  .ed-tbar { display:flex; align-items:center; gap:20px; padding:8px 0 10px; border-bottom:1px solid var(--ed-line3); margin-bottom:4px; font-size:11.5px; color:var(--ed-ink3); }
  .ed-tbar .seg { display:flex; gap:14px; }
  .ed-tbar .sg { color:var(--ed-ink3); padding-bottom:4px; }
  .ed-tbar .sg.on { color:var(--ed-accent); font-weight:600; border-bottom:2px solid var(--ed-accent); }
  .ed-tbar .grow { flex:1; }
  .ed-stagehead { display:flex; align-items:baseline; gap:10px; padding:9px 0 6px; border-bottom:1px solid var(--ed-line3); }
  .ed-stagehead .no { font-family:var(--ed-serif); font-size:13px; color:var(--ed-accent); letter-spacing:1px; }
  .ed-stagehead .nm { font-family:var(--ed-serif); font-size:16px; font-weight:600; letter-spacing:2px; }
  .ed-stagehead .mt { margin-left:auto; font-size:10.5px; color:var(--ed-ink4); font-variant-numeric: tabular-nums; }
  .ed-card { background:var(--ed-surface); border:1px solid var(--ed-line); border-radius:10px; padding:10px 15px 11px; margin-top:9px; }
  .ed-card .l1 { display:flex; align-items:center; gap:9px; }
  .ed-card .bidid { font-family:var(--ed-mono); font-size:10.5px; color:var(--ed-ink3); }
  .ed-card .prio { margin-left:auto; font-family:var(--ed-serif); font-size:12px; font-weight:600; letter-spacing:1px; }
  .ed-card .nm { font-family:var(--ed-serif); font-size:14px; font-weight:600; margin-top:3px; letter-spacing:.5px; }
  .ed-card .mt { margin-top:4px; font-size:10.5px; color:var(--ed-ink3); display:flex; gap:13px; font-variant-numeric: tabular-nums; }
  .ed-card .mt .warn { color:var(--ed-warn); font-weight:600; }
  .ed-card .marks { margin-top:7px; display:flex; gap:9px; }
  .ed-mark { font-size:10.5px; display:inline-flex; gap:5px; align-items:center; color:var(--ed-seal); }
  .ed-mark.warn { color:var(--ed-warn); }
  .ed-s9row { display:flex; align-items:center; gap:12px; padding:9px 2px; border-bottom:1px solid var(--ed-line2); font-size:12px; color:var(--ed-ink3); }
  .ed-empty { padding:11px 2px; color:var(--ed-ink4); font-size:11.5px; border-bottom:1px dashed var(--ed-line); }
  .ed-ruler { display:flex; border-bottom:1px solid var(--ed-line3); margin:12px 0 6px; }
  .ed-ruler .rs { flex:1; padding:7px 2px 6px; border-bottom:3px solid transparent; min-width:0; }

  <button class="zoom-btn" id="zoomIn" aria-label="">+</button>
  <button class="zoom-btn" id="zoomReset" title="" aria-label="">&#8962;</button>

<script>
(() => {
  // ═══════════════════════════════════════════════════════════
  // UI_STRINGS：全量中文化（画布 + 页面文案）
  // ═══════════════════════════════════════════════════════════
  const UI_STRINGS = {
    docTitle: '投标工作台 · 方案B「编辑部」· 无限画布',
    zoom: { zoomIn: '放大', zoomOut: '缩小', reset: '复位视图' },
    kbdHints: [['滚动', '平移'], ['\u2318 滚动', '缩放'], ['\u2318Z', '撤销']],
    sections: { context: '01 项目背景', designSystem: '02 设计系统', deliverables: '03 设计稿' }

  document.title = UI_STRINGS.docTitle;
  document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
  document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);

  document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints
    .map(([keys, action]) => `<span><kbd>${keys}</kbd> ${action}</span>`)

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* ===== canvas state ===== */
  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }

  /* ===== dot grid ===== */
  function updateGrid() {
    const g = 40 * zoom;
    const ox = panX % g, oy = panY % g;
    viewport.style.backgroundImage = `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${ox}px ${oy}px`;
  }

  /* ===== panning ===== */
  let isPanning = false, panSX, panSY;

  viewport.addEventListener('pointerdown', (e) => {
    if (e.target === viewport || e.target === world) {
      isPanning = true;
      panSX = e.clientX - panX;
      panSY = e.clientY - panY;
      viewport.classList.add('panning');
      viewport.setPointerCapture(e.pointerId);
      e.preventDefault();
    }

    if (!isPanning) return;
    panX = e.clientX - panSX;
    panY = e.clientY - panSY;
    updateTransform();

    isPanning = false;
    viewport.classList.remove('panning');
  });

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();

    if (e.ctrlKey || e.metaKey) {
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    } else {
      const hasX = Math.abs(e.deltaX) > 0.5;
      if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) {
        panX -= e.deltaX;
        panY -= e.deltaY;
      } else {
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
        const factor = e.deltaY > 0 ? 0.95 : 1.05;
        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
        panX = mx - wx * zoom;
        panY = my - wy * zoom;
      }

  function zoomAt(factor) {
    const r = viewport.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = cx - wx * zoom;
    panY = cy - wy * zoom;
    updateTransform();
  }

  document.getElementById('zoomOut').onclick = () => zoomAt(0.8);
  document.getElementById('zoomReset').onclick = () => { zoom = 1; panX = 0; panY = 0; updateTransform(); };

  viewport.addEventListener('pointermove', (e) => {
    if (isPanning) return;
    const r = viewport.getBoundingClientRect();
    coordIndicator.textContent = `${Math.round((e.clientX - r.left - panX) / zoom)}, ${Math.round((e.clientY - r.top - panY) / zoom)}`;
  });

  viewport.addEventListener('touchstart', (e) => {

      lastPinchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };

  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    if (lastPinchDist > 0) {
      const r = viewport.getBoundingClientRect();
      const mx = center.x - r.left, my = center.y - r.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.pow(dist / lastPinchDist, 0.6)));

      panY = my - wy * zoom;

      panY += center.y - lastPinchCenter.y;
    }

    lastPinchCenter = center;

  function addArrow(x1, x2, y, label) {
    const left = Math.min(x1, x2), w = Math.abs(x2 - x1);

    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('arrow');
    el.style.left = left + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    el.style.height = '26px';
    el.style.pointerEvents = 'none';
    el.style.cursor = 'default';
    const head = dir > 0
      ? `<path d="M${w - 7} 15l6 5-6 5" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-opacity="0.8"/>`
      : `<path d="M7 15l-6 5 6 5" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-opacity="0.8"/>`;
    el.innerHTML = `<svg width="${w}" height="26" style="display:block;overflow:visible">
        <line x1="0" y1="20" x2="${w}" y2="20" stroke="var(--accent)" stroke-width="1" stroke-opacity="0.45"/>

      </svg>
      <span style="position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:11px;color:var(--accent);opacity:.9;background:var(--bg);padding:0 8px;white-space:nowrap;letter-spacing:.02em">${esc(label)}</span>`;
    world.appendChild(el);
    return el;
  }

  /* ===== Layout helpers (overlap prevention) ===== */
  function below(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.top) + el.offsetHeight + gap; }
  function rightOf(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.left) + el.offsetWidth + gap; }
  function maxY(els, gap) { if (gap === undefined) gap = 20; return Math.max(...els.map(e => parseFloat(e.style.top) + e.offsetHeight)) + gap; }
  function maxX(els, gap) { if (gap === undefined) gap = 20; return Math.max(...els.map(e => parseFloat(e.style.left) + e.offsetWidth)) + gap; }

  /* ===== expose API ===== */
  window.canvas = { addSection, addTitle, addText, addTag, addContextCard, addDesignSystemCard, addColorSwatch, addTypeSample, addPage, addNote, addDiagram, addArrow, below, rightOf, maxY, maxX,

    getViewportRect: () => viewport.getBoundingClientRect()
  };
})();
