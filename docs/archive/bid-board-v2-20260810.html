<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>投标看板 v2 · Duke · Mavis</title>
<style>
  :root {
    --bg: #F4F7FB;
    --bg-soft: #E8EFF8;
    --card: #FFFFFF;
    --line: #DDE5F0;
    --line-soft: #ECF1F7;
    --ink: #0F1E33;
    --ink-soft: #4A5A75;
    --ink-mute: #7A8AA0;
    --brand: #0EA5E9;
    --brand-deep: #0369A1;
    --brand-soft: #E0F2FE;
    --accent: #6366F1;
    --accent-soft: #EEF2FF;
    --ok: #10B981;
    --ok-soft: #D1FAE5;
    --warn: #F59E0B;
    --warn-soft: #FEF3C7;
    --danger: #EF4444;
    --danger-soft: #FEE2E2;
    --p0: #EF4444;
    --p1: #F59E0B;
    --p2: #38BDF8;
    --dash-bg: #0F1E33;
    --dash-line: rgba(255,255,255,.08);
    --dash-ink: #E6F1FB;
    --dash-mute: #94A3B8;
    --dash-soft: rgba(255,255,255,.05);
    --shadow-sm: 0 1px 2px rgba(15,30,51,.04);
    --shadow: 0 1px 2px rgba(15,30,51,.04), 0 8px 24px rgba(15,30,51,.06);
    --shadow-lg: 0 12px 40px rgba(15,30,51,.10);
    --r-sm: 6px;
    --r: 10px;
    --r-lg: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    line-height: 1.55; font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 18px 24px 0; width: 100%; flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ====== HEADER ====== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--brand), var(--accent));
    color: white; font-weight: 700; display: flex; align-items: center; justify-content: center;
    font-size: 14px; box-shadow: var(--shadow);
  }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .brand h1 .sub { color: var(--ink-mute); font-size: 12px; font-weight: 500; margin-left: 8px; letter-spacing: .02em; }
  .topbar .nav { display: flex; gap: 4px; align-items: center; }
  .nav a {
    padding: 6px 12px; border-radius: 6px; color: var(--ink-soft);
    text-decoration: none; font-size: 13px; font-weight: 500;
  }
  .nav a:hover { background: var(--bg-soft); color: var(--ink); }
  .nav a.active { background: var(--brand-soft); color: var(--brand-deep); font-weight: 600; }
  .nav .sep { width: 1px; height: 16px; background: var(--line); margin: 0 6px; }
  .live-indicator {
    display: flex; align-items: center; gap: 6px;
    background: white; border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 999px; font-size: 12px;
    font-family: "SF Mono", monospace; color: var(--ink-soft);
  }
  .live-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 0 0 var(--ok); animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,.4); }
    70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }

  /* ====== STATS BAR ====== */
  .stats {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
    margin-bottom: 14px;
  }
  .stat {
    background: white; border: 1px solid var(--line);
    border-radius: var(--r); padding: 10px 14px;
    transition: all .2s;
  }
  .stat:hover { box-shadow: var(--shadow-sm); }
  .stat .k { font-size: 11px; color: var(--ink-mute); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
  .stat .v { font-size: 22px; font-weight: 700; margin-top: 2px; letter-spacing: -.02em; }
  .stat .v small { font-size: 11px; color: var(--ink-mute); font-weight: 500; margin-left: 3px; }
  .stat .v .delta { font-size: 11px; color: var(--ok); font-weight: 600; margin-left: 6px; }
  .stat .v .delta.warn { color: var(--warn); }
  .stat .v .delta.err { color: var(--danger); }
  .stat.alert .v { color: var(--danger); }
  .stat.warn .v { color: var(--warn); }
  .stat.ok .v { color: var(--ok); }
  .stat .v.flash { animation: numflash .6s; }
  @keyframes numflash { 0% { transform: scale(1); } 50% { transform: scale(1.1); color: var(--brand); } 100% { transform: scale(1); } }

  /* ====== MAIN: cards + playbook ====== */
  .main {
    display: grid; grid-template-columns: 1fr 380px; gap: 14px;
    flex: 1; min-height: 0;
  }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; padding: 0 4px;
  }
  .col-head h2 { font-size: 13px; margin: 0; font-weight: 700; color: var(--ink-soft);
    letter-spacing: .04em; text-transform: uppercase; }
  .col-head .filter { display: flex; gap: 4px; }
  .filter-btn {
    padding: 3px 10px; font-size: 12px; border-radius: 5px;
    border: 1px solid var(--line); background: white; color: var(--ink-soft);
    cursor: pointer;
  }
  .filter-btn:hover { border-color: var(--brand); color: var(--brand-deep); }
  .filter-btn.active { background: var(--brand); color: white; border-color: var(--brand); font-weight: 600; }

  .card-list { display: flex; flex-direction: column; gap: 8px; }
  .bid-card {
    background: white; border: 1px solid var(--line);
    border-radius: var(--r); padding: 0; overflow: hidden;
    transition: all .25s; position: relative;
  }
  .bid-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .bid-card.flash { animation: cardflash .8s; }
  @keyframes cardflash { 0% { background: var(--accent-soft); } 100% { background: white; } }
  .bid-card .strip { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .bid-card.p0 .strip { background: var(--p0); }
  .bid-card.p1 .strip { background: var(--p1); }
  .bid-card.p2 .strip { background: var(--p2); }
  .bid-card .body { padding: 12px 16px 12px 18px; }
  .bid-card .row1 { display: flex; align-items: center; gap: 10px; }
  .bid-card .client { font-size: 15px; font-weight: 700; color: var(--ink); }
  .badge-code {
    font-family: "SF Mono", monospace; font-size: 11px; padding: 1px 6px;
    background: var(--bg-soft); color: var(--ink-soft); border-radius: 4px;
  }
  .badge-code.linked {
    background: var(--brand-soft); color: var(--brand-deep);
    cursor: pointer; transition: all .15s;
  }
  .badge-code.linked:hover { background: var(--brand); color: white; }
  .badge-stage {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    font-weight: 600;
  }
  .st-跟踪 { background: #F1F5F9; color: #475569; }
  .st-审查 { background: #DBEAFE; color: #1E40AF; }
  .st-报价 { background: #FED7AA; color: #9A3412; }
  .st-修订 { background: #FBCFE8; color: #9D174D; }
  .st-封标 { background: #FECACA; color: #991B1B; }
  .st-述标 { background: #A7F3D0; color: #065F46; }
  .badge-pri {
    font-size: 10.5px; padding: 2px 7px; border-radius: 4px; font-weight: 700;
  }
  .pri-p0 { background: var(--danger); color: white; }
  .pri-p1 { background: var(--warn); color: white; }
  .pri-p2 { background: var(--brand-soft); color: var(--brand-deep); }
  .row1 .spacer { flex: 1; }
  .row1 .due { font-size: 12px; color: var(--ink-mute); font-family: "SF Mono", monospace; }
  .row1 .due b { color: var(--danger); }
  .row1 .expand-btn {
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line);
    background: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--ink-mute); transition: all .15s;
  }
  .row1 .expand-btn:hover { border-color: var(--brand); color: var(--brand); }

  .bid-card .row2 {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
  }
  .field { min-width: 0; }
  .field .lbl { font-size: 10.5px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .field .val { font-size: 12.5px; margin-top: 3px; line-height: 1.5; }
  .field .val.ai { color: var(--brand-deep); }
  .field .val.human { color: var(--warn); font-weight: 600; }
  .field .val.block { color: var(--danger); font-weight: 600; }
  .field .val.empty { color: var(--ink-mute); font-style: italic; font-weight: 400; }
  .ai-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .ai-chip {
    font-size: 11px; padding: 1px 7px; background: var(--brand-soft); color: var(--brand-deep);
    border-radius: 4px; font-weight: 500;
  }
  .ai-chip.new { animation: chipin .6s; background: var(--accent); color: white; }
  @keyframes chipin { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* 展开详情 */
  .bid-card .detail { display: none; padding: 0 16px 14px 18px; border-top: 1px solid var(--line-soft); }
  .bid-card.expanded .detail { display: block; }
  .bid-card.expanded { box-shadow: var(--shadow); }
  .detail .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-top: 10px; }
  .detail .timeline { font-family: "SF Mono", monospace; font-size: 11.5px; }
  .detail .timeline .ev { padding: 3px 0; color: var(--ink-soft); }
  .detail .timeline .ev .ts { color: var(--ink-mute); margin-right: 6px; }
  .detail .timeline .ev .tag { font-weight: 600; }
  .detail .api-block {
    background: var(--dash-bg); color: #94A3B8; padding: 8px 10px;
    border-radius: 6px; font-family: "SF Mono", monospace; font-size: 11.5px;
    line-height: 1.7; margin-top: 6px;
  }
  .detail .api-block .k { color: #C7D2FE; }
  .detail .api-block .s { color: #FDE68A; }
  .detail .api-block .v { color: #7DD3FC; }

  /* 卡片事件提示(贴在卡片底部) */
  .card-event {
    background: var(--accent-soft); border-top: 1px solid var(--accent);
    color: var(--accent); font-size: 11.5px; padding: 6px 16px 6px 18px;
    display: flex; align-items: center; gap: 8px; font-weight: 500;
    animation: eventin .3s;
  }
  .card-event.hide { display: none; }
  @keyframes eventin { from { transform: translateY(-4px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .card-event .ts { font-family: "SF Mono", monospace; color: var(--ink-mute); font-weight: 400; }

  /* ====== PLAYBOOK ====== */
  .playbook-panel {
    background: white; border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; min-height: 0; flex: 1;
  }
  .playbook-head {
    padding: 12px 16px; border-bottom: 1px solid var(--line-soft);
  }
  .playbook-head h3 { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-soft);
    letter-spacing: .04em; text-transform: uppercase; }
  .playbook-head .help { font-size: 11.5px; color: var(--ink-mute); margin-top: 4px; line-height: 1.5; }

  .playbook-list { padding: 8px; overflow-y: auto; flex: 1; }
  .playbook {
    border: 1px solid var(--line-soft); border-radius: var(--r); padding: 10px 12px;
    margin-bottom: 8px; transition: all .2s; position: relative;
  }
  .playbook:hover { border-color: var(--brand); background: var(--bg-soft); }
  .playbook.running { border-color: var(--accent); background: var(--accent-soft); }
  .playbook .pb-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .playbook .pb-num {
    width: 22px; height: 22px; border-radius: 6px;
    background: var(--ink); color: white; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .playbook .pb-name { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .playbook .pb-desc { font-size: 11.5px; color: var(--ink-soft); margin: 4px 0 8px; line-height: 1.5; }
  .playbook .pb-target {
    font-size: 10.5px; color: var(--ink-mute); margin-bottom: 8px;
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  }
  .playbook .pb-target .target-tag {
    font-family: "SF Mono", monospace; padding: 1px 6px;
    background: white; border: 1px solid var(--line);
    border-radius: 4px; font-weight: 500;
  }
  .playbook .pb-target .target-tag.linked {
    background: var(--brand-soft); border-color: var(--brand); color: var(--brand-deep);
    cursor: pointer; transition: all .15s;
  }
  .playbook .pb-target .target-tag.linked:hover { background: var(--brand); color: white; }
  .playbook .steps { display: flex; flex-direction: column; gap: 4px; }
  .pb-step {
    display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center;
    padding: 5px 8px; background: var(--bg-soft); border-radius: 5px; font-size: 11.5px;
    color: var(--ink-soft); transition: all .15s;
  }
  .pb-step:hover { background: white; }
  .pb-step .step-n { font-family: "SF Mono", monospace; font-weight: 700; color: var(--ink-mute); font-size: 10.5px; }
  .pb-step .step-t { font-weight: 500; }
  .pb-step .step-t code { font-family: "SF Mono", monospace; font-size: 10.5px; color: var(--brand-deep); background: white; padding: 0 4px; border-radius: 3px; }
  .pb-step .step-go {
    font-size: 10.5px; padding: 2px 7px; border-radius: 4px;
    background: white; border: 1px solid var(--line); cursor: pointer;
    color: var(--ink-soft); font-weight: 500; transition: all .15s;
  }
  .pb-step .step-go:hover { background: var(--brand); color: white; border-color: var(--brand); }
  .pb-step .step-go.done { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); pointer-events: none; }
  .pb-step .step-go.running { background: var(--accent); color: white; border-color: var(--accent); }
  .pb-run-all {
    margin-top: 8px; width: 100%; padding: 6px; font-size: 12px; font-weight: 600;
    background: var(--ink); color: white; border: none; border-radius: 6px;
    cursor: pointer; transition: all .15s;
  }
  .pb-run-all:hover { background: var(--brand); }
  .pb-run-all:disabled { background: var(--line); color: var(--ink-mute); cursor: not-allowed; }

  /* ====== EVENT STREAM(底部固定) ====== */
  .event-bar {
    background: var(--dash-bg); color: var(--dash-ink);
    border-radius: var(--r) var(--r) 0 0;
    margin: 14px -24px 0; padding: 10px 24px;
    max-height: 200px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .event-bar .ev-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px; padding-bottom: 6px;
    border-bottom: 1px solid var(--dash-line);
  }
  .event-bar .ev-head h4 {
    margin: 0; font-size: 11px; color: var(--dash-mute);
    letter-spacing: .08em; text-transform: uppercase; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .event-bar .ev-head h4 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
    animation: pulse 1.6s infinite; }
  .event-bar .ev-head .ev-actions { display: flex; gap: 4px; }
  .ev-btn {
    background: transparent; border: 1px solid var(--dash-line);
    color: var(--dash-mute); padding: 3px 10px; font-size: 11px;
    border-radius: 4px; cursor: pointer; font-family: "SF Mono", monospace;
  }
  .ev-btn:hover { color: var(--dash-ink); border-color: var(--dash-ink); }
  .event-list { overflow-y: auto; font-family: "SF Mono", monospace; font-size: 11.5px; line-height: 1.7; }
  .ev-row { display: grid; grid-template-columns: 70px 200px 1fr; gap: 12px; padding: 2px 0; }
  .ev-row .ts { color: #475569; }
  .ev-row .api { color: #7DD3FC; }
  .ev-row .api .verb { color: #C7D2FE; font-weight: 600; }
  .ev-row .ctx { color: #94A3B8; }
  .ev-row .ctx .k { color: #94A3B8; }
  .ev-row .ctx .s { color: #FDE68A; }
  .ev-row .ctx .v { color: #6EE7B7; }
  .ev-row .err { color: #FCA5A5; }
  .ev-row .ok { color: #6EE7B7; }
  .ev-row.new { animation: evrowin .4s; }
  @keyframes evrowin { from { background: rgba(99,102,241,.2); transform: translateX(8px); } to { background: transparent; transform: translateX(0); } }

  /* 状态颜色标识(用于剧本运行结果) */
  .pulse-blue { animation: pulseblue .6s; }
  @keyframes pulseblue { 0% { box-shadow: 0 0 0 0 rgba(14,165,233,.5); } 100% { box-shadow: 0 0 0 12px rgba(14,165,233,0); } }

  /* Empty state */
  .empty {
    padding: 40px 20px; text-align: center; color: var(--ink-mute);
    font-size: 13px; background: white; border: 1px dashed var(--line);
    border-radius: var(--r);
  }
  .empty .ic { font-size: 28px; margin-bottom: 8px; opacity: .4; }

  @media (max-width: 1100px) {
    .main { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .bid-card .row2 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 700px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .bid-card .row2 { grid-template-columns: 1fr; }
    .wrap { padding: 12px 12px 0; }
  }

  /* ====== FLOW SWIMLANE ====== */
  .flow-section {
    margin-top: 16px;
    background: white; border: 1px solid var(--line); border-radius: var(--r);
    padding: 14px 16px; box-shadow: var(--shadow-sm);
  }
  .flow-section .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .flow-section .head h2 {
    font-size: 14px; margin: 0; font-weight: 700; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .flow-section .head h2 .ic {
    width: 22px; height: 22px; border-radius: 6px; background: var(--brand-soft);
    color: var(--brand-deep); display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .flow-section .head .sub { font-size: 11.5px; color: var(--ink-mute); font-weight: 400; }
  .flow-section .head .right { display: flex; gap: 6px; align-items: center; }
  .flow-legend { display: flex; gap: 10px; font-size: 11px; color: var(--ink-soft); }
  .flow-legend .item { display: flex; align-items: center; gap: 4px; }
  .flow-legend .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .sw-done { background: var(--ok); }
  .sw-prog { background: var(--brand); }
  .sw-block { background: var(--danger); }
  .sw-plan { background: #FCD34D; }
  .sw-pend { background: var(--line); }
  .flow-overview {
    display: flex; gap: 16px; padding: 8px 12px; margin-bottom: 10px;
    background: var(--bg-soft); border-radius: 6px; font-size: 12px;
    color: var(--ink-soft); align-items: center; flex-wrap: wrap;
  }
  .flow-overview b { color: var(--ink); font-weight: 700; }
  .flow-overview .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .pill.danger { background: var(--danger-soft); color: var(--danger); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }

  .swimlane-wrap { overflow-x: auto; padding-bottom: 4px; }
  .swimlane {
    display: grid; grid-template-columns: 200px repeat(12, minmax(78px, 1fr));
    gap: 4px; min-width: 1200px;
  }
  .swimlane .corner {
    background: var(--bg-soft); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 8px; font-size: 11px; font-weight: 700; color: var(--ink-soft);
    text-align: center; display: flex; align-items: center; justify-content: center;
    height: 36px;
  }
  .swimlane .corner.client { text-align: left; justify-content: flex-start; }
  .swimlane .client-cell {
    background: white; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 12px; display: flex; flex-direction: column;
    justify-content: center; gap: 3px; min-height: 64px;
    box-shadow: 0 1px 2px rgba(15,30,51,.03);
    transition: all .2s; position: relative; overflow: hidden;
  }
  .swimlane .client-cell::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--line);
  }
  .swimlane .client-cell.p0::before { background: var(--p0); }
  .swimlane .client-cell.p1::before { background: var(--p1); }
  .swimlane .client-cell.p2::before { background: var(--p2); }
  .swimlane .client-cell:hover { box-shadow: var(--shadow); border-color: var(--brand); }
  .swimlane .client-cell .c-name { font-weight: 700; color: var(--ink); font-size: 13.5px; }

    return {

  });
}

  const startIdx = stageMap[bid.stage] ?? 0;
  bid.flow.nodes.forEach((n, i) => {
    if (n.status === 'pending' && i < startIdx) n.status = 'done';
    else if (n.status === 'pending' && i === startIdx) n.status = 'progress';
  });
  return bid.flow;

    logEvent('removeAiReady', code, { item });

    notify({ type: 'create', code: bid.code });

    const s = { total: data.bids.length, p0: 0, p1: 0, p2: 0, ready: 0, totalAi: 0, blocked: 0, urgent: 0 };
    data.bids.forEach(b => {
      s[b.priority.toLowerCase()]++;
      s.totalAi += b.ai_ready.length;
      if (b.ai_ready.length > 0) s.ready++;
      if (b.block) s.blocked++;
      if (b.priority === 'P0') s.urgent++;
    });
    s.readyRate = s.total > 0 ? Math.round(s.ready / s.total * 100) : 0;
    return s;

  emit(evt) { notify(evt); }
};

function find(code) { return data.bids.find(b => b.code === code); }
function update(code, patch, api, sourceTag) {
  const b = find(code);
  if (!b) { addSysEvent(`客户不存在: ${code}`, 'err'); return; }
  Object.assign(b, patch, { last_sync: nowHM() });
  if (sourceTag) b.timeline = [...(b.timeline || []), { ts: nowHM(), tag: sourceTag, txt: Object.keys(patch).join(',') }];
  saveData(); renderAll();
  Object.keys(patch).forEach(k => {
    logEvent('update.' + k, code, { value: patch[k] });
    notify({ type: 'update', code, field: k, value: patch[k] });
  });
  flashCard(code, Object.values(patch).join(' / '));
}

function notify(evt) {
  subs.forEach(cb => { try { cb(evt); } catch(e) {} });
  window.dispatchEvent(new CustomEvent('bidboard:change', { detail: evt }));
}

// ============================================================
// 事件流
// ============================================================
function logEvent(api, code, payload) {
  if (paused) return;
  const ev = { ts: nowFull(), api, code, payload, type: 'api' };
  events.unshift(ev);
  if (events.length > EVENTS_LIMIT) events = events.slice(0, EVENTS_LIMIT);
  saveEvents();
  if (bc) bc.postMessage({ type: 'event', ev });
  renderEvents(ev);
}
function addSysEvent(msg, level) {
  if (paused) return;
  const ev = { ts: nowFull(), msg, level: level || 'info', type: 'sys' };
  events.unshift(ev);
  if (events.length > EVENTS_LIMIT) events = events.slice(0, EVENTS_LIMIT);
  saveEvents();
  renderEvents(ev);
}

function renderEvents(newEv) {
  const list = document.getElementById('event-list');
  if (!newEv) {
    list.innerHTML = events.slice(0, 60).map(evHTML).join('');
    return;
  }
  const html = evHTML(newEv);
  list.insertAdjacentHTML('afterbegin', `<div class="ev-row new">${html}</div>`);
  if (list.children.length > 60) list.lastElementChild.remove();
}
function evHTML(ev) {
  if (ev.type === 'sys') {
    const cls = ev.level === 'err' ? 'err' : ev.level === 'warn' ? '' : '';
    return `<span class="ts">${ev.ts}</span><span class="api ${cls}">[system]</span><span class="ctx">${ev.msg}</span>`;
  }
  const payload = ev.payload ? ` <span class="k">${
    Object.entries(ev.payload).map(([k,v]) => `${k}=<span class="s">${JSON.stringify(v)}</span>`).join(' ')
  }</span>` : '';
  return `<span class="ts">${ev.ts}</span><span class="api"><span class="verb">BidBoard.${ev.api}</span>(<span class="s">"${ev.code}"</span>)</span><span class="ctx">${payload}</span>`;
}

function flashCard(code, msg) {
  const el = document.querySelector(`.bid-card[data-code="${code}"]`);

    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    // 显示事件提示
    let ev = el.querySelector('.card-event');
    if (!ev) {
      ev = document.createElement('div');
      ev.className = 'card-event';
      el.appendChild(ev);
    }
    ev.innerHTML = `<span class="ts">${nowHM()}</span> · ${msg}`;
    clearTimeout(ev._t);
    ev._t = setTimeout(() => ev.classList.add('hide'), 4000);
  }
}
window.toggleCard = (code) => {
  const el = document.querySelector(`.bid-card[data-code="${code}"]`);
  if (el) {
    el.classList.toggle('expanded');
    const btn = el.querySelector('.expand-btn');
    if (btn) btn.textContent = el.classList.contains('expanded') ? '⌃' : '⌄';
  }
};
window.scrollToCard = (code) => {
  document.querySelectorAll('.bid-card').forEach(c => c.style.boxShadow = '');
  const el = document.querySelector(`.bid-card[data-code="${code}"]`);
  if (el) {
    el.style.boxShadow = '0 0 0 2px var(--brand)';
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => el.style.boxShadow = '', 2000);
  }
};

function renderFlowOverview() {
  let totalNodes = 0, doneNodes = 0, progNodes = 0, blockedNodes = 0, plannedNodes = 0;
  let urgentBlocked = 0;
  const today = new Date('2026-08-10');

  data.bids.forEach(b => {
    if (!b.flow) return;
    b.flow.nodes.forEach(n => {
      totalNodes++;
      if (n.status === 'done') doneNodes++;
      else if (n.status === 'progress') progNodes++;
      else if (n.status === 'blocked') { blockedNodes++; urgentBlocked++; }
      else if (n.status === 'planned') plannedNodes++;
    });
  });

  // 紧急阻塞 = 阻塞且距截止 ≤ 5 天
  data.bids.forEach(b => {
    if (!b.flow || !b.due_at || b.due_at === '持续') return;
    const due = new Date(b.due_at.replace(' ', 'T'));
    const daysToDue = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
    if (daysToDue <= 5 && b.flow.nodes.some(n => n.status === 'blocked')) urgentBlocked++;
  });

  document.getElementById('flow-overview').innerHTML = `
    <span><b>${data.bids.length}</b> 客户在跑</span>
    <span>·</span>
    <span>流程节点 <b>${totalNodes}</b> 个</span>
    <span>·</span>
    <span><span class="pill ok">完成 ${doneNodes}</span></span>
    <span><span class="pill" style="background: var(--brand-soft); color: var(--brand-deep);">进行 ${progNodes}</span></span>
    <span><span class="pill" style="background: #FEF3C7; color: #92400E;">计划 ${plannedNodes}</span></span>
    <span><span class="pill ${blockedNodes > 0 ? 'danger' : ''}">阻塞 ${blockedNodes}</span></span>
    ${urgentBlocked > 0 ? `<span style="margin-left: auto;">⚠ <b style="color: var(--danger);">${urgentBlocked}</b> 个客户紧急阻塞(≤ 5 天截止)</span>` : ''}
  `;
}

function renderSwimlane() {
  const wrap = document.getElementById('swimlane');
  let html = '';

  // 表头
  html += `<div class="corner client">客户 / 节点</div>`;
  FLOW_TEMPLATE.forEach(t => {
    html += `<div class="corner" title="${t.name} (${t.days_before_due >= 0 ? 'D-' + t.days_before_due : 'D+' + Math.abs(t.days_before_due)}) · 负责人: ${t.owner}">
      <div style="text-align: center;">
        <div>${t.name}</div>
        <div style="font-size: 9.5px; color: var(--ink-mute); font-family: 'SF Mono', monospace; margin-top: 1px;">
          ${t.days_before_due >= 0 ? 'D-' + t.days_before_due : 'D+' + Math.abs(t.days_before_due)}
        </div>
      </div>
    </div>`;
  });

  // 每个客户一行
  const sortedBids = [...data.bids].sort((a, b) => {
    const order = { 'P0': 0, 'P1': 1, 'P2': 2 };
    if (order[a.priority] !== order[b.priority]) return order[a.priority] - order[b.priority];
    return (a.due_at || '').localeCompare(b.due_at || '');
  });

  sortedBids.forEach(b => {
    if (!b.flow) return;
    const flowDates = calcFlowDates(b.due_at) || [];
    const doneCount = b.flow.nodes.filter(n => n.status === 'done').length;
    const progCount = b.flow.nodes.filter(n => n.status === 'progress').length;
    const blockedCount = b.flow.nodes.filter(n => n.status === 'blocked').length;
    const total = b.flow.nodes.length;
    const progress = Math.round((doneCount / total) * 100);
    const hasBlock = blockedCount > 0;
    const priClass = b.priority.toLowerCase();

    html += `<div class="client-cell" onclick="scrollToCard('${b.code}')" style="cursor: pointer;" title="点击定位看板卡片">
      <div class="c-name">${b.client}</div>
      <div class="c-meta">
        <span class="badge-pri pri-${priClass}">${b.priority}</span>
        <span>${b.code}</span>
      </div>
      <div class="c-progress" title="${doneCount}/${total} 完成 · ${progCount} 进行 · ${blockedCount} 阻塞">
        <div class="fill ${hasBlock ? 'has-block' : ''}" style="width: ${progress}%"></div>
      </div>
    </div>`;

    b.flow.nodes.forEach((n, idx) => {
      const t = flowDates[idx];
      const planDate = t ? t.plan_end : '—';
      const actualDate = n.actual_end || '';
      const isCritical = n.status === 'blocked' && blockedCount === 1;
      const isUrgent = t && n.status !== 'done' && (() => {
        const daysToPlan = Math.ceil((new Date(planDate) - new Date('2026-08-10')) / (1000*60*60*24));
        return daysToPlan >= 0 && daysToPlan <= 3;
      })();

      let dateLabel = planDate;
      if (n.status === 'done' && actualDate) dateLabel = `✓ ${actualDate.slice(5)}`;
      else if (n.status === 'blocked') dateLabel = `⚠ ${planDate}`;

      let extra = '';
      if (n.status === 'blocked' && n.block_reason) {
        extra = `<div class="n-date" style="color: var(--danger); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${n.block_reason}">${n.block_reason}</div>`;
      }

      html += `<div class="node ${n.status} ${isUrgent ? 'urgent' : ''}" data-code="${b.code}" data-node="${n.id}" onclick="showNodeDetail(event, '${b.code}', '${n.id}')" title="${n.status === 'blocked' && n.block_reason ? n.block_reason : ''}">
        <div class="n-name">${FLOW_TEMPLATE[idx].name}</div>
        <div class="n-date">${dateLabel}</div>
        ${extra}
      </div>`;
    });
  });

  wrap.innerHTML = html;
}

let popupCode = null, popupNode = null;
function showNodeDetail(event, code, nodeId) {
  event.stopPropagation();
  const b = data.bids.find(x => x.code === code);
  if (!b || !b.flow) return;
  const n = b.flow.nodes.find(x => x.id === nodeId);
  const t = FLOW_TEMPLATE.find(x => x.id === nodeId);
  const idx = b.flow.nodes.findIndex(x => x.id === nodeId);
  const flowDates = calcFlowDates(b.due_at) || [];
  const planDate = flowDates[idx] ? flowDates[idx].plan_end : '—';

  // 移除旧 popup
  closeNodeDetail();
  popupCode = code; popupNode = nodeId;

  const popup = document.createElement('div');
  popup.className = 'node-detail-popup show';
  popup.id = 'node-popup';
  const statusLabel = { done: '✓ 已完成', progress: '▶ 进行中', blocked: '⚠ 阻塞', planned: '📅 计划', pending: '○ 未开始' }[n.status];
  const statusColor = { done: '#10B981', progress: '#0EA5E9', blocked: '#EF4444', planned: '#F59E0B', pending: '#94A3B8' }[n.status];

  popup.innerHTML = `
    <h5><span style="color: ${statusColor};">●</span>${t.name} · ${b.client}</h5>
    <div class="row"><span class="k">状态</span><span class="v" style="color: ${statusColor};">${statusLabel}</span></div>
    <div class="row"><span class="k">负责人</span><span class="v">${t.owner}</span></div>
    <div class="row"><span class="k">计划截止</span><span class="v" style="font-family: 'SF Mono', monospace;">${planDate}</span></div>
    ${n.actual_end ? `<div class="row"><span class="k">实际完成</span><span class="v" style="font-family: 'SF Mono', monospace;">${n.actual_end}</span></div>` : ''}
    ${n.block_reason ? `<div class="row"><span class="k">阻塞</span><span class="v" style="color: #FCA5A5;">${n.block_reason}</span></div>` : ''}
    ${t.ai.length > 0 ? `<div class="row"><span class="k">AI 介入</span><span class="v" style="font-family: 'SF Mono', monospace; font-size: 10.5px;">${t.ai.join(', ')}</span></div>` : ''}
    <div class="actions">
      ${n.status === 'pending' ? `<button class="primary" onclick="setNodeStatus('${code}','${nodeId}','progress')">开始</button>` : ''}
      ${n.status === 'progress' || n.status === 'planned' ? `<button class="primary" onclick="setNodeStatus('${code}','${nodeId}','done')">完成</button>` : ''}
      ${n.status !== 'blocked' && n.status !== 'done' ? `<button class="danger" onclick="setNodeStatus('${code}','${nodeId}','blocked')">阻塞</button>` : ''}
      ${n.status === 'blocked' ? `<button class="primary" onclick="setNodeStatus('${code}','${nodeId}','progress')">解除阻塞</button>` : ''}
      <button onclick="closeNodeDetail()">关闭</button>
    </div>
  `;
  document.body.appendChild(popup);
  // 定位
  const rect = event.currentTarget.getBoundingClientRect();
  popup.style.left = (rect.left + rect.width / 2 - 140) + 'px';
  popup.style.top = (rect.bottom + 6) + 'px';
  // 防止超出右边界
  setTimeout(() => {
    const pRect = popup.getBoundingClientRect();
    if (pRect.right > window.innerWidth - 8) popup.style.left = (window.innerWidth - pRect.width - 8) + 'px';
    if (pRect.bottom > window.innerHeight - 8) popup.style.top = (rect.top - pRect.height - 6) + 'px';
  }, 0);
}
function closeNodeDetail() {
  const p = document.getElementById('node-popup');
  if (p) p.remove();
  popupCode = null; popupNode = null;
}
window.setNodeStatus = (code, nodeId, status) => {
  const b = data.bids.find(x => x.code === code);
  if (!b || !b.flow) return;
  const n = b.flow.nodes.find(x => x.id === nodeId);
  if (!n) return;
  n.status = status;
  if (status === 'done') {
    n.actual_end = new Date().toISOString().slice(0, 10);
    delete n.block_reason;
  }
  if (status === 'blocked' && !n.block_reason) {
    n.block_reason = prompt('阻塞原因?') || '未说明';
    if (!n.block_reason) { n.status = 'progress'; return; }
  }
  if (status === 'progress') delete n.block_reason;
  // 更新看板 stage 字段(同步)
  const stageMap = { 'sales-bid': '跟踪', 'buy-rfp': '审查', 'quote': '报价',
    'tech-solution': '修订', 'draft': '修订', 'final': '修订', 'seal': '封标', 'present': '述标' };
  if (stageMap[nodeId]) b.stage = stageMap[nodeId];
  saveData(); renderAll();
  addSysEvent(`${b.client} · ${FLOW_TEMPLATE.find(x => x.id === nodeId).name} → ${status}`, status === 'blocked' ? 'err' : 'info');
  closeNodeDetail();
};

// 点击外部关闭 popup
document.addEventListener('click', (e) => {
  if (popupCode && !e.target.closest('.node-detail-popup') && !e.target.closest('.node')) {
    closeNodeDetail();
  }
});

function renderPlaybook() {
  const list = document.getElementById('playbook-list');
  list.innerHTML = PLAYBOOKS.map((pb, i) => {
    const targets = pb.target.map(t => {
      const isCode = data.bids.find(b => b.code === t);
      return isCode
        ? `<span class="target-tag linked" onclick="scrollToCard('${t}')">${t}</span>`
        : `<span class="target-tag">${t}</span>`;
    }).join('');
    return `
      <div class="playbook" data-pb="${pb.id}">
        <div class="pb-head">
          <div class="pb-num">${i + 1}</div>
          <div class="pb-name">${pb.name}</div>
        </div>
        <div class="pb-desc">${pb.desc}</div>
        <div class="pb-target">🎯 ${targets}</div>
        <div class="steps">
          ${pb.steps.map((s, idx) => `
            <div class="pb-step" data-step="${idx}">
              <span class="step-n">${idx + 1}.</span>
              <span class="step-t">${s.name}</span>
              <button class="step-go" onclick="runStep('${pb.id}', ${idx})">跑这步</button>
            </div>
          `).join('')}
        </div>
        <button class="pb-run-all" onclick="runAll('${pb.id}')">▶ 跑这个剧本(全部 ${pb.steps.length} 步)</button>
      </div>
    `;
  }).join('');
}

window.runStep = (pbId, stepIdx) => {
  const pb = PLAYBOOKS.find(p => p.id === pbId);
  if (!pb) return;
  const step = pb.steps[stepIdx];
  step.api();
  // 标记完成
  const stepEl = document.querySelector(`.playbook[data-pb="${pbId}"] [data-step="${stepIdx}"] .step-go`);
  if (stepEl) {
    stepEl.classList.add('done');
    stepEl.textContent = '✓';
    setTimeout(() => { stepEl.classList.remove('done'); stepEl.textContent = '跑这步'; }, 2500);
  }
  addSysEvent(`剧本 ${pb.name} - 第 ${stepIdx + 1} 步: ${step.name}`, 'info');
};

window.runAll = async (pbId) => {
  const pb = PLAYBOOKS.find(p => p.id === pbId);
  if (!pb) return;
  const pbEl = document.querySelector(`.playbook[data-pb="${pbId}"]`);
  if (pbEl) pbEl.classList.add('running');
  const btn = pbEl.querySelector('.pb-run-all');
  if (btn) { btn.disabled = true; btn.textContent = '运行中...'; }
  addSysEvent(`▶ 剧本开始: ${pb.name}`, 'info');
  for (let i = 0; i < pb.steps.length; i++) {
    await new Promise(r => setTimeout(r, 800));
    window.runStep(pbId, i);
  }
  if (btn) { btn.disabled = false; btn.textContent = `▶ 跑这个剧本(全部 ${pb.steps.length} 步)`; }
  if (pbEl) pbEl.classList.remove('running');
  addSysEvent(`✓ 剧本完成: ${pb.name}`, 'info');
};

// ============================================================
// 控制
// ============================================================
document.querySelectorAll('.filter-btn[data-f]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-f]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.f;
    renderCards();
  });
});

document.getElementById('open-second').addEventListener('click', () => {
  window.open(window.location.href, '_blank');
  addSysEvent('新 tab 已打开,试试点任一按钮,另一端会同步', 'info');
});

document.getElementById('ev-clear').addEventListener('click', () => {
  events = []; saveEvents(); renderEvents();
});
document.getElementById('ev-pause').addEventListener('click', (e) => {
  paused = !paused;
  e.target.textContent = paused ? '▶ 继续' : '⏸ 暂停';
  e.target.style.color = paused ? 'var(--warn)' : '';
});
document.getElementById('ev-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ data, events }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `bid-board-events-${Date.now()}.json`;
  a.click();
  addSysEvent('事件流已导出', 'info');
});

// 视图切换(看板 / 流程)
document.querySelectorAll('.nav-link[data-view]').forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    const view = link.dataset.view;
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    link.classList.add('active');
    document.querySelectorAll('.view-panel').forEach(p => {
      p.style.display = p.dataset.view === view ? '' : 'none';
    });
    if (view === 'flow') renderSwimlane();
  });
});

// 启动
renderAll();
renderEvents();
addSysEvent('看板 v2 已就绪,window.BidBoard API 可用');
</script>
