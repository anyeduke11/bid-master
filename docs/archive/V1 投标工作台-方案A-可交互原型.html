<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投标工作台 bid-master · 方案A「作战室」- 可交互原型</title>
<style>
/* ============================================================
   方案A「作战室」· 深色指挥控制台
   token 与 dir-A brief 完全一致，画布 Row 2 同源
   ============================================================ */
:root {
  --bg: #0B1120;
  --bg-soft: #0E1526;
  --surface: #111827;
  --surface-hover: #1A2535;
  --surface-active: #1E3A5F;
  --line: #1E3A5F;
  --line-soft: #162035;
  --ink: #E8F0FE;
  --ink-2: #8BA3C7;
  --ink-3: #4A6080;
  --data: #FFB800;
  --link: #00D4FF;
  --ok: #26DE81;
  --warn: #FF9F43;
  --danger: #FF4757;
  --font-ui: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-data: "SF Mono", "Menlo", "Consolas", "Courier New", monospace;
  --shadow-modal: 0 24px 80px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.45);
  --tr-fast: 110ms ease-out;
  --tr-base: 160ms ease-out;
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;
  color-scheme: dark;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea { font: inherit; }
a { color: var(--link); text-decoration: none; }
ul, ol { list-style: none; }
h1, h2, h3, h4 { font-weight: 600; line-height: 1.3; }
::selection { background: rgba(255,184,0,.28); }

/* 滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #1B2C48; border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #29456E; }

/* 数字与代码 */
.mono { font-family: var(--font-data); }
.tnum, .mono { font-variant-numeric: tabular-nums; }
.k-label {
  font-family: var(--font-data);
  font-size: 10px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-3);
}
.muted { color: var(--ink-2); }
.muted3 { color: var(--ink-3); }
.flex { display: flex; align-items: center; }
.flex1 { flex: 1; min-width: 0; }
.g6 { gap: 6px; } .g8 { gap: 8px; } .g12 { gap: 12px; } .g16 { gap: 16px; }
.mt6 { margin-top: 6px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.right { margin-left: auto; }
.ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ico { width: 14px; height: 14px; flex: none; }
.ico16 { width: 16px; height: 16px; flex: none; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}
:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }

/* ============ 壳层 ============ */
.shell {
  display: grid;
  grid-template-columns: 196px 1fr;
  grid-template-rows: 46px 1fr;
  height: 100%;
}
.topbar {
  grid-column: 1 / -1;
  display: flex; align-items: center;
  gap: 18px;
  padding: 0 16px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
}
.tb-brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.tb-mark { width: 22px; height: 22px; color: var(--data); }
.tb-name { font-size: 13.5px; font-weight: 700; letter-spacing: .01em; }
.tb-sub { font-family: var(--font-data); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; margin-top: 1px; }
.watch {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 10px;
  border: 1px solid var(--line-soft);
  border-radius: var(--r-sm);
  background: var(--bg);
}
.watch-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: breathe 2.6s ease-in-out infinite; }
.watch-txt { font-family: var(--font-data); font-size: 11px; color: var(--ink-2); letter-spacing: .02em; white-space: nowrap; }
.watch-tag {
  font-family: var(--font-data); font-size: 9.5px; font-weight: 700;
  letter-spacing: .1em; color: var(--ok);
  border: 1px solid rgba(38,222,129,.35);
  background: rgba(38,222,129,.1);
  padding: 1px 5px; border-radius: 2px;
}
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.clock { font-family: var(--font-data); font-size: 13px; color: var(--ink); letter-spacing: .04em; }
.clock-date { font-size: 10.5px; color: var(--ink-3); }
.userchip { display: flex; align-items: center; gap: 7px; padding-left: 14px; border-left: 1px solid var(--line-soft); }
.user-av {
  width: 22px; height: 22px; border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: linear-gradient(135deg, #22304A, #16233A);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-data); font-size: 10px; font-weight: 700; color: var(--data);
}
.user-name { font-size: 12px; color: var(--ink-2); }

/* 左侧导航 */
.sidenav {
  display: flex; flex-direction: column;
  background: var(--bg-soft);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding-top: 8px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  height: 38px; padding: 0 14px;
  color: var(--ink-2);
  border-left: 2px solid transparent;
  font-size: 13px;
  transition: background var(--tr-fast), color var(--tr-fast), border-color var(--tr-fast);
  text-align: left;
}
.nav-item .nav-code {
  font-family: var(--font-data); font-size: 10px; color: var(--ink-3);
  letter-spacing: .06em; width: 18px;
}
.nav-item:hover { background: var(--surface-hover); color: var(--ink); }
.nav-item.active {
  background: rgba(255,184,0,.07);
  border-left-color: var(--data);
  color: var(--ink);
}
.nav-item.active .nav-code { color: var(--data); }
.nav-item .nav-live {
  margin-left: auto; font-family: var(--font-data); font-size: 10px;
  color: var(--warn);
}
.nav-foot {
  margin-top: auto;
  padding: 12px 14px;
  border-top: 1px solid var(--line-soft);
  font-size: 10.5px; line-height: 1.7; color: var(--ink-3);
}
.nav-foot .nf-line { display: flex; align-items: center; gap: 6px; }
.nav-foot .led { width: 6px; height: 6px; }

/* 主内容 */
.main { position: relative; overflow: hidden; background: var(--bg); }
.view { display: none; height: 100%; flex-direction: column; }
.view.active { display: flex; }
.vhead {
  display: flex; align-items: baseline; gap: 14px;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--line-soft);
  flex: none;
}
.vhead-t { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.vhead-code { font-family: var(--font-data); font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--data); text-transform: uppercase; }
.vhead-sub { font-family: var(--font-data); font-size: 11px; color: var(--ink-3); letter-spacing: .02em; }
.vhead-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.vbody { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

/* ============ 按钮 ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--ink);
  font-size: 12.5px; font-weight: 500; letter-spacing: .02em;
  transition: background var(--tr-fast), border-color var(--tr-fast), color var(--tr-fast), transform var(--tr-fast);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-hover); border-color: #2A4A78; }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .42; cursor: not-allowed; pointer-events: none; }
.btn-primary { background: var(--data); border-color: var(--data); color: #0B1120; font-weight: 600; }
.btn-primary:hover { background: #FFC933; border-color: #FFC933; }
.btn-ghost { border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { border-color: var(--line); color: var(--ink); }
.btn-danger { color: var(--danger); border-color: rgba(255,71,87,.45); }
.btn-danger:hover { background: rgba(255,71,87,.1); border-color: var(--danger); }
.btn-ok { color: var(--ok); border-color: rgba(38,222,129,.4); }
.btn-ok:hover { background: rgba(38,222,129,.08); }
.btn-sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn-lg { height: 34px; padding: 0 16px; font-size: 13px; }
.btn .spinner { display: none; }
.btn.loading .spinner { display: inline-block; }
.btn.loading { pointer-events: none; opacity: .8; }

.spinner {
  width: 11px; height: 11px;
  border: 1.5px solid var(--line);
  border-top-color: var(--data);
  border-radius: 2px;
  animation: rot .7s linear infinite;
  flex: none;
}
.spinner.dark { border-color: rgba(11,17,32,.35); border-top-color: #0B1120; }
@keyframes rot { to { transform: rotate(360deg); } }

/* ============ 分段控件 / 筛选 ============ */
.seg-ctl {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  overflow: hidden;
  background: var(--bg-soft);
}
.seg-ctl button {
  height: 28px; padding: 0 11px;
  font-size: 12px; color: var(--ink-2);
  border-right: 1px solid var(--line);
  transition: background var(--tr-fast), color var(--tr-fast);
}
.seg-ctl button:last-child { border-right: none; }
.seg-ctl button:hover { background: var(--surface-hover); color: var(--ink); }
.seg-ctl button.on { background: rgba(255,184,0,.12); color: var(--data); font-weight: 600; }
.sel, .inp, .txa {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  color: var(--ink);
  font-size: 12.5px;
  padding: 6px 10px;
  outline: none;
  transition: border-color var(--tr-fast);
  height: 28px;
}
.txa { height: auto; min-height: 64px; resize: vertical; line-height: 1.6; }
.sel:hover, .inp:hover, .txa:hover { border-color: #2A4A78; }
.sel:focus-visible, .inp:focus-visible, .txa:focus-visible { border-color: var(--data); }
.inp.err, .sel.err, .txa.err { border-color: var(--danger); }

/* ============ 面板 ============ */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.panel + .panel { margin-top: 12px; }
.ph {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 13px;
  border-bottom: 1px solid var(--line-soft);
}
.ph-t { font-size: 12.5px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.ph-code {
  font-family: var(--font-data); font-size: 9.5px; font-weight: 600;
  letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase;
}
.ph-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pb { padding: 12px 13px; }
.pb-compact { padding: 8px 13px; }
.pb-flush { padding: 0; }

/* LED */
.led {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ink-3); flex: none; display: inline-block;
}
.led.ok { background: var(--ok); }
.led.warn { background: var(--warn); }
.led.danger { background: var(--danger); }
.led.info { background: var(--link); }
.led.data { background: var(--data); }
.led.live { animation: breathe 2.4s ease-in-out infinite; }
.led.lg { width: 9px; height: 9px; }
@keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

/* chip */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 7px;
  border-radius: 3px;
  font-size: 11px; font-weight: 600; letter-spacing: .03em;
  border: 1px solid transparent;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.chip.ok { color: var(--ok); background: rgba(38,222,129,.12); border-color: rgba(38,222,129,.3); }
.chip.warn { color: var(--warn); background: rgba(255,159,67,.12); border-color: rgba(255,159,67,.32); }
.chip.danger { color: var(--danger); background: rgba(255,71,87,.12); border-color: rgba(255,71,87,.34); }
.chip.info { color: var(--link); background: rgba(0,212,255,.1); border-color: rgba(0,212,255,.28); }
.chip.amber { color: var(--data); background: rgba(255,184,0,.12); border-color: rgba(255,184,0,.32); }
.chip.muted { color: var(--ink-2); background: rgba(139,163,199,.08); border-color: rgba(139,163,199,.22); }
.chip.plain { color: var(--ink-3); border-color: var(--line); background: transparent; }
.chip .led { width: 6px; height: 6px; }

/* 表单字段（模态内） */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
.field .err-msg { font-size: 11.5px; color: var(--danger); display: none; }
.field.has-err .err-msg { display: block; }
.field.has-err .inp, .field.has-err .sel, .field.has-err .txa { border-color: var(--danger); }

/* 工单模板选择 */
.tpl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tpl-btn {
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 9px 10px;
  font-size: 12.5px;
  color: var(--ink-2);
  text-align: left;
  background: var(--bg-soft);
  transition: border-color var(--tr-fast), color var(--tr-fast), background var(--tr-fast);
}
.tpl-btn:hover { border-color: #2A4A78; color: var(--ink); }
.tpl-btn.on { border-color: var(--data); color: var(--data); background: rgba(255,184,0,.08); font-weight: 600; }

/* ============ V1 管线漏斗 ============ */
.pipe-tool {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 20px;
  border-bottom: 1px solid var(--line-soft);
  flex: none;
}
.tool-group { display: flex; align-items: center; gap: 8px; }
.tool-label { font-size: 11.5px; color: var(--ink-3); }
.rrail {
  position: relative;
  flex: 1; min-height: 0;
  display: flex;
  overflow-x: auto; overflow-y: hidden;
}
.rcol {
  position: relative;
  flex: 0 0 auto;
  width: clamp(172px, calc((100vw - 250px) / 10), 236px);
  display: flex; flex-direction: column;
  border-right: 1px solid var(--line-soft);
  min-height: 0;
}
.rcol:last-child { border-right: none; }
.rcol-head {
  flex: none;
  padding: 10px 12px 9px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-soft);
}
.rcol-top { display: flex; align-items: center; gap: 8px; }
.rc-stage { font-family: var(--font-data); font-size: 12px; font-weight: 700; color: var(--data); letter-spacing: .04em; }
.rc-name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.rc-dot { margin-left: auto; }
.rcol-stats { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
.rc-count { font-family: var(--font-data); font-size: 11px; color: var(--ink-2); }
.rc-sum { font-family: var(--font-data); font-size: 11px; color: var(--ink-3); }
.rc-sum b, .rc-count b { font-weight: 600; color: var(--ink-2); }
.rcol-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  padding: 10px;
  display: flex; flex-direction: column; gap: 8px;
}
.rcol-empty {
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  padding: 18px 10px;
  text-align: center;
  margin-top: 4px;
}
.rcol-empty .re-t { font-family: var(--font-data); font-size: 10.5px; color: var(--ink-3); letter-spacing: .06em; }
.rcol-empty .re-s { font-size: 11px; color: var(--ink-3); margin-top: 3px; }

/* 任务卡 */
.tcard {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 10px 11px 9px;
  cursor: pointer;
  transition: transform var(--tr-fast), border-color var(--tr-fast), background var(--tr-fast);
}
.tcard:hover { transform: translateY(-2px); border-color: #2E4E7E; background: var(--surface-hover); }
.tcard:active { transform: translateY(-1px); }
.tcard.blocked { border-color: rgba(255,71,87,.55); }
.tcard.blocked:hover { border-color: var(--danger); }
.tcard.archived { opacity: .62; }
.tc-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tc-id { font-family: var(--font-data); font-size: 10.5px; color: var(--ink-2); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-shrink: 1; }
.tc-prio {
  margin-left: auto;
  font-family: var(--font-data); font-size: 10px; font-weight: 700;
  padding: 1px 5px; border-radius: 2px; letter-spacing: .05em;
}
.tc-title {
  font-size: 12.5px; font-weight: 600; margin-top: 6px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.tc-client { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.tc-data { margin-top: 7px; display: flex; flex-direction: column; gap: 3px; }
.tc-line { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-data); font-size: 11px; }
.tc-line .tl-k { color: var(--ink-3); font-family: var(--font-ui); font-size: 11px; }
.tc-line .tl-v { color: var(--ink-2); }
.tc-line .tl-amt { color: var(--data); font-weight: 600; }
.tc-flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.tc-flags .chip { height: 18px; padding: 0 6px; font-size: 10.5px; }

/* 卡点徽标与 popover */
.block-tag { cursor: pointer; }
.block-tag:hover { filter: brightness(1.15); }
.pop-wrap { position: relative; display: inline-flex; }
.gpop {
  position: absolute;
  top: calc(100% + 6px);
  left: -4px;
  width: 246px;
  z-index: 60;
  background: #131E33;
  border: 1px solid #2A4A78;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-modal);
  padding: 10px 12px;
  display: none;
}
.gpop.open, .pop-wrap:hover .gpop { display: block; }
.gpop-t { font-size: 11.5px; font-weight: 600; color: var(--warn); display: flex; align-items: center; gap: 6px; }
.gpop ul { margin-top: 6px; }
.gpop li {
  font-size: 11.5px; color: var(--ink-2); line-height: 1.55;
  padding: 4px 0 4px 11px; position: relative;
}
.gpop li::before {
  content: ""; position: absolute; left: 0; top: 10px;
  width: 4px; height: 4px; background: var(--danger);
}
.gpop .gpop-foot { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line-soft); font-size: 11px; color: var(--ink-3); }

/* 闸口标记（管线列间） */
.gate-mark {
  position: absolute;
  right: -5px; top: 36px;
  width: 9px; height: 9px;
  z-index: 5;
  cursor: pointer;
  background: transparent;
}
.gate-mark::before {
  content: ""; display: block; width: 9px; height: 9px;
  background: var(--bg-soft);
  border: 1px solid var(--ink-3);
  transform: rotate(45deg);
  transition: border-color var(--tr-fast), background var(--tr-fast);
}
.gate-mark.pass::before { background: var(--data); border-color: var(--data); }
.gate-mark.block::before { background: var(--danger); border-color: var(--danger); }
.gate-mark.wait::before { background: var(--bg-soft); border-color: var(--data); }
.gate-mark:hover::before { border-color: var(--ink); }
.gate-mark .gm-badge {
  position: absolute; left: 8px; top: -7px;
  font-family: var(--font-data); font-size: 9px; font-weight: 700;
  color: var(--danger); background: rgba(255,71,87,.12);
  border: 1px solid rgba(255,71,87,.4); border-radius: 2px;
  padding: 0 3px;
}

/* 已归档条 */
.arch-strip {
  flex: none;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 20px 12px;
  border-top: 1px solid var(--line);
  background: var(--bg-soft);
}
.arch-label { display: flex; align-items: center; gap: 8px; flex: none; }
.arch-label .al-t { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.arch-card {
  display: flex; align-items: center; gap: 12px;
  padding: 7px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: border-color var(--tr-fast), background var(--tr-fast);
  max-width: 560px;
}

.dr-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; font-family: var(--font-data); }
.dig-section { margin-top: 15px; }
.dig-section h4 { font-size: 12.5px; color: var(--ink); display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.dig-section h4::before { content: ""; width: 3px; height: 12px; background: var(--data); border-radius: 1px; }
.dig-p { font-size: 12.5px; color: var(--ink-2); line-height: 1.75; }
.dig-p + .dig-p { margin-top: 6px; }
.dig-p .mono { color: var(--ink); font-size: 11.5px; }
.gen-state { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--ink-2); }

/* ============ V7 系统 ============ */
.sys-tool {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 20px;
  border-bottom: 1px solid var(--line-soft);
  flex: none;
}
.stabs { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.stab {
  height: 28px; padding: 0 12px; font-size: 12.5px; color: var(--ink-2);
  border-right: 1px solid var(--line);
  transition: background var(--tr-fast), color var(--tr-fast);
}
.stab:last-child { border-right: none; }
.stab:hover { background: var(--surface-hover); color: var(--ink); }
.stab.on { background: rgba(255,184,0,.12); color: var(--data); font-weight: 600; }
.sys-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 20px 20px; }
.sys-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.sys-grid .panel { margin-top: 0; }
.sys-grid .span2 { grid-column: 1 / -1; }

/* 日志终端 */
.logterm {
  background: #050A14;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  height: 340px;
  overflow-y: auto;
  padding: 10px 12px;
  font-family: var(--font-data);
  font-size: 11.5px;
  line-height: 1.85;
}
.log-row { display: flex; gap: 10px; white-space: nowrap; }
.log-row .lg-time { color: var(--ink-3); flex: none; }
.log-row .lg-lvl { flex: none; width: 42px; font-weight: 700; }
.log-row .lg-lvl.info { color: var(--link); }
.log-row .lg-lvl.warn { color: var(--warn); }
.log-row .lg-lvl.error { color: var(--danger); }
.log-row .lg-mod { flex: none; width: 76px; color: var(--ink-2); }
.log-row .lg-msg { color: #B9CCE4; white-space: normal; }
.log-row.err .lg-msg { color: var(--danger); }
.log-row.wrn .lg-msg { color: #EBC08B; }
.logterm .term-empty { color: var(--ink-3); font-style: normal; }
.trig-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.trig-row .btn { height: 28px; }

/* 工单队列 */
.qrow { border-bottom: 1px solid var(--line-soft); }
.qrow:last-child { border-bottom: none; }
.qrow-head { display: flex; align-items: center; gap: 10px; padding: 10px 13px; cursor: pointer; transition: background var(--tr-fast); }
.qrow-head:hover { background: var(--surface-hover); }
.qrow-id { font-family: var(--font-data); font-size: 11.5px; color: var(--ink); font-weight: 600; }
.qrow-t { font-size: 12.5px; }
.qrow-bid { font-family: var(--font-data); font-size: 11px; color: var(--ink-3); }
.qrow-right { margin-left: auto; display: flex; align-items: center; gap: 9px; }
.qrow-body { display: none; padding: 0 13px 12px; }
.qrow.open .qrow-body { display: block; }
.qflow { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.qflow-step { display: flex; align-items: center; gap: 6px; font-family: var(--font-data); font-size: 10.5px; color: var(--ink-3); }
.qflow-step.on { color: var(--data); font-weight: 700; }
.qflow-step.done { color: var(--ok); }
.qflow-arrow { color: var(--ink-3); font-size: 11px; }
.qtext {
  background: var(--bg-soft); border: 1px solid var(--line-soft); border-radius: var(--r-sm);
  padding: 10px 12px;
  font-family: var(--font-data); font-size: 11px; line-height: 1.8; color: #B9CCE4;
  white-space: pre-wrap; word-break: break-all;
  max-height: 220px; overflow-y: auto;
}
.qfoot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

/* 配置 */
.cfg-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.cfg-row:last-of-type { border-bottom: none; }
.cfg-k { width: 132px; flex: none; font-size: 12.5px; color: var(--ink); }
.cfg-k .cfg-sub { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
.cfg-v { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cfg-hint { font-size: 11px; color: var(--ink-3); }
.switch { position: relative; width: 36px; height: 20px; flex: none; cursor: pointer; display: inline-block; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track { position: absolute; inset: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; transition: background var(--tr-fast), border-color var(--tr-fast); }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; background: var(--ink-3); border-radius: 2px; transition: transform var(--tr-fast), background var(--tr-fast); }
.switch input:checked + .track { background: rgba(255,184,0,.18); border-color: var(--data); }
.switch input:checked + .track + .knob { transform: translateX(16px); background: var(--data); }
.switch input:disabled ~ .track { opacity: .5; }
.switch input:focus-visible + .track { outline: 2px solid var(--data); outline-offset: 2px; }
.cfg-num { width: 92px; }
.cfg-time { width: 74px; text-align: center; }
.cfg-save-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.cfg-dirty { font-family: var(--font-data); font-size: 11px; color: var(--warn); }

/* 提案 */
.prop-card { display: flex; align-items: center; gap: 12px; }
.prop-main { flex: 1; min-width: 0; }
.prop-id { font-family: var(--font-data); font-size: 11px; color: var(--ink-3); }
.prop-t { font-size: 13px; font-weight: 600; margin-top: 2px; }
.prop-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
.diff-box {
  background: var(--bg-soft); border: 1px solid var(--line-soft); border-radius: var(--r-sm);
  padding: 10px 12px; font-family: var(--font-data); font-size: 11.5px; line-height: 1.9;
  color: #B9CCE4; white-space: pre-wrap;
}
.diff-box .diff-add { color: var(--ok); }
.diff-box .diff-del { color: var(--danger); }

/* ============ 模态 ============ */
.overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(5,10,20,.7);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity var(--tr-base);
}
.overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  width: 560px; max-width: 100%;
  max-height: calc(100vh - 60px);
  background: #121C30;
  border: 1px solid #2A4A78;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-modal);
  display: flex; flex-direction: column;
  transform: translateY(8px) scale(.99);
  transition: transform var(--tr-base);
  outline: none;
}
.overlay.open .modal { transform: none; }
.modal.sm { width: 440px; }
.modal.lg { width: 720px; }
.modal.wide { width: 860px; }
.modal-h {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  flex: none;
}
.modal-h .mh-code { font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--data); }
.modal-h .mh-t { font-size: 14.5px; font-weight: 700; }
.modal-h .mh-x { margin-left: auto; }
.modal-b { padding: 16px; overflow-y: auto; flex: 1; min-height: 0; }
.modal-f {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px;
  border-top: 1px solid var(--line);
  flex: none;
}
.modal-f .mf-note { font-size: 11.5px; color: var(--ink-3); margin-right: auto; }

/* ============ Toast ============ */
.toast-root {
  position: fixed; right: 18px; bottom: 18px; z-index: 400;
  display: flex; flex-direction: column; gap: 8px;
  width: 340px; max-width: calc(100vw - 36px);
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex; align-items: flex-start; gap: 9px;
  background: #14203A;
  border: 1px solid #2A4A78;
  border-left: 3px solid var(--data);
  border-radius: var(--r-md);
  padding: 10px 12px;
  box-shadow: var(--shadow-modal);
  animation: toast-in .18s ease-out;
}
.toast.ok { border-left-color: var(--ok); }
.toast.warn { border-left-color: var(--warn); }
.toast.danger { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--link); }
.toast .t-main { flex: 1; min-width: 0; }
.toast .t-t { font-size: 12.5px; font-weight: 600; }
.toast .t-s { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; line-height: 1.6; }
.toast .t-x { color: var(--ink-3); margin-top: 1px; }
.toast .t-x:hover { color: var(--ink); }
@keyframes toast-in { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ============ 骨架屏 ============ */
.skel {
  position: fixed; inset: 0; z-index: 500;
  background: var(--bg);
  display: flex; flex-direction: column;
  transition: opacity .25s ease-out;
}
.skel.off { opacity: 0; pointer-events: none; }
.sk-top { height: 46px; background: var(--bg-soft); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 16px; }
.sk-main { flex: 1; display: grid; grid-template-columns: 196px 1fr; }
.sk-nav { background: var(--bg-soft); border-right: 1px solid var(--line); padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.sk-canvas { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.sk-block { background: #16223A; border-radius: var(--r-sm); animation: skpulse 1.3s ease-in-out infinite; }
@keyframes skpulse { 0%,100% { opacity: .55; } 50% { opacity: .95; } }
.sk-row { display: flex; gap: 12px; }
.sk-line { height: 13px; }
.sk-card { height: 120px; flex: 1; }

/* ============ 空态 ============ */
.empty {
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  padding: 42px 20px;
  text-align: center;
}
.empty .e-ico { color: var(--ink-3); margin-bottom: 10px; }
.empty .e-t { font-family: var(--font-data); font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .04em; }
.empty .e-s { font-size: 12px; color: var(--ink-3); margin-top: 6px; line-height: 1.7; }
.empty .e-a { margin-top: 14px; }
.empty.celebrate { border-color: rgba(38,222,129,.4); }
.empty.celebrate .e-ico { color: var(--ok); }
.empty.celebrate .e-t { color: var(--ok); }

/* 工具杂项 */
.sep-v { width: 1px; height: 18px; background: var(--line); flex: none; }
.hint-line { font-size: 11.5px; color: var(--ink-3); }
.warn-text { color: var(--warn); }
.danger-text { color: var(--danger); }
.ok-text { color: var(--ok); }
.link-text { color: var(--link); }
.fill { flex: 1; min-width: 0; }
.scroll-y { overflow-y: auto; }

/* ============ 响应式 ============ */
@media (max-width: 1180px) {
  .deep-grid { grid-template-columns: minmax(200px, 240px) minmax(250px, 1fr) minmax(230px, 270px); gap: 10px; padding: 10px 14px 14px; }
  .ph-right .hint-line { display: none; }
  .leads-wrap, .dig-wrap { grid-template-columns: minmax(0,1fr) 240px; padding: 10px 14px 14px; }
  .tele-strip { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 1023px) {
  body { overflow: auto; }
  .shell { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; min-height: 100%; }
  .topbar { flex-wrap: wrap; height: auto; min-height: 46px; padding: 8px 12px; row-gap: 6px; }
  .watch { order: 3; }
  .sidenav {
    grid-row: 2;
    flex-direction: row; overflow-x: auto; overflow-y: hidden;
    border-right: none; border-bottom: 1px solid var(--line);
    padding: 0 6px;
  }
  .nav-item { border-left: none; border-bottom: 2px solid transparent; height: 42px; flex: none; }
  .nav-item.active { border-left-color: transparent; border-bottom-color: var(--data); }
  .nav-foot { display: none; }
  .main { overflow: visible; }
  .view { height: auto; }
  .vbody { overflow: visible; }
  .deep-grid { display: flex; flex-direction: column; overflow: visible; }
  .deep-col { overflow: visible; }
  .deep-wrap { overflow: visible; }
  .rrail { min-height: 460px; }
  .leads-wrap, .dig-wrap { display: flex; flex-direction: column; overflow: visible; }
  .leads-main, .leads-side, .dig-main, .dig-side { overflow: visible; }
  .sys-grid { grid-template-columns: 1fr; }
  .today-body, .assets-body, .sys-body { overflow: visible; }
  .logterm { height: 260px; }
}
@media (max-width: 767px) {
  .watch-txt { display: none; }
  .clock-date { display: none; }
  .userchip { display: none; }
  .vhead-sub { display: none; }
  .vhead { flex-wrap: wrap; gap: 8px; }
  .vhead-right { margin-left: 0; width: 100%; }
  .pipe-tool { padding: 8px 12px; }
  .rcol { width: 190px; }
  .arch-strip { flex-direction: column; align-items: flex-start; }
  .tbl-wrap { overflow-x: auto; }
  .tbl { min-width: 640px; }
  .modal { width: calc(100vw - 28px) !important; }
  .toast-root { right: 10px; left: 10px; width: auto; }
  .deep-grid { padding: 10px 12px; }
  .sys-tool, .assets-tool { padding: 8px 12px; }
  .today-body, .sys-body { padding: 10px 12px 16px; }
  .deep-head { padding: 10px 12px; }
  .drawer { width: 92vw; }
  .tele-strip { grid-template-columns: repeat(2, 1fr); }
}

/* ============ 动效降级 ============ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (id, cls) => '<svg class="ico ' + (cls || '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
const pad2 = (n) => String(n).padStart(2, '0');
const hhmm = (d) => pad2(d.getHours()) + ':' + pad2(d.getMinutes());
const hhmmss = (d) => pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
const fmtAmt = (n) => '¥' + n + '万';
const parseWhen = (s) => {
  if (!s) return null;
  const m = String(s).match(/^(\d{4}-\d{2}-\d{2})(?:\s+(\d{2}:\d{2}))?$/);
  if (!m) return null;
  return new Date(m[2] ? m[1] + 'T' + m[2] + ':00+08:00' : m[1] + 'T00:00:00+08:00');
};
const daysTo = (s) => { const t = parseWhen(s); return t ? Math.round((t - demoNow()) / 86400000) : null; };
const bidById = (id) => BIDS.find((b) => b.id === id);
const dayCls = (d) => (d == null ? '' : d <= 7 ? 'danger' : d <= 14 ? 'warn' : '');
const nextEvent = (b) => {
  let best = null;
  b.events.forEach((e) => {
    if (e.done || !e.date) return;
    const dd = daysTo(e.date);
    if (dd == null || dd < 0) return;
    if (!best || dd < best.dd) best = { name: e.name, date: e.date, dd };
  });
  return best;
};

    defBody += b.defectRounds.map((r) =>
      '<div class="def-round"><div class="def-round-head"><span class="def-round-t">' + esc(r.n) + '</span>' +
      r.chips.map((c) => '<span class="chip ' + (c[2] === 'danger' ? 'danger' : c[2] === 'warn' ? 'warn' : 'muted') + '">' + c[0] + ' ' + c[1] + '</span>').join('') +
      (r.d ? '<span class="hint-line right">' + esc(r.d) + '</span>' : '') + '</div></div>').join('');
  }
  if (b.defectItems.length) {
    defBody += b.defectItems.map((it) =>
      '<div class="def-item ' + it.lv + '"><div class="di-main"><div class="di-t">' + esc(it.t) + '</div>' +
      '<div class="di-loc">定位：' + esc(it.loc) + ' · 状态：' + esc(it.st) + '</div></div>' +
      '<div class="di-actions"><span class="chip ' + (it.lv === 'lv-block' ? 'danger' : 'warn') + '">' + esc(it.lvName) + '</span></div></div>').join('');
  }
  if (!b.defectRounds.length && !b.defectItems.length) defBody = '<div class="hint-line" style="padding:6px 0">' + esc(b.defectNote) + '</div>';
  else defBody += '<div class="hint-line mt6">' + esc(b.defectNote) + '</div>';
  const defectPanel = '<div class="panel"><div class="ph"><span class="ph-t">缺陷面板</span><span class="ph-code">AUDITOR</span>' +
    '<span class="ph-right">' + (b.defectRounds.length || b.defectItems.length ?
      '<button class="btn btn-sm" data-a="ticket" data-tpl="审计 round-N">生成修复工单</button>' : '') + '</span></div>' +
    '<div class="pb">' + defBody + '</div></div>';

  let artRows = '';
  if (b.artifacts.length) {
    artRows = b.artifacts.map((a) =>
      '<tr><td><span class="fname">' + esc(a.f) + '</span>' + (a.note ? '<div class="cell-sub danger-text">' + esc(a.note) + '</div>' : '') + '</td>' +
      '<td class="prod">' + esc(a.p) + '</td><td><span class="chip ' + (a.st === 'confirmed' ? 'ok' : 'info') + '">' + esc(a.st) + '</span></td>' +
      '<td class="tid">' + esc(a.tid) + '</td></tr>').join('');
  } else {
    artRows = '<tr><td colspan="4" class="hint-line" style="padding:10px 8px">未登记产物（编制阶段产出后由 watcher 登记）</td></tr>';
  }
  const artPanel = '<div class="panel"><div class="ph"><span class="ph-t">产出与登记</span><span class="ph-code">ARTIFACTS</span>' +
    '<span class="ph-right"><span class="hint-line">manifest 含 producer / model / duration / ticket_id</span></span></div>' +
    '<div class="pb pb-flush"><table class="art-tbl"><thead><tr><th>产物</th><th>生产者</th><th>状态</th><th>工单</th></tr></thead><tbody>' + artRows + '</tbody></table></div></div>';

  let sliceBody = '';
  if (b.slices.length) {
    sliceBody = b.slices.map((s) =>
      '<div class="slice-item"><span class="ico" style="color:var(--link)">' + icon('i-doc') + '</span>' +
      '<span class="si-t">' + esc(s.n) + '</span><span class="si-m right">' + esc(s.m) + '</span></div>').join('');
  } else {
    sliceBody = '<div class="hint-line" style="padding:4px 0">' + esc(b.slicesNote || '未登记素材引用。') + '</div>';
  }
  if (b.sliceGap) {
    sliceBody += '<div class="slice-gap"><div class="sg-t">缺口：' + esc(b.sliceGap.t) + '</div><div class="sg-s">' + esc(b.sliceGap.s) + '</div>' +
      '<div style="margin-top:8px"><button class="btn btn-sm" data-a="gap-open" data-prefill="' + esc(b.sliceGap.t) + '">登记缺口</button></div></div>';
  }
  const slicePanel = '<div class="panel"><div class="ph"><span class="ph-t">素材引用反查</span><span class="ph-code">SLICES</span></div><div class="pb">' + sliceBody + '</div></div>';

  let aiPanel = '';
  if (b.ai) {
    aiPanel = '<div class="panel ai-sum"><div class="ph"><span class="ph-t">AI 摘要</span><span class="ph-code">SUMMARY</span>' +
      '<span class="ph-right"><span class="chip plain">人写审读 · 证据必附</span></span></div>' +
      '<div class="pb"><div class="as-body">' + esc(b.ai.body) + '</div>' +
      '<div class="as-meta"><span>author: ' + esc(b.ai.author) + '</span><span>evidence: ' + esc(b.ai.ev) + '</span></div></div></div>';
  } else {
    aiPanel = '<div class="panel"><div class="ph"><span class="ph-t">AI 摘要</span><span class="ph-code">SUMMARY</span></div>' +
      '<div class="pb"><div class="hint-line">暂无摘要（ai_summaries 为空 · 摘要须 author + evidence）</div></div></div>';
  }
  mid += defectPanel + artPanel + slicePanel + aiPanel;

  /* 右栏：时间线 / 操作台 / 人工待办 */
  let tl = '';
  if (b.events.length) {
    let nextUsed = false;
    tl = b.events.map((e) => {
      const dd = e.date ? daysTo(e.date) : null;
      const done = e.done || (dd != null && dd < 0);
      let cls = '', dcls = 'done', dTxt = done ? '已完成' : '';
      if (!done) {
        cls = !nextUsed ? 'next' : '';
        if (!nextUsed) nextUsed = true;
        if (dd <= 7) { cls = 'urgent'; dcls = 'danger'; }
        else if (dd <= 14) dcls = 'warn';
        dTxt = '剩 ' + dd + ' 天';
      }
      return '<div class="tl2-item ' + cls + (done ? ' done' : '') + '"><span class="tl2-dot"></span>' +
        '<span class="tl2-name">' + esc(e.name) + '</span>' +
        '<span class="tl2-date">' + esc(e.date || '-') + '</span>' +
        '<span class="tl2-days ' + dcls + '">' + dTxt + '</span></div>';
    }).join('');
  } else {
    tl = '<div class="hint-line" style="padding:4px 0">该标未登记关键时间节点。</div>';
  }
  const tlPanel = '<div class="panel"><div class="ph"><span class="ph-t">倒计时时间线</span><span class="ph-code">TIMELINE</span></div><div class="pb"><div class="tl2">' + tl + '</div></div></div>';

  const showSign = b.gate && b.gate.from === 5 && b.gate.to === 6;
  const advDisabled = b.stage >= 9;
  const opsPanel = '<div class="panel ops"><div class="ph"><span class="ph-t">操作台</span><span class="ph-code">OPS</span></div>' +
    '<div class="pb"><div class="op-btns">' +
    '<button class="btn btn-primary btn-lg" data-a="advance"' + (advDisabled ? ' disabled title="已归档，无推进会动作"' : '') + '>' + icon('i-play') + '推进阶段</button>' +
    '<button class="btn btn-lg" data-a="ticket" data-tpl="auto">' + icon('i-copy') + '生成工单</button>' +
    (showSign ? '<button class="btn btn-lg" data-a="advance" title="S5 → S6 含人工签核">' + icon('i-shield') + '签核（L3）</button>' : '') +
    '<button class="btn btn-ghost" data-a="todo-add">' + icon('i-plus') + '加人工待办</button>' +
    '</div><div class="ops-note">推进即调用 set-stage（门禁内嵌），被拦时返回卡点清单；工单为提示词模板，由人复制启动，不直接指挥 AI 会话。</div></div></div>';

  const todoItems = (b.todos || []).map((t) => '<li><span class="led info" style="margin-top:4px"></span><span>' + esc(t.text) + '</span><span class="tl-time">' + esc(t.t || '') + '</span></li>').join('');
  const todoPanel = '<div class="panel"><div class="ph"><span class="ph-t">人工待办</span><span class="ph-code">HUMAN</span></div>' +
    '<div class="pb">' + (todoItems ? '<ul class="todo-list">' + todoItems + '</ul>' : '<div class="hint-line">暂无人工待办 · 用操作台按钮追加</div>') + '</div></div>';

  const bidOpts = BIDS.map((x) => '<option value="' + x.id + '"' + (x.id === b.id ? ' selected' : '') + '>' + esc(x.client) + ' · ' + x.id + '</option>').join('');
  const srcChip = b.source === 'secondary' ? '<span class="chip warn">二手源</span>' : '';
  const blkChip = b.blocked ? '<span class="chip danger">卡点</span>' : '';
  const archChip = b.stage >= 9 ? '<span class="chip ok">已归档</span>' : '';
  const stayTxt = b.stay != null ? b.stay + ' 天' : '-';

  return '<div class="view active">' +
    '<div class="deep-head"><div class="dh-left"><div class="dh-id-row"><span class="dh-id">' + b.id + '</span>' +
    '<span class="tc-prio" style="' + prioStyle(b.pri) + '">' + b.pri + '</span>' + blkChip + srcChip + archChip + '</div>' +
    '<div class="dh-title">' + esc(b.client) + ' · ' + esc(b.proj) + '</div></div>' +
    '<div class="dh-meta"><span class="mrow">金额 <b class="amt">' + (b.amt == null ? '待确认' : fmtAmt(b.amt)) + '</b></span>' +
    '<span class="mrow">阶段 <b>S' + b.stage + ' ' + STAGE_NAMES[b.stage] + '</b></span>' +
    '<span class="mrow">负责人 <b>Duke</b></span>' +
    '<span class="mrow">停留 <b>' + stayTxt + '</b></span>' +
    '<span class="mrow">来源 <b>' + (b.source === 'secondary' ? 'secondary' : 'primary') + '</b></span></div>' +
    '<div class="dh-switch"><label class="sr-only" for="bid-select">切换标的</label>' +
    '<select class="sel" id="bid-select" data-f="bid-sel" style="max-width:230px">' + bidOpts + '</select>' +
    '<button class="btn btn-sm" data-a="nav" data-v="pipeline">返回管线</button></div></div>' +
    '<div class="deep-grid"><div class="deep-col">' + leftCol + '</div>' +
    '<div class="deep-col">' + mid + '</div>' +
    '<div class="deep-col">' + tlPanel + opsPanel + todoPanel + '</div></div></div>';
}

/* ============ V3 今日必办 ============ */
function vToday() {
  const groups = [
    { k: 'danger', name: '阻断 · 立即处理', chip: 'danger' },
    { k: 'warn', name: '临期 · 今日推进', chip: 'warn' },
    { k: 'info', name: '提醒 · 保持关注', chip: 'muted' }
  ];
  const open = ALERTS.filter((a) => a.st === 'open');
  const doneN = ALERTS.length - open.length;
  const cnt = (k) => open.filter((a) => a.sev === k).length;
  const allDone = open.length === 0;

  let body = '';
  if (allDone) {
    body = '<div class="empty celebrate"><div class="e-ico">' + icon('i-shield', 'ico16') + '</div>' +
      '<div class="e-t">今日清明</div>' +
      '<div class="e-s">6 条警情已全部处置 · 数据面稳定 · 保持值守节奏<br>consistency 下一次运行：明早 08:30</div>' +
      '<div class="e-a"><button class="btn" data-a="alerts-reset">撤销全部处置（演示回滚）</button></div></div>';
  } else {
    groups.forEach((g) => {
      const items = ALERTS.filter((a) => a.sev === g.k && a.st === 'open');
      if (!items.length) return;
      body += '<div class="alert-group"><div class="ag-head"><span class="led ' + g.k + '"></span>' +
        '<span class="ag-t">' + g.name + '</span><span class="ag-n">' + items.length + ' 条</span></div>';
      items.forEach((a) => {
        const idx = ALERTS.indexOf(a);
        body += '<div class="alert-row"><span class="led ' + a.sev + ' lg ar-led"></span>' +
          '<div class="ar-main"><div class="ar-title">' + esc(a.title) + '</div>' +
          '<div class="ar-meta"><span>' + esc(a.relName) + '</span><span>' + esc(a.time) + '</span></div></div>' +
          '<div class="ar-act">' +
          (a.goto ? '<button class="btn btn-sm" data-a="alert-goto" data-i="' + idx + '">' + (a.goto.v === 'deep' ? '去处理' : '去查看') + ' ' + icon('i-arrow-r') + '</button>' : '') +
          '<button class="btn btn-sm btn-ok" data-a="alert-do" data-i="' + idx + '">处理</button>' +
          '<button class="btn btn-sm btn-ghost" data-a="alert-ignore" data-i="' + idx + '">忽略</button>' +
          '</div></div>';
      });
      body += '</div>';
    });
    const handled = ALERTS.filter((a) => a.st !== 'open');
    if (handled.length) {
      body += '<div class="alert-group"><div class="ag-head"><span class="led" style="background:var(--ok)"></span>' +
        '<span class="ag-t">已处置 · 留痕</span><span class="ag-n">' + handled.length + ' 条</span></div>';
      handled.forEach((a) => {
        const idx = ALERTS.indexOf(a);
        body += '<div class="alert-row done"><span class="led ok lg ar-led"></span>' +
          '<div class="ar-main"><div class="ar-title">' + esc(a.title) + '</div>' +
          '<div class="ar-meta"><span class="ar-done-tag">' + (a.st === 'handled' ? '已处理' : '已忽略') + '（留痕 ' + esc(a.at || '') + '）</span></div></div>' +
          '<div class="ar-act"><button class="btn btn-sm btn-ghost" data-a="alert-undo" data-i="' + idx + '">撤销</button></div></div>';
      });
      body += '</div>';
    }
  }
  return '<div class="view active"><div class="vhead"><h2 class="vhead-t">今日必办</h2>' +
    '<span class="vhead-code">ALERTS</span><span class="vhead-sub">consistency 08:30 · alerts.json 投影</span>' +
    '<div class="vhead-right"><span class="hint-line">已处置 <b class="mono" style="color:var(--ok)">' + doneN + '</b> / ' + ALERTS.length + '</span></div></div>' +
    '<div class="vbody"><div class="today-tool">' +
    '<div class="t-stat"><span class="ts-v danger">' + cnt('danger') + '</span><span class="ts-k">阻断</span></div>' +
    '<span class="sep-v"></span>' +
    '<div class="t-stat"><span class="ts-v warn">' + cnt('warn') + '</span><span class="ts-k">临期</span></div>' +
    '<span class="sep-v"></span>' +
    '<div class="t-stat"><span class="ts-v info">' + cnt('info') + '</span><span class="ts-k">提醒</span></div>' +
    '<span class="sep-v"></span>' +
    '<div class="t-stat"><span class="ts-v" style="color:var(--ok)">' + doneN + '</span><span class="ts-k">已处置</span></div>' +
    '</div><div class="today-body">' + body + '</div></div></div>';
}

/* ============ V4 资产台账 ============ */
const GAPS = [];
function certStateUntil(u) { const d = daysTo(u); return d != null && d <= 60 ? '临期' : '有效'; }
function assetFilterOpts(d) {
  const map = {
    certs: ['全部', '有效', '临期', '过期'],
    people: ['全部', '在投', '空闲', '跨标冲突'],
    cases: ['全部', '证券通信', '证券', '银行'],
    sols: ['全部']
  };
  return map[d].map((x) => '<option' + (x === ST.assetFilter ? ' selected' : '') + '>' + x + '</option>').join('');
}
function vAssets() {
  const d = ST.assetDomain;
  const tabs = [['certs', '证照', CERTS.length], ['people', '人员', PEOPLE.length], ['cases', '案例', CASES.length], ['sols', '方案', SOLS.length]]
    .map((t) => '<button class="atab' + (d === t[0] ? ' on' : '') + '" data-a="asset-tab" data-d="' + t[0] + '">' + t[1] + '<span class="atab-n">' + t[2] + '</span></button>').join('');
  let head = '', rows = '';
  if (d === 'certs') {
    head = '<th>证照名称</th><th>级别 / 类型</th><th>有效期至</th><th>状态</th><th>在投占用</th>';
    CERTS.forEach((c, i) => {
      const st = certStateUntil(c.until);
      if (ST.assetFilter !== '全部' && ST.assetFilter !== st) return;
      const dd = daysTo(c.until);
      rows += '<tr data-a="asset-row" data-d="certs" data-i="' + i + '">' +
        '<td><span class="led ' + (c.warn ? 'warn' : 'ok') + '" style="margin-right:8px"></span>' + esc(c.name) + '</td>' +
        '<td class="muted">' + esc(c.level) + '</td>' +
        '<td class="num ' + (c.warn ? 'expiry-warn' : 'expiry-ok') + '">' + esc(c.until) + (dd != null ? ' <span style="color:var(--ink-3);font-size:10.5px">剩 ' + dd + ' 天</span>' : '') + '</td>' +
        '<td><span class="chip ' + (st === '临期' ? 'warn' : 'ok') + '">' + st + '</span></td>' +
        '<td>' + (c.occ.length ? '<span class="occ">' + c.occ.map((o) => '<span class="chip muted">' + esc(o) + '</span>').join('') + '</span>' : '<span class="muted3">未占用</span>') + '</td></tr>';
    });
  } else if (d === 'people') {
    head = '<th>化名</th><th>角色</th><th>证书</th><th>在投占用</th><th>状态</th>';
    PEOPLE.forEach((p, i) => {
      if (ST.assetFilter === '跨标冲突' && !p.conflict) return;
      if ((ST.assetFilter === '在投' || ST.assetFilter === '空闲') && p.st !== ST.assetFilter) return;
      rows += '<tr data-a="asset-row" data-d="people" data-i="' + i + '">' +
        '<td><b>' + esc(p.name) + '</b></td><td class="muted">' + esc(p.role) + '</td>' +
        '<td class="mono" style="font-size:11.5px">' + esc(p.certs) + '</td>' +
        '<td>' + (p.occ.length ? '<span class="occ">' + p.occ.map((o) => '<span class="chip muted">' + esc(o) + '</span>').join('') +
          (p.conflict ? '<span class="chip danger">跨标冲突</span>' : '') + '</span>' : '<span class="muted3">未占用</span>') + '</td>' +
        '<td><span class="chip ' + (p.st === '空闲' ? 'ok' : 'info') + '">' + esc(p.st) + '</span></td></tr>';
    });
  } else if (d === 'cases') {
    head = '<th>客户</th><th>行业</th><th>年度</th><th>场景</th><th>切片数</th>';
    CASES.forEach((c, i) => {
      if (ST.assetFilter !== '全部' && c.industry !== ST.assetFilter) return;
      rows += '<tr data-a="asset-row" data-d="cases" data-i="' + i + '">' +
        '<td><b>' + esc(c.client) + '</b></td><td class="muted">' + esc(c.industry) + '</td>' +
        '<td class="num">' + c.year + '</td><td class="muted">' + esc(c.scene) + '</td>' +
        '<td class="num">' + c.slices + '</td></tr>';
    });
  } else {
    head = '<th>方案名称</th><th>适用场景</th><th>切片数</th><th>最近引用</th>';
    SOLS.forEach((s, i) => {
      rows += '<tr data-a="asset-row" data-d="sols" data-i="' + i + '">' +
        '<td><b>' + esc(s.name) + '</b></td><td class="muted">' + esc(s.scene) + '</td>' +
        '<td class="num">' + s.slices + '</td>' +
        '<td class="muted">' + esc(s.ref) + '</td></tr>';
    });
  }
  if (!rows) rows = '<tr><td colspan="5"><div class="no-filter-msg hint-line">无匹配记录 · 调整筛选条件</div></td></tr>';
  const ledger = GAPS.length ? '<div class="ledger-strip"><span class="ls-t">待补缺口 ' + GAPS.length + ' 条</span>' +
    '<span>最近登记：' + esc(GAPS[GAPS.length - 1].name) + '（' + esc(GAPS[GAPS.length - 1].t) + '）</span>' +
    '<span class="right hint-line">已写入 inbox · 收割后转正</span></div>' : '';
  return '<div class="view active"><div class="vhead"><h2 class="vhead-t">资产台账</h2>' +
    '<span class="vhead-code">ASSETS</span><span class="vhead-sub">certs / people / cases / solutions · 索引即契约</span>' +
    '<div class="vhead-right"><button class="btn" data-a="gap-open">' + icon('i-plus') + '缺口登记</button></div></div>' +
    '<div class="vbody"><div class="assets-tool"><div class="atabs">' + tabs + '</div>' +
    '<div class="tool-group"><span class="tool-label">筛选</span><select class="sel" data-f="asset-filter" aria-label="筛选">' + assetFilterOpts(d) + '</select></div>' +
    '<span class="hint-line" style="margin-left:auto">行点击查看详情与文件指针 · 临期按提前期 60 天判定</span></div>' +
    '<div class="assets-body">' + ledger +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</div></div></div>';
}

/* ============ V5 商机 ============ */
function leadCard(l, mode) {
  const sc = l.score >= 80 ? '' : l.score >= 60 ? 'mid' : 'low';
  const recChip = l.rec === '纳入' ? '<span class="chip amber">纳入</span>' : l.rec === '观察' ? '<span class="chip info">观察</span>' : '<span class="chip muted">排除</span>';
  let actions = '';
  if (mode === 'pending') {
    if (l.auto) actions = '<button class="btn btn-sm btn-primary" data-a="lead-confirm" data-i="' + LEADS.indexOf(l) + '">确认升级</button>' +
      '<button class="btn btn-sm btn-ghost" data-a="lead-reject-auto" data-i="' + LEADS.indexOf(l) + '">驳回</button>';
    else actions = '<button class="btn btn-sm" data-a="lead-up" data-i="' + LEADS.indexOf(l) + '">升级为 bid</button>' +
      '<button class="btn btn-sm btn-ghost" data-a="lead-discard" data-i="' + LEADS.indexOf(l) + '">丢弃</button>';
  } else if (mode === 'handled') {
    actions = '<span class="chip ok">' + (l.resolved || '已处理') + '</span>';
  } else {
    actions = '<span class="chip muted">已排除</span>';
  }
  let ev = '';
  if (l.quote && mode === 'pending') {
    ev = '<div class="lc-ev-toggle"><button class="btn btn-sm btn-ghost" data-a="ev-toggle">展开证据</button></div>' +
      '<div class="ev-box"><div class="ev-quote">“' + esc(l.quote) + '”</div>' +
      '<div class="ev-src">来源：' + esc(l.src || '-') + ' · 引文逐字（scout 证据纪律）</div></div>';

/* ============ 模态基础设施 ============ */
let _lastFocus = null, _modalOpen = false;
function openModal(inner, opts) {
  opts = opts || {};
  if (!_modalOpen) _lastFocus = document.activeElement;
  const root = $('#modal-root');
  root.innerHTML = '<div class="overlay open" id="overlay"><div class="modal ' + (opts.size || '') + '" role="dialog" aria-modal="true" tabindex="-1" aria-label="' + esc(opts.label || '对话框') + '">' + inner + '</div></div>';
  _modalOpen = true;
  const overlay = $('#overlay');
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  requestAnimationFrame(() => {
    const m = overlay.querySelector('.modal');
    const af = m.querySelector('[data-autofocus]');
    (af || m).focus();
  });
}
function closeModal() {
  if (!_modalOpen) return;
  const overlay = $('#overlay');
  _modalOpen = false;
  if (overlay) {
    overlay.classList.remove('open');
    setTimeout(() => { const r = $('#modal-root'); if (r && !_modalOpen) r.innerHTML = ''; }, 170);
  }
  if (_lastFocus && _lastFocus.focus) { try { _lastFocus.focus(); } catch (e) { /* noop */ } }
}
function modalShell(code, title, body, foot, size) {
  return '<div class="modal-h"><span class="mh-code">' + esc(code) + '</span><span class="mh-t">' + esc(title) + '</span>' +
    '<button class="btn btn-sm btn-ghost mh-x" data-a="modal-close" aria-label="关闭">' + icon('i-close') + '</button></div>' +
    '<div class="modal-b">' + body + '</div>' +
    (foot ? '<div class="modal-f">' + foot + '</div>' : '');
}
function trapTab(e) {
  const m = $('#overlay .modal');
  if (!m) return;
  const list = Array.from(m.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter((el) => !el.disabled);
  if (!list.length) return;
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* ============ 剪贴板 ============ */
function copyText(text, okMsg) {
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (ok) { toast(okMsg, '', 'ok'); return; }
      throw new Error('fail');
    } catch (e) {
      toast('复制失败 · 请手动选择文本', '已尝试全选预览文本，可按 Ctrl / Command + C', 'warn');
      const pre = $('.qtext');
      if (pre && window.getSelection) {
        const r = document.createRange(); r.selectNodeContents(pre);
        const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      }
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast(okMsg, '', 'ok')).catch(fallback);
  } else fallback();
}

/* ============ 工单拼装 ============ */
function defectCount(b) {
  if (b.defectRounds.length) {
    const r = b.defectRounds[b.defectRounds.length - 1];
    const total = r.chips.reduce((a, c) => a + c[1], 0);
    const parts = r.chips.filter((c) => c[1] > 0).map((c) => c[0] + ' ' + c[1]).join(' / ');
    return total + '（' + parts + '）';
  }
  return '0';
}
function nextRound(b) { return b.defectRounds.length ? b.defectRounds.length + 1 : 1; }
function gateTextFor(b) {
  const f = Math.min(b.stage, 8);
  if (b.gate && b.gate.from === f) return b.gate.items.map((it, i) => '（' + (i + 1) + '）' + it.t).join('；');
  const def = gateDef(f, f + 1);
  return def ? def.replace('检查项：', '') : '按 rules/ 门禁契约执行';
}
function assembleTicket(tpl, bidId, tid) {

      '任务目标：为 ' + b.id + '（' + b.client + ' · ' + b.proj + '）完成阶段 0 分析：资质硬门槛收敛 + 投标可行性结论。\n' +

      '开工必读：skills/bid-scout/SKILL.md · rules/qualify_contract.json · kb/index/certs.json\n' +
      '工艺路径：scout 初筛打分 → 主 Agent 收敛硬门槛 → 产出 phase0.json（含 lessons_applied）\n' +
      '完成条件（门禁清单原文）：' + gateTextFor(b) + '\n' +
      '回填要求：产物 manifest 写入 ticket_id=' + id + '，status=final；完成后回看板消单。';

      '输入路径：' + base + 'data/draft/\n' +

      '缺陷背景：当前登记缺陷 ' + defectCount(b) + '\n' +
      '完成条件（门禁清单原文）：' + gateTextFor(b) + '\n' +
      '回填要求：audit-r' + r + '.json manifest 写入 ticket_id=' + id + '；阻断级必须清零方可推进会。';

      '任务目标：为 ' + b.id + '（' + b.client + ' · ' + b.proj + '）执行归档提案：supersession 标注 + 脱敏。\n' +
      '输入路径：' + base + 'archive/ · ' + base + 'inbox/\n' +

  }
  if (tpl === 'kb 初始化') {

      '任务目标：初始化 / 更新 kb 索引（bids_history / certs / people / cases）。\n' +

      '完成条件：索引 JSON 通过 validator；指纹齐全\n' +

  }
  return '【工单 · queue 批处理】' + id + '\n' +
    '任务目标：批处理 queue/ 待办工单（当前 1 张待处理）。\n' +

function saveConfig() {
  const c1 = $('#cfg-c1').value.trim(), c2 = $('#cfg-c2').value.trim();
  let ok = true;
  const timeOk = (v) => /^\d{1,2}:\d{2}$/.test(v);
  if (!timeOk(c1) || !timeOk(c2)) {
    $('#cfg-c1').classList.add('err'); $('#cfg-c2').classList.add('err');
    $('#cfg-status').textContent = '抓取时间格式应为 HH:MM';
    $('#cfg-status').style.color = 'var(--danger)';
    ok = false;
  } else { $('#cfg-c1').classList.remove('err'); $('#cfg-c2').classList.remove('err'); }
  const scoreV = Number($('#cfg-score').value);
  const scoreEl = $('#err-score');
  if (!Number.isFinite(scoreV) || scoreV < 0 || scoreV > 100) {
    scoreEl.textContent = '评分阈值需在 0 - 100 之间'; scoreEl.style.display = 'inline'; $('#cfg-score').classList.add('err'); ok = false;
  } else { scoreEl.style.display = 'none'; $('#cfg-score').classList.remove('err'); }
  const leadV = Number($('#cfg-lead').value);
  const leadEl = $('#err-lead');
  if (!Number.isFinite(leadV) || leadV < 1 || leadV > 365) {
    leadEl.textContent = '预警提前期需为 1 - 365 天'; leadEl.style.display = 'inline'; $('#cfg-lead').classList.add('err'); ok = false;
  } else { leadEl.style.display = 'none'; $('#cfg-lead').classList.remove('err'); }
  if (!ok) return;
  const diffs = [];
  if (CFG.capture[0] !== c1 || CFG.capture[1] !== c2) diffs.push('抓取时间 ' + CFG.capture.join(' / ') + ' → ' + c1 + ' / ' + c2);
  if (CFG.score !== scoreV) diffs.push('评分阈值 ' + CFG.score + ' → ' + scoreV);
  if (CFG.leadDays !== leadV) diffs.push('预警提前期 ' + CFG.leadDays + ' → ' + leadV + ' 天');
  const tishi = $('#cfg-tishi').checked;
  if (CFG.tishi !== tishi) diffs.push('题述开关 ' + (CFG.tishi ? '开' : '关') + ' → ' + (tishi ? '开' : '关'));
  CFG.capture = [c1, c2]; CFG.score = scoreV; CFG.leadDays = leadV; CFG.tishi = tishi;
  if (!diffs.length) {
    toast('无变更', '当前值与 config.json 一致', 'info');
    $('#cfg-status').textContent = '无变更';
    $('#cfg-status').style.color = '';
    return;
  }
  toast('配置已保存（config.json）', diffs.join(' · '), 'ok');
  $('#cfg-status').textContent = '已保存 ' + hhmmss(demoNow()) + ' · config.update 留痕';
  $('#cfg-status').style.color = 'var(--ok)';
  pushLog('info', 'config', 'config.update：' + diffs.join('；'));
}

    case 'cfg-save': saveConfig(); break;
    case 'trig': runTrigger(el); break;
    case 'proposal-open': openProposalModal(); break;
    case 'proposal-approve': approveProposal(); break;
    case 'proposal-reject': rejectProposal(); break;
    default: break;
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.closest('[data-f]')) {
    const f = el.closest('[data-f]').dataset.f;
    if (f === 'pipe-client') { ST.pipeClient = el.value; renderView(); }
    else if (f === 'pipe-sort') { ST.pipeSort = el.value; renderView(); }
    else if (f === 'bid-sel') { ST.selBid = el.value; ST.selGate = null; renderView(); }
    else if (f === 'asset-filter') { ST.assetFilter = el.value; renderView(); }
  }
  if (el.id === 'cfg-tishi') { const t = $('#tishi-txt'); if (t) t.textContent = el.checked ? '开' : '关'; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (_modalOpen) { closeModal(); e.preventDefault(); return; }
    if (drawerOpen()) { closeDrawer(); e.preventDefault(); return; }
    $$('.gate-mark .gpop').forEach((p) => p.remove());
  }
  if (e.key === 'Tab' && _modalOpen) { trapTab(e); return; }
  if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.a && e.target.getAttribute('role') === 'button') {
    e.preventDefault(); e.target.click(); return;
  }
  const tag = (e.target && e.target.tagName) || '';
  if (/^[1-7]$/.test(e.key) && !_modalOpen && !drawerOpen() && tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') {
    const views = ['pipeline', 'deep', 'today', 'assets', 'leads', 'digest', 'system'];
    setView(views[Number(e.key) - 1]);
  }
});

/* ============ 启动 ============ */
function init() {
  try {
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));
    if (h.get('view')) ST.view = h.get('view');
    if (h.get('bid')) ST.selBid = h.get('bid');
    if (h.get('sys')) ST.sysTab = h.get('sys');
    if (h.get('dom')) ST.assetDomain = h.get('dom');
    if (h.get('ltab')) ST.leadsTab = h.get('ltab');
    if (h.get('day')) ST.digDay = h.get('day');
  } catch (e) { /* noop */ }
  tickClock();
  setView(ST.view);
  setTimeout(() => {
    const sk = $('#skel');
    if (sk) { sk.classList.add('off'); setTimeout(() => sk.remove(), 320); }
  }, 620);
}
init();
</script>
