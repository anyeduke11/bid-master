<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V1 投标工作台 · 方案C · 无限画布</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #111110;
    --bg-subtle: #191918;
    --surface: #1e1e1d;
    --surface-raised: #252524;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --accent: #7FA5EC;
    --accent-dim: rgba(127,165,236,0.15);
    --text: #e8e6e3;
    --text-secondary: rgba(232,230,227,0.6);
    --text-tertiary: rgba(232,230,227,0.32);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1.5px var(--accent);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --font-sans: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "JetBrains Mono", "Cascadia Code", monospace;
    --note-bg: #2a2520;
    --note-border: rgba(127,165,236,0.25);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    mix-blend-mode: overlay;
  }

  /* ===== canvas viewport ===== */
  .canvas-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
  }
  .canvas-viewport.panning { cursor: grabbing; }

  .canvas-world {
    position: absolute;
    left: 0; top: 0;
    width: 20000px; height: 20000px;
    transform-origin: 0 0;
    will-change: transform;
  }

  /* ===== dot grid ===== */
  .canvas-viewport {
    --grid-color: rgba(255,255,255,0.04);
  }

  /* ===== draggable elements ===== */
  .canvas-el {
    position: absolute;
    cursor: grab;
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging {
    cursor: grabbing;
    z-index: 999;
    box-shadow: var(--shadow-drag) !important;
    transform: scale(1.01);
    transition: none;
  }

  /* ===== section header ===== */
  .section-header {
    position: absolute;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 16px;
    white-space: nowrap;
  }
  .section-header .section-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--accent);
    opacity: 0.8;
  }
  .section-header .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .section-header .section-line {
    flex: none;
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
    opacity: 0.3;
  }

  /* ===== title ===== */
  .canvas-title {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.025em;
    color: var(--text);
  }

  /* ===== text block ===== */
  .canvas-text {
    position: absolute;
    line-height: 1.7;
    letter-spacing: 0.005em;
    color: var(--text-secondary);
    min-width: 200px;
    max-width: 560px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ===== tag ===== */
  .canvas-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: border-color var(--transition-fast), background var(--transition-fast);
    white-space: nowrap;
  }
  .canvas-tag:hover {
    border-color: var(--border-hover);
    background: var(--surface-raised);
  }
  .canvas-tag .tag-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* ===== context card ===== */
  .context-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    min-width: 220px;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .context-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .context-card .card-head {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .context-card .card-head .head-indicator {
    width: 3px;
    height: 16px;
    border-radius: 2px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .context-card .card-head h3 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .context-card .card-content {
    padding: 0 20px 20px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
  }
  .context-card .card-content ul {
    list-style: none;
    padding: 0;
  }
  .context-card .card-content li {
    padding: 4px 0;
    padding-left: 12px;
    position: relative;
  }
  .context-card .card-content li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 11px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-tertiary);
  }

  /* ===== design system card ===== */
  .ds-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .ds-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .ds-card .ds-head {
    padding: 16px 20px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .ds-card .ds-body {
    padding: 0 20px 20px;
  }

  /* color type */
  .ds-card .color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
    gap: 8px;
  }
  .ds-card .color-chip {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    position: relative;
    transition: transform var(--transition-fast);
  }
  .ds-card .color-chip:hover { transform: scale(1.08); }
  .ds-card .color-chip .chip-label {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    white-space: nowrap;
  }

  /* typography type */
  .ds-card .type-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .ds-card .type-row {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .ds-card .type-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    min-width: 36px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .ds-card .type-sample {
    color: var(--text);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===== color swatch (standalone) ===== */
  .color-swatch-group {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 20px;
  }
  .swatch-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .swatch-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  }
  .swatch-circle:hover {
    transform: scale(1.1);
    box-shadow: var(--shadow-md);
  }
  .swatch-name {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-secondary);
    text-align: center;
  }
  .swatch-hex {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    text-align: center;
  }

  /* ===== type sample (standalone) ===== */
  .type-sample-group {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 400px;
  }
  .type-sample-row {
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .type-sample-meta {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    min-width: 48px;
    flex-shrink: 0;
    letter-spacing: 0.04em;
  }
  .type-sample-text {
    color: var(--text);
    line-height: 1.25;
  }

  /* ===== note (sticky) ===== */
  .canvas-note {
    background: var(--note-bg);
    border: 1px solid var(--note-border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    min-width: 200px;
    max-width: 300px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-note:hover {
    box-shadow: var(--shadow-md);
  }
  .canvas-note .note-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.7;
    margin-bottom: 8px;
  }
  .canvas-note .note-body {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-secondary);
  }

  /* ===== design page ===== */
  .design-page {
    background: #fff;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    transition: box-shadow var(--transition-normal);
  }
  .design-page:hover {
    box-shadow: 0 16px 56px rgba(0,0,0,0.5), 0 6px 16px rgba(0,0,0,0.35);
  }
  .design-page .page-content {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .page-label {
    position: absolute;
    bottom: -32px;
    left: 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-tertiary);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .page-label .label-num {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    opacity: 0.6;
  }

  /* ===== diagram ===== */
  .canvas-diagram {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .canvas-diagram .diagram-content {
    width: 100%;
    height: 100%;
    padding: 20px;
  }

  /* ===== zoom controls ===== */
  .zoom-controls {
    position: fixed;
    bottom: 24px; right: 24px;
    display: flex;
    align-items: center;
    gap: 1px;
    z-index: 100;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .zoom-btn {
    width: 36px; height: 36px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .zoom-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }
  .zoom-btn:active {
    background: rgba(255,255,255,0.03);
  }
  .zoom-label {
    min-width: 50px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ===== coord indicator ===== */
  .coord-indicator {
    position: fixed;
    bottom: 28px; left: 24px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--text-tertiary);
    z-index: 100;
    padding: 4px 10px;
    background: rgba(17,17,16,0.85);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* ===== keyboard hint ===== */
  .kbd-hint {
    position: fixed;
    top: 20px; right: 24px;
    z-index: 100;
    font-size: 10px;
    color: var(--text-tertiary);
    display: flex;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .canvas-viewport:hover ~ .kbd-hint { opacity: 1; }
  .kbd-hint kbd {
    font-family: var(--font-mono);
    padding: 2px 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 10px;
  }
</style>
</head>
<body>

<div class="canvas-viewport" id="viewport">
  <div class="canvas-world" id="world"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomOut" aria-label="">&#8722;</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomIn" aria-label="">+</button>
  <button class="zoom-btn" id="zoomReset" title="" aria-label="">&#8962;</button>
</div>

<div class="coord-indicator" id="coordIndicator">0, 0</div>

<div class="kbd-hint" id="kbdHint"></div>

<script>
(() => {
  // ═══════════════════════════════════════════════════════════
  // LOCALIZE: instantiating agent MUST translate every value in
  // UI_STRINGS to the user's conversation language. Machine fields
  // (id/class/data-*) remain English.
  // ═══════════════════════════════════════════════════════════
  const UI_STRINGS = {
    projectDescription: '投标工作台「仪表间」：把投标当作精密工序来管理——每条标在 S0–S9 标尺上走表，每道门禁是检验站，每个产物有编号、有指纹、可追溯。\n冷白 / 石墨 · 信号蓝 · 分段标尺 · 检验单深潜 · 精工表格。',
    tags: ['投标管理后台', '分段标尺 S0–S9', '检验单式深潜', '门禁与工单', '精工表格', '等宽读数', '全链路可追溯'],
    contextCards: {
      coreFeatures: { title: '用户与场景', items: ['投标工程师 / 售前：同时跟进 6–10 条标', '痛点：阶段不透明、门禁靠人盯、产物难追溯', '目标：从线索到归档全程读数可查'] },
      techHighlights: { title: '核心链路', items: ['管线总览 → 点击标的卡深潜', '深潜检验单 → 推进 / 拦截 / 工单', '今日必办回跳深潜，逐条消卡点', '商机线索升级入库成为正式标'] },
      deliveryStandards: { title: '本方案设计突破', items: ['分段标尺：S0–S9 十段刻度，指针 / 断层一眼读数', '检验单式深潜：判定 / 证据 / 时间三栏可核查', '精工表格：数字右对齐等宽，结构即装饰'] },
    },
    notes: {
      designPhilosophy: { tag: '数据基准', body: '演示数据 · 基准 2026-09-11 09:12；本机单用户运行，所有读数为只读投影。' },
      remark: { tag: '阅读提示', body: 'Row 3 按交互链路排列（01→10）；03 / 04 是同一标的的两条分支：被拦与生成工单。' },
    },
    typeSamples: {
      heading: '工序总览',
      subheading: '管线漏斗',
      bodyText: '每条标在标尺上走表，每道门禁是检验站。',
      caption: '产物有编号、有指纹、可追溯。',
    },
    pages: {
      home: { label: '首页', heading: '欢迎来到无限画布', cta: '开始浏览' },
      discover: { label: '发现', todayPick: '今日精选' },
      cards: {
        designSystemIntro: { title: '设计系统基础', desc: '从零构建完整设计语言' },
        colorTheory: { title: '色彩理论', desc: '理解 oklch 与和谐色板' },
        typographyRhythm: { title: '排版节奏', desc: '行高、字距与呼吸感' },
      },
      profile: { label: '我的', name: '设计师', role: '产品设计 · 3 个项目', items: ['我的项目', '设计规范', '设置'] },
    },
    docTitle: 'V1 投标工作台 · 方案C · 无限画布',
    zoom: { zoomIn: '放大', zoomOut: '缩小', reset: '重置视图' },
    kbdHints: [['滚动', '平移'], ['\u2318滚动', '缩放'], ['\u2318Z', '撤销']],
    sections: { context: '01 项目背景', designSystem: '02 设计系统', deliverables: '03 设计稿' },
    demoTitle: '投标工作台 · 仪表间',
    designSystemCards: {
      colorTitle: '色板 · TOKENS',
      typographyTitle: '字体 · 字号阶梯',
      componentsTitle: '组件 · 工装件',
      swatchNames: ['交互色', '面板', '内凹区', '主文字', '刻度/占位', '结构线'],
      typeMeta: { h1: 'H1', h2: 'H2', body: 'Body', caption: 'Caption' },
      componentSamples: { primary: '推进阶段', secondary: '生成工单', inputPlaceholder: '筛选标的 / 编号…' },
    },
    hello: '你好',
  };

  // Chrome strings live in UI_STRINGS too — applied here so the static HTML
  // above carries no visible copy at all (machine-checkable invariant).
  document.title = UI_STRINGS.docTitle;
  document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
  document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);
  document.getElementById('zoomReset').setAttribute('aria-label', UI_STRINGS.zoom.reset);
  document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints
    .map(([keys, action]) => `<span><kbd>${keys}</kbd> ${action}</span>`)
    .join('');

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  /* ===== canvas state ===== */
  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }

  /* ===== dot grid ===== */
  function updateGrid() {
    const g = 40 * zoom;
    const ox = panX % g, oy = panY % g;
    viewport.style.backgroundImage = `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${ox}px ${oy}px`;
  }

  /* ===== panning ===== */
  let isPanning = false, panSX, panSY;

  viewport.addEventListener('pointerdown', (e) => {
    if (e.target === viewport || e.target === world) {
      isPanning = true;
      panSX = e.clientX - panX;
      panSY = e.clientY - panY;
      viewport.classList.add('panning');
      viewport.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!isPanning) return;
    panX = e.clientX - panSX;
    panY = e.clientY - panSY;
    updateTransform();
  });
  viewport.addEventListener('pointerup', () => {
    isPanning = false;

      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    } else {
      const hasX = Math.abs(e.deltaX) > 0.5;
      if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) {
        panX -= e.deltaX;
        panY -= e.deltaY;
      } else {
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
        const factor = e.deltaY > 0 ? 0.95 : 1.05;
        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));

/* 精工表格 */

.pgx .pt tbody tr{transition:background 120ms}
.pgx .pt tbody tr:hover{background:var(--hover)}
.pgx .pt tbody tr.clickable{cursor:pointer}
.pgx .pt .num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.pgx .pt .td-main{font-weight:500;color:var(--ink)}

.pgx .pt tfoot td{background:var(--sunken);border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
.pgx .table-note{font-size:11px;color:var(--ink-4);margin-top:6px;letter-spacing:.02em}

/* 状态方点 */
.pgx .st-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}

.pgx .st-ok::before{background:var(--ok)}
.pgx .st-warn::before{background:var(--warn)}
.pgx .st-danger::before{background:var(--danger)}
.pgx .st-idle::before{background:var(--ink-4)}

/* 空态（检验完成/无记录） */
.pgx .empty-box{border:1px dashed var(--line);border-radius:var(--r4);padding:22px 18px;text-align:center;background:var(--surface)}
.pgx .empty-box .em-t{font-family:var(--font-data);font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.pgx .empty-box .em-s{font-size:11.5px;color:var(--ink-4);margin-top:4px}
.pgx .empty-cell{padding:14px 12px;font-family:var(--font-data);font-size:11px;color:var(--ink-4);letter-spacing:.03em}

/* ===== V1 管线 ===== */
.pgx .vhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:6px}
.pgx .vhead .vt{font-size:20px;font-weight:600;letter-spacing:.01em}
.pgx .vhead .vs{font-size:12px;color:var(--ink-3);margin-top:3px;max-width:620px}
.pgx .vhead .vright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pgx .fgroup{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);padding:2px}
.pgx .fbtn{height:24px;padding:0 10px;font-size:11.5px;color:var(--ink-2);border-radius:var(--r2);letter-spacing:.02em}

.pgx .fbtn.on{background:var(--ink);color:#fff}
.pgx .fselect{height:30px;border:1px solid var(--line);border-radius:var(--r4);background-color:var(--surface);padding:0 8px;font-size:12px;color:var(--ink);box-shadow:var(--shadow-btn)}

.pgx .pipe-grid{display:grid;grid-template-columns:1fr 296px;gap:18px;margin-top:16px;align-items:start}
.pgx .matrix{border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);overflow:hidden}

.pgx .prow-head:hover{background:var(--hover)}

.pgx .prow-head .pm.num{text-align:right}
.pgx .prow-head .pm .pm-u{font-size:10px;color:var(--ink-4);margin-left:2px;font-family:var(--font-ui)}
.pgx .prow-head .pgate{display:flex;gap:6px;align-items:center}
.pgx .prow-head .pkey{font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgx .prow-head .pkey .kmono{font-family:var(--font-data);font-size:11px;color:var(--ink-4);margin-left:6px}
.pgx .prow-head .pcaret{color:var(--ink-4);display:flex;justify-content:center;transition:transform 120ms}

.pgx .prow-exp{display:none;padding:4px 14px 16px;background:linear-gradient(180deg,var(--surface) 0%,#fcfcfd 100%)}

.pgx .pipe-cards{display:flex;gap:12px;flex-wrap:wrap;padding-top:8px}
.pgx .bidcard{width:322px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);padding:11px 12px 10px;transition:border-color 120ms,box-shadow 120ms,transform 120ms;position:relative}

.pgx .bidcard .bc-span{margin-left:auto;display:flex;gap:5px}

.pgx .badge-btn{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:var(--r2);border:1px solid;font-size:10.5px;letter-spacing:.03em}

.pgx .s9-strip{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);margin-top:12px}

.pgx .dive-ro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0 24px;margin-top:18px}

.pgx .dive-side{min-width:0}
.pgx .scale-wrap{position:relative;padding-top:34px;margin-top:10px}
.pgx .scale{display:grid;grid-template-columns:repeat(10,1fr);position:relative}
.pgx .seg{position:relative;padding:0 0 0 0;text-align:left;cursor:pointer;border-left:1px solid var(--line-soft)}
.pgx .seg:first-child{border-left:none}

.pgx .seg .seg-ticks{display:block;height:8px;margin:0 6px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12.5%)}

.pgx .seg.seg-passed .seg-bar{border-color:var(--ink);background:var(--ink)}
.pgx .seg.seg-current .seg-bar{border-color:var(--accent);background:var(--accent)}
.pgx .seg .seg-code{display:block;margin:6px 6px 0;font-family:var(--font-data);font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}

.pgx .scale-legend{display:flex;gap:18px;align-items:center;margin-top:14px;padding-top:10px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.pgx .leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}

.pgx .gate-table td .ev{color:var(--ink-2)}

.pgx .def-summary{display:flex;gap:22px;flex-wrap:wrap;padding:10px 0 2px}

.pgx .trace-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.pgx .trace-item:last-child{border-bottom:none}
.pgx .trace-item .tr-n{font-family:var(--font-data);font-size:11px;color:var(--ink-4);width:56px;flex:none;padding-top:1px}
.pgx .trace-item .tr-m{flex:1;min-width:0}
.pgx .trace-item .tr-t{font-size:12px}
.pgx .trace-item .tr-s{font-size:11px;color:var(--ink-3);margin-top:2px}
.pgx .gap-card{border:1px solid #dfc39b;background:var(--warn-tint);border-radius:var(--r4);padding:10px 12px;margin-top:10px}

.pgx .subtab .cnt{font-family:var(--font-data);font-size:10.5px;color:var(--ink-4)}
.pgx .subtab.on .cnt{color:rgba(255,255,255,.6)}
.pgx .subtab-mode{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);width:max-content;overflow:hidden;margin-top:14px}
.pgx .dom-bar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pgx .dom-bar .dom-readouts{display:flex;gap:26px;flex-wrap:wrap}
.pgx tr.row-warn td{background:#fdf9f1}
.pgx tr.row-warn:hover td{background:#faf3e6}
.pgx .occ-list{display:flex;gap:5px;flex-wrap:wrap}
.pgx .occ-tag{height:19px;padding:0 6px;border:1px solid var(--line);border-radius:var(--r2);background:var(--sunken);font-size:10.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;font-family:var(--font-data)}
.pgx .occ-tag.hot{border-color:#b9cdec;background:var(--accent-tint);color:var(--accent)}

/* ===== V5 商机 ===== */
.pgx .leads-grid{display:grid;grid-template-columns:432px 1fr;gap:18px;margin-top:16px;align-items:start}
.pgx .lead-list{border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);overflow:hidden}
.pgx .lead-row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;width:100%;text-align:left;transition:background 120ms;align-items:center}
.pgx .lead-row:last-child{border-bottom:none}
.pgx .lead-row:hover{background:var(--hover)}
.pgx .lead-row.on{background:var(--accent-tint);box-shadow:inset 2px 0 0 var(--accent)}
.pgx .lead-row .lr-main{flex:1;min-width:0}
.pgx .lead-row .lr-t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.pgx .lead-row .lr-s{font-size:11.5px;color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgx .lead-row .lr-score{font-family:var(--font-data);font-size:16px;color:var(--ink);text-align:right;flex:none}
.pgx .lead-row .lr-score .sc-u{display:block;font-size:9.5px;color:var(--ink-4);text-align:right;letter-spacing:.06em}
.pgx .lead-detail{border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);min-height:420px;display:flex;flex-direction:column}
.pgx .ld-head{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.pgx .ld-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pgx .ld-sub{font-size:12px;color:var(--ink-3);margin-top:5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.pgx .ld-facts{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.pgx .ld-fact{padding:12px 18px;border-right:1px solid var(--line-soft)}
.pgx .ld-fact:last-child{border-right:none}
.pgx .ld-body{padding:16px 18px;flex:1}
.pgx .quote{border:1px solid var(--line);background:var(--sunken);border-radius:var(--r4);padding:11px 13px;font-size:12.5px;line-height:1.75;color:var(--ink-2);margin-top:8px}
.pgx .quote .q-src{display:block;margin-top:6px;font-family:var(--font-data);font-size:10.5px;color:var(--ink-4)}
.pgx .ld-actions{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.pgx .evidence-fs{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.7}
.pgx .kv{display:flex;gap:10px;font-size:12px;padding:5px 0}
.pgx .kv .k{color:var(--ink-3);width:84px;flex:none}
.pgx .kv .v{color:var(--ink-2);font-family:var(--font-data);font-size:12px}

/* ===== V6 简报 ===== */
.pgx .report{max-width:860px;margin:0 auto;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);padding:26px 32px 22px;margin-top:16px}
.pgx .rpt-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pgx .rpt-head .rpt-id{font-family:var(--font-data);font-size:13px;font-weight:600;letter-spacing:.04em}
.pgx .rpt-head .rpt-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pgx .rpt-title{font-size:19px;font-weight:600;margin-top:16px}
.pgx .rpt-meta{font-family:var(--font-data);font-size:11px;color:var(--ink-4);margin-top:5px;letter-spacing:.02em}
.pgx .rpt-sec{margin-top:18px}
.pgx .rpt-sec .rs-t{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px;display:flex;gap:8px;align-items:baseline}
.pgx .rpt-sec .rs-t .rs-en{font-family:var(--font-label);font-size:9.5px;letter-spacing:.08em;color:var(--ink-4);text-transform:uppercase}
.pgx .rpt-sec p{font-size:13px;line-height:1.85;color:var(--ink-2);margin-top:9px}
.pgx .kd-list{list-style:none;margin-top:10px;counter-reset:kd}
.pgx .kd-list li{position:relative;padding:9px 0 9px 34px;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--ink-2);line-height:1.7}
.pgx .kd-list li::before{counter-increment:kd;content:"0" counter(kd);position:absolute;left:0;top:10px;font-family:var(--font-data);font-size:11px;color:var(--ink-4)}
.pgx .kd-list li .kd-tag{margin-right:8px}
.pgx .rpt-foot{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink-4);font-family:var(--font-data)}

/* ===== V7 系统 ===== */
.pgx .trigger-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);padding:9px 12px;margin-top:14px}
.pgx .trigger-bar .tb-lbl{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-3);margin-right:4px}
.pgx .trig-btn{height:28px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:all 120ms}
.pgx .trig-btn:hover{border-color:#b7bbc3;background:var(--hover)}
.pgx .trig-btn .st{font-family:var(--font-data);font-size:10.5px;color:var(--ink-4)}
.pgx .trig-btn.running{border-color:#b9cdec;background:var(--accent-tint);color:var(--accent);pointer-events:none}
.pgx .log-table td{white-space:nowrap}
.pgx .log-table td.lg-msg{white-space:normal;min-width:320px;color:var(--ink-2)}
.pgx .log-lvl{font-family:var(--font-data);font-size:11px;padding:1px 6px;border-radius:var(--r2);border:1px solid}
.pgx .lvl-info{color:var(--ink-2);border-color:var(--line);background:var(--sunken)}
.pgx .lvl-warn{color:var(--warn);border-color:#dfc39b;background:var(--warn-tint)}
.pgx .lvl-error{color:var(--danger);border-color:#e0aca6;background:var(--danger-tint)}
.pgx .cfg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.pgx .field{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.pgx .field .f-label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:5px}
.pgx .field .f-hint{font-size:11px;color:var(--ink-4);margin-top:5px;line-height:1.6}
.pgx .field .f-req{color:var(--danger);margin-left:3px}
.pgx .finput{width:100%;height:32px;border:1px solid var(--line);border-radius:var(--r4);background:var(--sunken);padding:0 10px;font-size:12.5px;transition:border-color 120ms,background 120ms}
.pgx .finput:focus{background:var(--surface);border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-tint)}
.pgx .finput[disabled]{color:var(--ink-4);background:var(--bg);border-color:var(--line-soft);cursor:not-allowed}
.pgx .finput.err{border-color:var(--danger);background:var(--danger-tint)}
.pgx .frow{display:flex;gap:10px;align-items:center}
.pgx .frow .fsep{color:var(--ink-4);font-family:var(--font-data)}
.pgx textarea.finput{height:auto;min-height:74px;padding:8px 10px;resize:vertical;line-height:1.6}
.pgx .f-error{display:none;font-size:11.5px;color:var(--danger);margin-top:5px}
.pgx .f-error.show{display:block}
.pgx .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px}
.pgx .switch .sw-track{width:34px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background 120ms;border:1px solid var(--line)}
.pgx .switch .sw-knob{position:absolute;top:1.5px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(21,24,30,.25);transition:left 120ms}
.pgx .switch.on .sw-track{background:var(--accent);border-color:var(--accent)}
.pgx .switch.on .sw-knob{left:18px}
.pgx .switch[aria-disabled="true"]{cursor:not-allowed;opacity:.55}
.pgx .cfg-foot{margin-top:16px;display:flex;align-items:center;gap:10px}
.pgx .cfg-dirty{font-size:11.5px;color:var(--warn);font-family:var(--font-data)}
.pgx .proposal-card{border:1px solid var(--line);border-radius:var(--r4);background:var(--surface);padding:14px 16px;margin-top:10px}
.pgx .proposal-card .pc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pgx .proposal-card .pc-id{font-family:var(--font-data);font-size:12px;color:var(--ink-2);font-weight:600}
.pgx .proposal-card .pc-t{font-size:13.5px;font-weight:600}
.pgx .proposal-card .pc-meta{font-size:11.5px;color:var(--ink-3);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.pgx .proposal-card .pc-actions{margin-top:12px;display:flex;gap:8px}
.pgx .diff-line{font-family:var(--font-data);font-size:11.5px;line-height:1.8;padding:1px 6px;border-radius:2px}
.pgx .diff-add{background:var(--ok-tint);color:#17683b;display:block}
.pgx .diff-del{background:var(--danger-tint);color:#9c271d;display:block;text-decoration:line-through;text-decoration-color:rgba(156,39,29,.4)}
.pgx .diff-ctx{color:var(--ink-3);display:block}
.pgx .flow-steps{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-top:10px}
.pgx .fstep{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3)}
.pgx .fstep .fs-dot{width:9px;height:9px;border:1.5px solid var(--ink-4);background:var(--surface);flex:none}
.pgx .fstep.done{color:var(--ink-2)}
.pgx .fstep.done .fs-dot{background:var(--ink);border-color:var(--ink)}
.pgx .fstep.done-cur .fs-dot{background:var(--accent);border-color:var(--accent)}
.pgx .fstep .fs-conn{width:26px;height:1px;background:var(--line);margin:0 9px}
.pgx .ticket-detail{border-top:1px dashed var(--line-soft);margin-top:2px}
.pgx .ticket-detail td{background:#fbfbfc}

/* ===== 模态 / 弹层 ===== */
.pgx .overlay{position:fixed;inset:0;background:rgba(21,24,30,.32);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:56px 20px 30px;overflow-y:auto}
.pgx .overlay[hidden]{display:none}
.pgx .modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);box-shadow:0 18px 48px rgba(21,24,30,.18),0 4px 12px rgba(21,24,30,.10);width:520px;max-width:100%;animation:modalin 140ms ease-out}
@keyframes modalin{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
.pgx .modal.modal-lg{width:760px}
.pgx .modal.modal-xl{width:920px}
.pgx .modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pgx .modal-head .mh-id{font-family:var(--font-data);font-size:11px;color:var(--ink-4);letter-spacing:.04em}
.pgx .modal-head .mh-t{font-size:14.5px;font-weight:600}
.pgx .modal-head .mh-close{margin-left:auto}
.pgx .modal-body{padding:16px 18px;max-height:calc(100vh - 240px);overflow-y:auto}
.pgx .modal-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pgx .modal-foot .mf-note{margin-right:auto;font-size:11.5px;color:var(--ink-3);max-width:60%}
.pgx .modal-foot .mf-note.danger{color:var(--danger)}
.pgx .check-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r4);overflow:hidden}
.pgx .check-item{display:flex;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.pgx .check-item:last-child{border-bottom:none}
.pgx .check-item .ck-no{font-family:var(--font-data);font-size:11px;color:var(--ink-4);width:20px;flex:none;padding-top:2px}
.pgx .check-item .ck-main{flex:1;min-width:0}
.pgx .check-item .ck-t{font-size:12.5px;font-weight:500}
.pgx .check-item .ck-ev{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.65}
.pgx .check-item .ck-time{font-family:var(--font-data);font-size:10.5px;color:var(--ink-4);flex:none;padding-top:2px;white-space:nowrap}
.pgx .ticket-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.pgx .ticket-form .tf-row{padding:9px 0;border-bottom:1px solid var(--line-soft)}
.pgx .ticket-form .tf-row:last-child{border-bottom:none}
.pgx .ticket-form .tf-k{font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--ink-4);text-transform:uppercase;font-family:var(--font-label)}
.pgx .ticket-form .tf-v{font-family:var(--font-data);font-size:12px;color:var(--ink-2);margin-top:3px;word-break:break-all}
.pgx .ticket-preview{border:1px solid var(--line);border-radius:var(--r4);background:var(--sunken);padding:13px 15px}
.pgx .ticket-preview pre{font-family:var(--font-data);font-size:11.5px;line-height:1.75;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;margin:0}
.pgx .popover{position:fixed;z-index:300;background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);box-shadow:0 10px 30px rgba(21,24,30,.14);width:320px;max-width:calc(100vw - 24px)}
.pgx .popover .po-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunken);border-radius:var(--r4) var(--r4) 0 0}
.pgx .popover .po-t{font-size:12px;font-weight:600}
.pgx .popover .po-body{padding:10px 12px;font-size:12px;line-height:1.7;color:var(--ink-2)}
.pgx .popover .po-actions{padding:0 12px 12px;display:flex;gap:8px}
.pgx .drawer-overlay{position:fixed;inset:0;background:rgba(21,24,30,.24);z-index:180}
.pgx .drawer-overlay[hidden]{display:none}
.pgx .drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--surface);border-left:1px solid var(--line);z-index:181;display:flex;flex-direction:column;box-shadow:-14px 0 36px rgba(21,24,30,.12);animation:drawerin 160ms ease-out}
@keyframes drawerin{from{transform:translateX(14px);opacity:.5}to{transform:none;opacity:1}}
.pgx .drawer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pgx .drawer-head .dr-id{font-family:var(--font-data);font-size:11px;color:var(--ink-4)}
.pgx .drawer-body{padding:14px 16px;overflow-y:auto;flex:1}
.pgx .drawer-body .dv-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.pgx .drawer-body .dv-row .dv-k{width:92px;flex:none;color:var(--ink-3)}
.pgx .drawer-body .dv-row .dv-v{color:var(--ink-2);font-family:var(--font-data);font-size:11.5px;word-break:break-all}
.pgx .drawer-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}

/* Toast */
.pgx #toastRoot{position:fixed;right:18px;bottom:18px;z-index:400;display:flex;flex-direction:column;gap:8px;width:340px;max-width:calc(100vw - 24px)}
.pgx .toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink-3);border-radius:var(--r4);padding:10px 12px 10px 14px;box-shadow:0 8px 26px rgba(21,24,30,.14);display:flex;gap:10px;align-items:flex-start;animation:toastin 140ms ease-out}
@keyframes toastin{from{transform:translateY(6px);opacity:.5}to{transform:none;opacity:1}}
.pgx .toast .ts-main{flex:1;min-width:0}
.pgx .toast .ts-t{font-size:12.5px;color:var(--ink);line-height:1.6}
.pgx .toast .ts-s{font-size:11px;color:var(--ink-3);margin-top:2px;font-family:var(--font-data)}
.pgx .toast.ok{border-left-color:var(--ok)}
.pgx .toast.warn{border-left-color:var(--warn)}
.pgx .toast.danger{border-left-color:var(--danger)}
.pgx .toast.info{border-left-color:var(--accent)}
.pgx .toast .ts-x{color:var(--ink-4);flex:none}
.pgx .toast .ts-x:hover{color:var(--ink)}

/* 骨架屏 */
.pgx #skeleton{position:fixed;inset:0;z-index:500;background:var(--bg);display:grid;grid-template-columns:220px 1fr}
.pgx #skeleton[hidden]{display:none}
.pgx .sk-nav{background:var(--surface);border-right:1px solid var(--line);padding:18px}
.pgx .sk-body{padding:20px 24px}
.pgx .sk-block{background:var(--sunken);border-radius:var(--r2);animation:skpulse 1.1s ease-in-out infinite}
@keyframes skpulse{0%,100%{opacity:1}50%{opacity:.55}}

/* 响应式 */






/* ============================================================
   帧适配覆写（画布专用，A2）
   ============================================================ */
.pgx{position:relative;overflow:hidden}
.pgx .overlay,.pgx .popover,.pgx .drawer-overlay,.pgx .drawer,
.pgx #toastRoot,.pgx #skeleton{position:absolute !important}
.pgx .drawer{max-width:400px !important}
.pgx .app{height:900px !important}
.pgx .modal-body{max-height:660px !important}
.pgx .popover{max-width:320px !important}
.pgx #toastRoot{max-width:340px !important}

/* 组件卡演示用的伪 focus 态（静态展示） */
.pgx .finput.demo-focus{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint)}

/* ============================================================
   手机帧（.pgx-m）补丁：媒体规则去条件后的最终覆盖
   ============================================================ */
.pgx-m .app{height:844px !important}
.pgx-m .modal-body{max-height:640px !important}

/* ===== 手机帧媒体规则（去条件 · 作用域 .pgx-m） ===== */

  .pgx-m .app{grid-template-columns:190px 1fr}
  .pgx-m .readouts .ro{padding:0 10px}
  .pgx-m .dive-grid{grid-template-columns:1fr 280px}


  .pgx-m .dive-grid{grid-template-columns:1fr}
  .pgx-m .pipe-grid{grid-template-columns:1fr}
  .pgx-m .pipe-side{position:static}
  .pgx-m .leads-grid{grid-template-columns:1fr}
  .pgx-m .dive-ro-row{grid-template-columns:repeat(2,1fr);gap:14px 24px}
  .pgx-m .stats-row{grid-template-columns:repeat(2,1fr);gap:14px 24px}
  .pgx-m .cfg-grid{grid-template-columns:1fr}
  .pgx-m .ticket-grid{grid-template-columns:1fr}


  .pgx-m .app{grid-template-columns:62px 1fr}
  .pgx-m .brand{padding:14px 10px;text-align:center}
  .pgx-m .brand .brand-name{display:block}
  .pgx-m .brand .brand-name .bn-full, .pgx-m .brand .brand-name .bm, .pgx-m .brand .brand-sub{display:none}
  .pgx-m .nav-item{justify-content:center;padding:8px 6px}
  .pgx-m .nav-item .n, .pgx-m .nav-item .t, .pgx-m .nav-item .nbadge{display:none}
  .pgx-m .nav-foot{display:none}
  .pgx-m .nav-item.active::before{left:-10px}


  .pgx-m .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .pgx-m .nav-col{flex-direction:row;align-items:center;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
  .pgx-m .brand{border-bottom:none;padding:10px 12px;flex:none}
  .pgx-m .nav-list{flex-direction:row;padding:6px 8px;gap:4px;overflow-x:auto}
  .pgx-m .nav-item{width:auto;min-width:40px;justify-content:center}
  .pgx-m .nav-item .t{display:block;font-size:11px}
  .pgx-m .nav-item .n{display:none}
  .pgx-m .nav-item.active::before{left:6px;right:6px;top:auto;bottom:2px;width:auto;height:2px}
  .pgx-m .topbar{height:auto;padding:8px 12px;flex-wrap:wrap;gap:8px}
